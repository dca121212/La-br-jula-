  singluten: ["Las patatas fritas suelen ser aptas si la freidora no comparte con croquetas: pregunta", "Los gofres, no; los mejillones y el estofado, pidiendo sin pan. Bruselas tiene Le Pain Quotidien con opciones marcadas"],
  zonas: [
    { nombre: "Grand-Place y alrededores", paradas: [
      { n: "Grand-Place", lat: 50.8467, lng: 4.3525, tags: ["Imprescindible","Historia"], precio: 0, dur: 45, d: "La plaza dorada de casas gremiales, el Ayuntamiento gótico y la Casa del Rey.", truco: "Ve de noche iluminada y a las 8 de la mañana vacía; en agosto de años pares, la alfombra de flores. Cerveza en Le Roy d'Espagne para la vista, una vez.", salseo: "Luis XIV la bombardeó en 1695 y los gremios la reconstruyeron en cuatro años, cada uno compitiendo por la casa más dorada. Marx escribió el Manifiesto Comunista en La Maison du Cygne, hoy restaurante caro.", atardecer: true },
      { n: "Manneken Pis", lat: 50.8450, lng: 4.3500, tags: ["Imprescindible"], precio: 0, dur: 15, d: "El niño de bronce de 60 centímetros que mea desde 1619, con vestuario de mil trajes.", truco: "Mira el calendario de trajes en el museo GardeRobe; la estatua original está en la Casa del Rey. Jeanneke Pis (la niña) está en un callejón de Rue des Bouchers.", salseo: "Tiene 1.000 trajes, de Elvis a un traje de cosmonauta; el primero se lo regaló Luis XV para disculparse porque sus soldados lo habían robado. Lo han robado siete veces y en 1965 lo rompieron: esta es copia." },
      { n: "Galerías Saint-Hubert", lat: 50.8477, lng: 4.3551, tags: ["Paseo","Mercado","Historia"], precio: 0, dur: 40, d: "Las galerías cubiertas de 1847, las primeras de Europa, con chocolateros, cine y librerías.", truco: "Neuhaus inventó aquí el bombón relleno en 1912 y sigue en la galería; Mokafé para un gofre de Bruselas (el ligero) sentado.", salseo: "Los hermanos Lumière hicieron aquí la primera proyección de cine fuera de Francia en 1896; el cine Galeries sigue abierto. El lema de la entrada dice 'omnibus omnia', todo para todos, y era para ricos." },
      { n: "Mont des Arts", lat: 50.8440, lng: 4.3570, tags: ["Mirador","Paseo"], precio: 0, dur: 30, d: "El jardín en escalera con la vista de la Grand-Place, el Ayuntamiento y, los días claros, el Atomium.", truco: "Sube desde la plaza por Rue de la Madeleine; la foto se hace desde la escalera de arriba con el reloj carillón a la derecha.", salseo: "Leopoldo II derribó un barrio entero para hacer este mirador y murió antes; el solar fue jardín provisional 40 años. El carillón tiene figuras de la historia belga y toca cada hora.", atardecer: true }
    ]},
    { nombre: "Sablon y museos", paradas: [
      { n: "Museos Reales de Bellas Artes", lat: 50.8419, lng: 4.3580, tags: ["Imprescindible","Museo"], precio: 15, dur: 120, d: "Brueghel el Viejo (La caída de Ícaro), los flamencos y el Museo Magritte en el mismo edificio.", truco: "Entrada combinada Old Masters + Magritte; primer miércoles de mes gratis desde las 13:00. La Marat de David está en el sótano.", salseo: "La caída de Ícaro tiene a Ícaro como dos piernas en una esquina y a nadie mirando; Auden le escribió un poema. Magritte pintaba en el comedor de casa con traje y sombrero." },
      { n: "Place du Grand Sablon", lat: 50.8410, lng: 4.3555, tags: ["Mercado","Comida","Paseo"], precio: 0, dur: 45, d: "La plaza de los anticuarios y los chocolateros (Marcolini, Wittamer) con mercadillo los fines de semana.", truco: "Pierre Marcolini para el chocolate serio; Wittamer para un pastel sentado. El mercado de antigüedades, sábado y domingo por la mañana.", salseo: "La iglesia gótica de Notre-Dame du Sablon la pagaron los ballesteros, que aún organizan el Ommegang en julio; la Virgen la trajo una mujer en barca desde Amberes tras robarla por orden divina, dice ella.", comida: true, sg: "Chocolate de Marcolini apto en muchas referencias; pregunta." },
      { n: "Palacio de Justicia y su mirador", lat: 50.8370, lng: 4.3515, tags: ["Mirador","Historia","Fuera de ruta"], precio: 0, dur: 30, d: "El edificio más grande del XIX, con cúpula, y la explanada con la vista del centro y el ascensor a los Marolles.", truco: "El ascensor público (gratis) baja a los Marolles; la explanada al atardecer mira a la basílica de Koekelberg.", salseo: "Lleva en andamios desde 1984 y los andamios están tan oxidados que hay que restaurarlos a ellos; los vecinos expropiados para construirlo inventaron el insulto 'architek'. Hitler lo quería copiar." },
      { n: "Marolles y Place du Jeu de Balle", lat: 50.8380, lng: 4.3465, tags: ["Mercado","Fuera de ruta","Bar"], precio: 0, dur: 60, d: "El barrio popular con el mercadillo de pulgas diario y bares de barrio con dialecto propio.", truco: "El mercado abre todos los días de 6 a 14 (fines de semana hasta las 15); los mejores trastos se venden antes de las 9. Café en La Brocante.", salseo: "Aquí se habla 'brusseleir', mezcla de flamenco y francés; Tintín nació en las Marolles en cierto modo, porque Hergé usaba palabras de aquí para los nombres (Syldavia). El mercado existe desde 1873 sin cerrar ni un día.", comida: true, sg: "Los bares hacen 'américain' (tartar) y patatas: fácil." }
    ]},
    { nombre: "Sainte-Catherine y cómic", paradas: [
      { n: "Place Sainte-Catherine y Mer du Nord", lat: 50.8503, lng: 4.3480, tags: ["Comida","Mercado","Imprescindible"], precio: 10, dur: 50, d: "La plaza del antiguo puerto, con la iglesia, el mercado de pescado y la barra de pescado a la plancha en la calle.", truco: "Mer du Nord: pide calamares o gambas y vino blanco de pie en la esquina, sin mesa; se paga primero. Los sábados hay mercado.", salseo: "Aquí llegaban los barcos hasta 1870 por un canal que se enterró; la Torre Negra de al lado es un trozo de muralla del XIII que se salvó porque un cura se negó a que la tiraran. El barrio era de marineros y hoy de gente guapa.", comida: true, sg: "El pescado a la plancha y las gambas son aptos; el pan aparte." },
      { n: "Centro Belga del Cómic", lat: 50.8510, lng: 4.3603, tags: ["Museo","Imprescindible"], precio: 13, dur: 75, d: "Los almacenes art nouveau de Horta llenos de Tintín, Lucky Luke y los Pitufos, y el recorrido de murales por la ciudad.", truco: "El edificio de Horta merece la entrada solo; pide el mapa de murales y sigue el de Tintín (Rue de l'Etuve) y Broussaille.", salseo: "Bélgica tiene más dibujantes de cómic por metro cuadrado que nadie; el cohete de Tintín de la escalera es el de Objetivo: la Luna, con 15 años de adelanto sobre la NASA. Hergé no dibujó Bruselas nunca: la disfrazó.", ninos: true },
      { n: "Delirium Café", lat: 50.8482, lng: 4.3530, tags: ["Bar","Comida"], precio: 0, dur: 75, d: "El bar con 2.000 cervezas del Guinness de los récords, en un callejón con Jeanneke Pis al final.", truco: "Sube al primer piso o baja al sótano, la planta baja es de despedidas; pide un Kwak en su copa de madera o una Westmalle triple.", salseo: "Están registrados con 2.004 cervezas de 60 países; la Jeanneke Pis del callejón la puso un restaurador en 1987 'por igualdad de sexos'. Se pierde una copa Kwak cada 40 minutos por gente que intenta beberla sin soporte.", comida: true, sg: "Hay sidras y cervezas sin gluten (Brunehaut) en la carta." },
      { n: "Iglesia de Santa Catalina y Bourse", lat: 50.8480, lng: 4.3500, tags: ["Paseo","Historia"], precio: 0, dur: 30, d: "La Bolsa de 1873 reabierta como Belgian Beer World en su cúpula, y las escaleras donde se sienta la ciudad.", truco: "Belgian Beer World cuesta 17 € y acaba con una cerveza en la azotea con vista; solo la escalera de la Bolsa es gratis y buen punto de encuentro.", salseo: "Bajo la Bolsa está el Bruxella 1238, un convento franciscano excavado que se ve por unos cristales; Rodin, de joven, esculpió parte de la fachada y no firmó. Los atentados de 2016 se recordaron en esta escalera." }
    ]},
    { nombre: "Europa, Cinquantenaire y Atomium", paradas: [
      { n: "Parque del Cinquantenaire", lat: 50.8404, lng: 4.3928, tags: ["Parque","Museo","Mirador"], precio: 0, dur: 75, d: "El arco de triunfo de Leopoldo II con museos a los lados y la terraza de arriba gratis.", truco: "La terraza del arco se sube por el Museo Militar, gratis; Autoworld, con 300 coches, para los de motor. La Gran Mezquita está en una esquina del parque.", salseo: "El arco lo pagó Leopoldo II de su bolsillo (o sea, del Congo) porque el Parlamento se negó; el pabellón de Horta del parque se reconstruyó tras 90 años de piezas en cajas.", atardecer: true },
      { n: "Barrio Europeo y Parlamentarium", lat: 50.8385, lng: 4.3755, tags: ["Museo","Historia","Fuera de ruta"], precio: 0, dur: 60, d: "Las instituciones de la UE, con el centro de visitantes del Parlamento gratis y el hemiciclo visitable.", truco: "Parlamentarium y Casa de la Historia Europea son gratis; el hemiciclo se visita con pasaporte los días sin pleno. Place Luxembourg, jueves tarde, es el afterwork de los eurócratas.", salseo: "El edificio del Parlamento se llama Caprice des Dieux por parecerse al queso; el barrio Leopold se demolió casa a casa desde 1960 y la Place Jourdan tiene la friterie de al lado de la Comisión donde comen los comisarios." },
      { n: "Atomium", lat: 50.8949, lng: 4.3415, tags: ["Imprescindible","Mirador"], precio: 16, dur: 90, d: "La molécula de hierro de 102 metros de la Expo 58, con escaleras mecánicas entre las esferas y vista arriba.", truco: "Metro a Heysel; entrada online con hora. Mini-Europe está al lado (combinada). Al atardecer las esferas reflejan el cielo.", salseo: "Iba a durar seis meses y sigue; las esferas se recubrieron de aluminio nuevo en 2006 y las de acero originales se vendieron a trozos. Hay un huevo de hierro por dentro donde duermen niños en visitas escolares.", atardecer: true, ninos: true },
      { n: "Casa Horta y Art Nouveau de Saint-Gilles", lat: 50.8240, lng: 4.3550, tags: ["Museo","Paseo","Fuera de ruta"], precio: 12, dur: 60, d: "La casa-estudio de Victor Horta, patrimonio mundial, y el paseo por las fachadas art nouveau de Saint-Gilles e Ixelles.", truco: "Entrada sin reserva pero cupo pequeño; el Hôtel Tassel (Rue Paul-Émile Janson 6) solo se ve por fuera y es el primer edificio art nouveau del mundo.", salseo: "Horta diseñaba hasta los pomos y los picaportes; en la guerra huyó a EE. UU. y volvió a un Bruselas que demolía sus obras. La Maison du Peuple, su obra maestra, se tiró en 1965 y las piezas se perdieron." }
    ]}
  ]

  zonas: [

      { n: "Torre de San Pedro (Alter Peter)", lat: 48.1366, lng: 11.5750, tags: ["Mirador","Historia"], precio: 5, dur: 40, d: "La iglesia más antigua de la ciudad con 306 escalones hasta la mejor vista de Frauenkirche y los Alpes si hay föhn.", truco: "Con föhn (viento cálido) se ven los Alpes: si está despejado, sube a la primera hora. Dentro, el esqueleto de Santa Munditia con joyas en los ojos.", salseo: "Santa Munditia está en una urna de cristal cubierta de joyas con un vaso de sangre seca en la mano; es patrona de las mujeres solteras. Los muniqueses miden el tiempo por 'el viejo Pedro'." },
      { n: "Viktualienmarkt", lat: 48.1352, lng: 11.5763, tags: ["Mercado","Comida","Imprescindible"], precio: 0, dur: 60, d: "El mercado de 140 puestos con biergarten en medio, bajo el árbol de mayo, desde 1807.", truco: "Weisswurst antes del mediodía (por tradición) con pretzel y cerveza de trigo; la cerveza del biergarten rota cada seis semanas entre las seis fábricas de la ciudad.", salseo: "La weisswurst 'no debe oír las campanas del mediodía' porque antes de la nevera se hacía al alba y se pudría; se come sin piel y con mostaza dulce. Hay una fuente para cada cómico famoso de Múnich.", comida: true, sg: "Weisswurst apta (confirma la marca), queso Obatzda sí, el pretzel no." },
      { n: "Residenz y Cuvilliés-Theater", lat: 48.1411, lng: 11.5785, tags: ["Imprescindible","Museo","Historia"], precio: 10, dur: 120, d: "El palacio de los Wittelsbach en el centro: 130 salas, el Antiquarium renacentista y un teatro rococó dorado.", truco: "Solo Residenz + tesoro; el Antiquarium (sala de 66 metros) es el momento, y el teatro Cuvilliés se compra aparte pero es diez minutos de asombro.", salseo: "Los cuatro leones de bronce de la entrada tienen el hocico dorado de tanto frotarlos: da suerte tocar los cuatro seguidos. Mozart estrenó Idomeneo en el Cuvilliés en 1781; el teatro se desmontó en la guerra y se salvó." }
    ]},
    { nombre: "Englischer Garten y Schwabing", paradas: [
      { n: "Eisbachwelle", lat: 48.1432, lng: 11.5877, tags: ["Imprescindible","Paseo"], precio: 0, dur: 25, d: "La ola permanente del río artificial donde surfean todo el año, con neopreno en enero.", truco: "Desde el puente de Prinzregentenstraße; hay cola de surfistas que se turnan uno a uno. A primera hora, los mejores.", salseo: "La ola la crearon sin querer unas piedras de hormigón; los surfistas la mejoraron con tablones a escondidas y en 2010 la ciudad lo legalizó. Hay muniqueses que nunca han visto el mar y surfean a diario.", ninos: true },
      { n: "Englischer Garten y Chinesischer Turm", lat: 48.1517, lng: 11.5919, tags: ["Parque","Comida","Imprescindible"], precio: 0, dur: 90, d: "El parque más grande que Central Park, con la torre china y su biergarten de 7.000 plazas y una banda de música.", truco: "Alquila bici para hacerlo entero; el biergarten de la torre es turístico pero grande, y el Seehaus, junto al lago, más bonito. Nudismo en el prado del Schönfeldwiese, aviso.", salseo: "Lo diseñó un americano, Benjamin Thompson, ministro de Baviera y espía de los ingleses; el prado nudista es legal desde los 70 y los turistas asiáticos hacen fotos desde la lejanía. El Monopteros es el mirador.", comida: true, sg: "Cerveza no; queso, rábano y pollo asado sí.", atardecer: true },
      { n: "Schwabing y Leopoldstraße", lat: 48.1590, lng: 11.5860, tags: ["Paseo","Bar","Fuera de ruta"], precio: 0, dur: 60, d: "El barrio bohemio de 1900 convertido en avenida de terrazas y calles de cafés detrás.", truco: "Las calles laterales (Türkenstraße, Ainmillerstraße) tienen los cafés y las fachadas art nouveau; Kandinsky vivió en Ainmillerstraße 36.", salseo: "Lenin, Kandinsky, Thomas Mann y Hitler vivieron en Schwabing a la vez sin conocerse; la revista Simplicissimus se burlaba del káiser desde aquí. Fue el barrio más loco de Alemania hasta la Primera Guerra." },
      { n: "Pinakotheken", lat: 48.1483, lng: 11.5700, tags: ["Museo","Imprescindible"], precio: 9, dur: 120, d: "Tres museos en un prado: la Alte (Durero, Rubens), la Neue (Van Gogh, Klimt) y la Moderne (diseño y arte del XX).", truco: "Domingo cuesta 1 € cada una; la Neue está cerrada por obras hasta 2029 y sus mejores cuadros están en la Alte. Empieza por la Pinakothek der Moderne si te gusta el diseño.", salseo: "Luis I abrió la Alte en 1836 como el primer museo pensado para el público; los Girasoles de Van Gogh de la Neue son uno de los cinco que existen. La Alte se reconstruyó con ladrillo visto donde cayeron las bombas." }
    ]},
    { nombre: "Isar, Museo Alemán y Glockenbach", paradas: [
      { n: "Deutsches Museum", lat: 48.1298, lng: 11.5833, tags: ["Museo","Imprescindible"], precio: 15, dur: 150, d: "El museo de ciencia y técnica más grande del mundo, en una isla del Isar, con mina de carbón y U-boot.", truco: "Ideal con lluvia y niños: la mina de carbón en el sótano (45 min) y la demo de alta tensión con rayos de verdad, a horas fijas. Mitad en obras hasta 2028.", salseo: "El submarino U1 de 1906 se metió por la pared; el primer motor diésel de Diesel está aquí, y él desapareció de un barco a Londres en 1913 y nunca apareció. Los alemanes lo consideran el Louvre de la ciencia.", ninos: true },
      { n: "Paseo por el Isar y Flaucher", lat: 48.1160, lng: 11.5540, tags: ["Parque","Paseo","Fuera de ruta"], precio: 0, dur: 75, d: "El río renaturalizado con playas de grava, biergarten entre árboles y gente bañándose en verano.", truco: "Desde el Deutsches Museum hacia el sur por la orilla este; Zum Flaucher es el biergarten del bosque. En verano, barbacoas en la orilla.", salseo: "El Isar era un canal de hormigón hasta 2011; lo devolvieron a cauce natural y ahora es la playa de Múnich, con salvavidas. Los troncos de madera bajaban por él desde los Alpes hasta 1900.", comida: true, sg: "Zum Flaucher: pollo asado y queso, pretzel no." },
      { n: "Glockenbachviertel", lat: 48.1300, lng: 11.5720, tags: ["Bar","Paseo","Comida"], precio: 0, dur: 90, d: "El barrio de bares, gay y creativo, entre Gärtnerplatz y el Isar, con cafés de mañana y cócteles de noche.", truco: "Gärtnerplatz al atardecer con la gente sentada en el césped; Holy Home y Trisoux para copas; Café Frischhut para Schmalznudel (bollo frito) por la mañana.", salseo: "Freddie Mercury vivió en el barrio en los 80 y grababa en Musicland, en el sótano del Arabellahaus; sus noches en el Ochsengarten y Deutsche Eiche son leyenda. La Deutsche Eiche sigue y es hotel con sauna.", comida: true, sg: "Bares de cócteles y vino; pide sin cerveza." },

const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const DIAS_SEMANA = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];

// Escapa texto antes de meterlo en el HTML
function esc(t) {
  return String(t ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
// Minutos desde medianoche a "HH:MM"
function hhmm(min) {
  min = Math.round(min);
  return String(Math.floor(min / 60)).padStart(2, "0") + ":" + String(min % 60).padStart(2, "0");
}
// Distancia en km entre dos puntos (haversine)
function distKm(a, b) {
  const R = 6371, r = Math.PI / 180;
  const dLat = (b.lat - a.lat) * r, dLng = (b.lng - a.lng) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
// Precio formateado con la moneda de la ciudad
function precioTexto(p, moneda) {
  if (!p) return "Gratis";
  return "≈ " + (moneda === "€" || moneda === "£" ? p + " " + moneda : p.toLocaleString("es-ES") + " " + moneda);
}

/* Horario de verano europeo: del ultimo domingo de marzo al ultimo de octubre */
function esVerano(fecha) {
  const y = fecha.getFullYear();
  const ultimoDomingo = m => { const d = new Date(Date.UTC(y, m + 1, 0)); d.setUTCDate(d.getUTCDate() - d.getUTCDay()); return d; };
  const ini = ultimoDomingo(2), fin = ultimoDomingo(9);
  const f = new Date(Date.UTC(y, fecha.getMonth(), fecha.getDate(), 12));
  return f >= ini && f < fin;
}

/* Atardecer local (minutos desde medianoche) para una fecha y una ciudad.
   Formula solar simplificada (NOAA): declinacion, ecuacion del tiempo y
   angulo horario para el sol a -0.833 grados bajo el horizonte. */
function atardecerMin(fecha, ciudad) {
  const lat = ciudad.centro[0], lng = ciudad.centro[1];
  const ini = new Date(fecha.getFullYear(), 0, 0);
  const n = Math.floor((fecha - ini) / 86400000);
  const g = 2 * Math.PI / 365 * (n - 1 + (12 - 12) / 24);
  const eqt = 229.18 * (0.000075 + 0.001868 * Math.cos(g) - 0.032077 * Math.sin(g) - 0.014615 * Math.cos(2 * g) - 0.040849 * Math.sin(2 * g));
  const decl = 0.006918 - 0.399912 * Math.cos(g) + 0.070257 * Math.sin(g) - 0.006758 * Math.cos(2 * g) + 0.000907 * Math.sin(2 * g) - 0.002697 * Math.cos(3 * g) + 0.00148 * Math.sin(3 * g);
  const r = Math.PI / 180;
  const cosHa = (Math.cos(90.833 * r) / (Math.cos(lat * r) * Math.cos(decl))) - Math.tan(lat * r) * Math.tan(decl);
  const ha = Math.acos(Math.max(-1, Math.min(1, cosHa))) / r;
  const utcMin = 720 - 4 * (lng - ha) - eqt;
  const tz = ciudad.tz + (esVerano(fecha) ? 1 : 0);
  return utcMin + tz * 60;
}

/* ======================================================================
   MOTOR: puntuar, elegir zonas, ordenar y poner horas
   ====================================================================== */
function puntuar(parada, ciudad, opciones) {
  const { intereses, grupo, presupuesto, evitar, maxPrecio } = opciones;
  let s = 1;
  parada.tags.forEach(t => { if (intereses.includes(t)) s += 3; });
  if (parada.tags.includes("Imprescindible")) s += 1;
  if (grupo === "familia") { if (parada.ninos) s += 2.5; if (parada.tags.includes("Bar")) s -= 3; }
  if (grupo === "amigos" && parada.tags.includes("Bar")) s += 1.5;
  if (grupo === "solo" && (parada.tags.includes("Fuera de ruta") || parada.tags.includes("Paseo"))) s += 1;
  if (grupo === "pareja" && parada.atardecer) s += 0.5;
  if (presupuesto === "ajustado" && maxPrecio && parada.precio) s -= 2.5 * (parada.precio / maxPrecio);
  if (presupuesto === "alto" && (parada.reservar || parada.comida)) s += 1;
  const texto = (parada.n + " " + parada.tags.join(" ") + " " + parada.d).toLowerCase();
  parada._evitado = evitar.some(e => e && texto.includes(e));
  if (parada._evitado) s -= 6;
  return s;
}

// Expande sinonimos de lo que se quiere evitar
function normalizarEvitar(texto) {
  const lista = texto.toLowerCase().split(/[,;]+/).map(t => t.trim()).filter(Boolean);
  const salida = [];
  lista.forEach(t => {
    salida.push(t);
    if (/museo/.test(t)) salida.push("museo");
    if (/iglesia|catedral|templo/.test(t)) salida.push("iglesia", "catedral", "basílica", "capilla");
    if (/cola|reserva/.test(t)) salida.push("reserva");
    if (/cuesta|escaler|subid/.test(t)) salida.push("escalones", "colina", "torre");
    if (/bar|noche|copa/.test(t)) salida.push("bar", "noche");
    if (/mercad/.test(t)) salida.push("mercado");
  });
  return [...new Set(salida)];
}

// Ordena las paradas de un dia por cercania; el atardecer siempre al final
function ordenarDia(paradas) {
  const esNoche = p => p.tags[0] === "Bar" || /de noche/i.test(p.n);
  const noche = paradas.filter(p => esNoche(p) && !p.atardecer);
  const ocaso = paradas.filter(p => p.atardecer);
  let resto = paradas.filter(p => !p.atardecer && !esNoche(p));
  const orden = [];
  if (resto.length) {
    // Empieza por la de mayor puntuacion y sigue por la mas cercana
    let actual = resto.reduce((a, b) => (b._s > a._s ? b : a));
    resto = resto.filter(p => p !== actual); orden.push(actual);
    while (resto.length) {
      actual = resto.reduce((a, b) => (distKm(actual, b) < distKm(actual, a) ? b : a));
      resto = resto.filter(p => p !== actual); orden.push(actual);
    }
  }
  // Si hay varias de atardecer, se queda la mejor y el resto va antes
  if (ocaso.length > 1) {
    ocaso.sort((a, b) => b._s - a._s);
    orden.push(...ocaso.slice(1).map(p => ({ ...p, atardecer: false })));
  }
  if (ocaso.length) orden.push(ocaso[0]);
  noche.forEach(p => orden.push({ ...p, _noche: true }));
  return orden;
}

// Traslado entre dos paradas segun como se mueve el grupo
function traslado(a, b, transporte) {
  const km = distKm(a, b);
  if (km < 0.12) return "Al lado · 2 min";
  const aPie = Math.round(km * 13 + 2);
  if (transporte === "pie" || km < 1.6) return "A pie · " + aPie + " min";
  if (transporte === "motor") return "En coche o moto · " + Math.round(km * 3 + 8) + " min";
  return "Metro, tranvía o bus · " + Math.round(km * 4 + 10) + " min";
}

// Pone horas a las paradas de un dia: 11:00, comida a las 14:00, atardecer real
function programar(paradas, transporte, ocasoMin) {
  const filas = [];
  let t = 11 * 60, comidaHecha = false;
  paradas.forEach((p, i) => {
    if (i > 0) {
      const tr = traslado(paradas[i - 1], p, transporte);
      t += parseInt(tr.match(/(\d+) min/)[1], 10);
      p._t = tr;
    } else p._t = "Desde el alojamiento";
    // Hueco de comida hacia las 14:00, salvo que la propia parada sea de comer
    if (!comidaHecha && t >= 13 * 60 + 15) {
      if (p.comida) { p._esComida = true; comidaHecha = true; }
      else { filas.push({ hueco: true, h: hhmm(t), texto: "Comida" }); t += 90; comidaHecha = true; }
    }
    // El mirador se programa 45 minutos antes del ocaso real
    if (p.atardecer && ocasoMin) {
      const objetivo = ocasoMin - 45;
      if (t < objetivo - 20) {
        if (!comidaHecha) {
          if (t < 12 * 60 + 30) { filas.push({ hueco: true, h: hhmm(t), texto: "Tiempo libre: café largo o paseo sin rumbo" }); t = 13 * 60; }
          filas.push({ hueco: true, h: hhmm(t), texto: "Comida" }); t += 90; comidaHecha = true;
        }
        // Espera de hasta 2 h; si falta mas, se va sin esperar (sera atardecer otro dia)
        if (t < objetivo - 20 && objetivo - t <= 120) { filas.push({ hueco: true, h: hhmm(t), texto: "Tiempo libre hasta el atardecer: café, tiendas o siesta" }); t = objetivo; }
      }
    }
    // Los planes de noche no empiezan antes de las 19:30
    if (p._noche && t < 19 * 60 + 30) {
      if (!comidaHecha) { filas.push({ hueco: true, h: hhmm(t), texto: "Comida" }); t += 90; comidaHecha = true; }
      if (t < 19 * 60 + 30) { filas.push({ hueco: true, h: hhmm(t), texto: "Descanso y ducha en el alojamiento" }); t = 19 * 60 + 30; }
    }
    p._h = hhmm(t);
    filas.push({ parada: p });
    t += p._esComida ? Math.max(p.dur, 80) : p.dur;
  });
  if (!comidaHecha) filas.push({ hueco: true, h: hhmm(Math.max(t, 14 * 60)), texto: "Comida" });
  return filas;
}

// Lee el formulario como un objeto (es lo que se guarda y se comparte)
function leerFormulario() {
  const v = id => document.getElementById(id).value;
  return {
    ciudad: v("destino"), fecha: v("fecha"), dias: v("dias"), ritmo: v("ritmo"),
    presupuesto: v("presupuesto"), grupo: v("grupo"), transporte: v("transporte"), evitar: v("evitar"),
    intereses: [...document.querySelectorAll('input[name="interes"]:checked')].map(c => c.value),
    excluidas: []
  };
}
// Vuelca un objeto de filtros en el formulario
function aplicarFormulario(e) {
  const set = (id, val) => { if (val !== undefined) document.getElementById(id).value = val; };
  set("destino", e.ciudad); set("fecha", e.fecha); set("dias", e.dias); set("ritmo", e.ritmo);
  set("presupuesto", e.presupuesto); set("grupo", e.grupo); set("transporte", e.transporte); set("evitar", e.evitar || "");
  document.querySelectorAll('input[name="interes"]').forEach(c => { c.checked = (e.intereses || []).includes(c.value); });
}

function cuadrar(entrada) {
  const e = entrada || leerFormulario();
  const ciudad = CIUDADES[e.ciudad];
  if (!ciudad) { mostrarError("No encuentro esa ciudad en el repositorio."); return null; }
  if (!e.fecha) { mostrarError("Falta la fecha de llegada."); return null; }
  const numDias = Math.min(8, Math.max(1, parseInt(e.dias, 10) || 3));
  const porDia = parseInt(e.ritmo, 10) || 4;
  const opciones = {
    intereses: e.intereses || [], grupo: e.grupo, presupuesto: e.presupuesto, transporte: e.transporte,
    evitar: normalizarEvitar(e.evitar || ""), maxPrecio: 0, excluidas: e.excluidas || []
  };
  const fecha = new Date(e.fecha + "T12:00:00");

  // Puntuacion de cada parada
  const todas = [];
  ciudad.zonas.forEach(z => z.paradas.forEach(p => { todas.push(p); opciones.maxPrecio = Math.max(opciones.maxPrecio, p.precio); }));
  todas.forEach(p => { p._s = puntuar(p, ciudad, opciones); p._zona = ciudad.zonas.find(z => z.paradas.includes(p)).nombre; });

  const elegible = p => !p._evitado && p._s > -1.5 && !opciones.excluidas.includes(p.n);
  // Una zona por dia: se eligen las que suman mas con sus mejores paradas
  const zonasPuntuadas = ciudad.zonas.map(z => {
    const mejores = [...z.paradas].filter(elegible).sort((a, b) => b._s - a._s).slice(0, porDia);
    return { zona: z, paradas: mejores, total: mejores.reduce((s, p) => s + p._s, 0) };
  }).sort((a, b) => b.total - a.total);

  const dias = [];
  const usadas = new Set();
  zonasPuntuadas.filter(zp => zp.paradas.length >= 2).slice(0, numDias).forEach(zp => {
    zp.paradas.forEach(p => usadas.add(p));
    dias.push({ zona: zp.zona.nombre, paradas: zp.paradas.map(p => ({ ...p })) });
  });

  // Si hay mas dias que zonas: dias extra con lo mejor que quedo, agrupado por cercania
  while (dias.length < numDias) {
    let restantes = todas.filter(p => !usadas.has(p) && elegible(p)).sort((a, b) => b._s - a._s);
    if (!restantes.length) { dias.push({ zona: "Día libre", paradas: [], libre: true }); continue; }
    const grupo = [restantes[0]]; usadas.add(restantes[0]);
    restantes = restantes.slice(1);
    while (grupo.length < porDia && restantes.length) {
      const ultimo = grupo[grupo.length - 1];
      restantes.sort((a, b) => distKm(ultimo, a) - distKm(ultimo, b));
      const cerca = restantes.find(p => distKm(ultimo, p) < 3) || restantes[0];
      grupo.push(cerca); usadas.add(cerca); restantes = restantes.filter(p => p !== cerca);
    }
    dias.push({ zona: "Lo que faltaba: " + [...new Set(grupo.map(p => p._zona))].join(" y "), paradas: grupo.map(p => ({ ...p })) });
  }

  // Si un dia se queda corto, se completa con lo mas cercano que quede sin usar
  dias.forEach(d => {
    if (d.libre) return;
    while (d.paradas.length < porDia) {
      const centro = { lat: d.paradas.reduce((s, p) => s + p.lat, 0) / d.paradas.length, lng: d.paradas.reduce((s, p) => s + p.lng, 0) / d.paradas.length };
      const cand = todas.filter(p => !usadas.has(p) && elegible(p) && distKm(centro, p) < 1.8).sort((a, b) => (b._s - distKm(centro, b)) - (a._s - distKm(centro, a)))[0];
      if (!cand) break;
      usadas.add(cand); d.paradas.push({ ...cand });
    }
  });

  // Orden, horas y etiquetas de fecha
  dias.forEach((d, i) => {
    const f = new Date(fecha); f.setDate(f.getDate() + i);
    d.fecha = f;
    d.etiqueta = DIAS_SEMANA[f.getDay()] + " " + f.getDate() + " de " + MESES[f.getMonth()];
    d.ocaso = atardecerMin(f, ciudad);
    d.paradas = ordenarDia(d.paradas);
    d.filas = programar(d.paradas, opciones.transporte, d.ocaso);
    d.coste = d.paradas.reduce((s, p) => s + (p.precio || 0), 0);
  });

  return { ciudad, dias, fecha, opciones, porDia, entrada: e };
}

  });

  html += '<div class="apartado"><h4>Dónde comer</h4><ul>' + ciudad.comer.map(c => "<li>" + esc(c) + "</li>").join("") + '</ul></div>';

  html += '<div class="acciones">';
  html += '<button class="btn-secundario" id="btn-guardar" type="button">' + (viajeActual ? 'Guardado' : 'Guardar este viaje') + '</button>';
  html += '<button class="btn-secundario" id="btn-compartir" type="button">Copiar enlace para compartir</button>';
  html += '<button class="btn-secundario" id="btn-guia" type="button">Guía en PDF</button>';
  html += '<button class="btn-secundario" id="btn-guia-corta" type="button">Guía corta</button>';
  html += '<button class="btn-secundario" id="btn-ics" type="button">Añadir el viaje al calendario</button>';
  html += '<button class="btn-secundario" id="btn-md" type="button">Copiar como texto</button>';
  html += '<button class="btn-secundario" onclick="window.print()" type="button">Imprimir o guardar en PDF</button>';
  html += '</div>';
  html += '<div class="guardar-caja" id="guardar-caja"><input type="text" id="nombre-viaje" placeholder="Nombre del viaje, ej. Verona en octubre"><button class="btn-secundario" id="btn-guardar-ok" type="button">Guardar</button></div>';
  html += '<div class="progreso-viaje" id="progreso-viaje"></div>';
  html += '<p class="aviso">Horas, precios y aperturas son orientativos: cada sitio cambia horarios por temporada. Lo marcado como Reservar se agota: un vistazo a las webs oficiales la semana antes. Los salseos son verídicos hasta donde llega la leyenda.</p>';

  const caja = document.getElementById("resultado");
  caja.innerHTML = html;
  caja.scrollIntoView({ behavior: "smooth", block: "start" });
  document.getElementById("btn-ics").addEventListener("click", exportarIcs);
  document.getElementById("btn-md").addEventListener("click", copiarTexto);
  document.getElementById("btn-compartir").addEventListener("click", compartirEnlace);
  document.getElementById("btn-guia").addEventListener("click", () => abrirGuia(null, false));
  document.getElementById("btn-guia-corta").addEventListener("click", () => abrirGuia(null, true));
  document.getElementById("btn-guardar").addEventListener("click", () => {
    if (viajeActual) return;
    document.getElementById("guardar-caja").classList.add("visible");
    document.getElementById("nombre-viaje").value = ciudad.nombre + " · " + MESES[fecha.getMonth()] + " " + fecha.getFullYear();
    document.getElementById("nombre-viaje").focus();
  });
  document.getElementById("btn-guardar-ok").addEventListener("click", guardarViaje);
  document.querySelectorAll(".cambiar").forEach(b => b.addEventListener("click", () => cambiarParada(b.dataset.nombre)));
  document.querySelectorAll(".hecho").forEach(c => c.addEventListener("change", () => marcarHecha(c)));
  pintarHechas();
  pintarMapas(plan);
}

// Hora a la que acaba la ultima parada del dia
function finDia(dia) {
  const ultima = dia.filas.filter(f => f.parada).pop();
  if (!ultima) return "—";
  const [h, m] = ultima.parada._h.split(":").map(Number);
  return hhmm(h * 60 + m + (ultima.parada._esComida ? Math.max(ultima.parada.dur, 80) : ultima.parada.dur));
}

/* ---------- Mapas Leaflet ---------- */
function pintarMapas(plan) {
  const { ciudad, dias } = plan;
  const acento = ciudad.acento;
  const tiles = () => L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", { attribution: "&copy; OpenStreetMap &copy; CARTO", maxZoom: 19 });
  const icono = n => L.divIcon({ className: "", html: '<div class="pin"><span>' + n + '</span></div>', iconSize: [26, 26], iconAnchor: [13, 26], popupAnchor: [0, -24] });
  const popup = (p, i) => '<b>' + esc(p.n) + '</b>Día ' + (i + 1) + ' · ' + p._h + ' · ' + esc(precioTexto(p.precio, ciudad.moneda));

  const mapaTodo = L.map("mapa-todo", { scrollWheelZoom: false }).setView(ciudad.centro, ciudad.zoom);
  tiles().addTo(mapaTodo);
  const capas = [], todos = [];
  dias.forEach((dia, i) => {
    const capa = L.layerGroup();
    const puntos = dia.paradas.map(p => [p.lat, p.lng]);
    puntos.forEach(pt => todos.push(pt));
    if (puntos.length > 1) L.polyline(puntos, { color: acento, weight: 2.5, opacity: 0.55, dashArray: "6 6" }).addTo(capa);
    dia.paradas.forEach(p => L.marker([p.lat, p.lng], { icon: icono(i + 1) }).bindPopup(popup(p, i)).addTo(capa));
    capa.addTo(mapaTodo); capas.push(capa);
  });
  if (todos.length) mapaTodo.fitBounds(todos, { padding: [30, 30] });
  mapas.push(mapaTodo);

  document.querySelectorAll(".leyenda button").forEach(b => {
    b.addEventListener("click", () => {
      const i = parseInt(b.dataset.dia, 10);
      if (mapaTodo.hasLayer(capas[i])) { mapaTodo.removeLayer(capas[i]); b.classList.add("apagado"); }
      else { capas[i].addTo(mapaTodo); b.classList.remove("apagado"); }
    });
  });

  dias.forEach((dia, i) => {
    const cont = document.getElementById("mapa-dia-" + i);
    if (!cont || !dia.paradas.length) return;
    const m = L.map(cont, { scrollWheelZoom: false, zoomControl: false });
    tiles().addTo(m);
    const coords = dia.paradas.map(p => [p.lat, p.lng]);
    if (coords.length > 1) L.polyline(coords, { color: acento, weight: 3, opacity: 0.7 }).addTo(m);
    dia.paradas.forEach((p, j) => L.marker([p.lat, p.lng], { icon: icono(j + 1) }).bindPopup(popup(p, i)).addTo(m));
    m.fitBounds(coords, { padding: [26, 26], maxZoom: 16 });
    mapas.push(m);
  });
}

/* ---------- Exportar a calendario .ics ---------- */
function exportarIcs() {
  if (!ultimoPlan) return;
  const escIcs = t => String(t).replace(/\\/g, "\\\\").replace(/,/g, "\\,").replace(/;/g, "\\;");
  const fIcs = f => f.toISOString().slice(0, 10).replace(/-/g, "");
  const lineas = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//La Brujula//ES"];
  ultimoPlan.dias.forEach((dia, i) => {
    const fin = new Date(dia.fecha); fin.setDate(fin.getDate() + 1);
    lineas.push("BEGIN:VEVENT",
      "UID:brujula-" + i + "-" + Date.now() + "@la-brujula",
      "DTSTART;VALUE=DATE:" + fIcs(dia.fecha),
      "DTEND;VALUE=DATE:" + fIcs(fin),
      "SUMMARY:" + escIcs(ultimoPlan.ciudad.nombre + " día " + (i + 1) + " — " + dia.zona),
      "DESCRIPTION:" + escIcs(dia.paradas.map(p => p._h + " " + p.n).join(" · ")),
      "LOCATION:" + escIcs(ultimoPlan.ciudad.nombre),
      "END:VEVENT");
  });
  lineas.push("END:VCALENDAR");
  const blob = new Blob([lineas.join("\r\n")], { type: "text/calendar;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "viaje-la-brujula.ics"; a.click();
  URL.revokeObjectURL(a.href);
}

/* ---------- Copiar como texto plano ---------- */
function copiarTexto() {
  if (!ultimoPlan) return;
  const { ciudad, dias } = ultimoPlan;
  let t = ciudad.nombre.toUpperCase() + "\n" + ciudad.claim + "\n\n";
  dias.forEach((dia, i) => {
    t += "DÍA " + (i + 1) + " · " + dia.etiqueta + " · " + dia.zona + "\n";
    dia.filas.forEach(f => {
      if (f.hueco) { t += "  " + f.h + "  " + f.texto + "\n"; return; }
      t += "  " + f.parada._h + "  " + f.parada.n + " (" + precioTexto(f.parada.precio, ciudad.moneda) + ")\n    Truco: " + f.parada.truco + "\n";
    });
    t += "\n";
  });
  t += "DÓNDE COMER\n" + ciudad.comer.map(c => "  - " + c).join("\n") + "\n\nSIN GLUTEN\n" + ciudad.singluten.map(c => "  - " + c).join("\n") + "\n";
  navigator.clipboard.writeText(t).then(() => {
    const b = document.getElementById("btn-md"); b.textContent = "Copiado"; setTimeout(() => b.textContent = "Copiar como texto", 1800);
  });
}

// Mezcla dos colores hex (proporcion del primero); sustituye a color-mix, que
// el generador de PDF no entiende
function mezclar(a, b, t) {
  const h = c => c.replace("#", "").match(/.{2}/g).map(x => parseInt(x, 16));
  const [r1, g1, b1] = h(a), [r2, g2, b2] = h(b);
  const m = (x, y) => Math.round(x * t + y * (1 - t)).toString(16).padStart(2, "0");
  return "#" + m(r1, r2) + m(g1, g2) + m(b1, b2);
}

function motivoCss(nombre, a, b) {
  const svg = (MOTIVOS[nombre] || MOTIVOS.puntos)(a, b);
  return "url(\"data:image/svg+xml;utf8," + encodeURIComponent(svg) + "\")";
}

/* ---------- CSS de la guia: base comun + una clase por maquetacion ---------- */

  const pequena = /Cormorant|EB Garamond|Crimson|Libre Baskerville|Lora/.test(d.cuerpo);
  const base = pequena ? 17 : 15.5;
  return `

  --motivo:${motivoCss(d.motivo, p.acento, p.acento2)}; --suave:${mezclar(p.acento, p.papel, oscuro ? 0.22 : 0.08)}; --linea:${mezclar(p.tinta, p.papel, 0.14)}; }

.caja h5 { font-size: 10.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--acento2); margin-bottom: 6px; }
.frases { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
.frases span { font-size:12.5px; border:1px solid var(--linea); border-radius:99px; padding:6px 12px; background:var(--papel); }
/* Dia */
.dia { margin-top: 36px; break-inside: avoid-page; }
.dia-cab { display:flex; align-items:baseline; gap:14px; border-bottom: 2px solid var(--acento); padding-bottom: 8px; margin-bottom: 14px; }
.dia-cab .num { font-size: 44px; line-height: 1; color: var(--acento); }
.dia-cab h3 { font-size: 22px; }
.dia-cab .zona { margin-left:auto; font-size: 11px; letter-spacing:.18em; text-transform: uppercase; color: var(--tinta2); text-align:right; }
.parada { display:grid; grid-template-columns: 200px 1fr; gap: 16px; padding: 14px 0; border-top: 1px solid var(--linea); break-inside: avoid; }
.parada .foto-caja { height: 150px; border-radius: 8px; }
.parada .hora { font-size: 12px; font-weight: 700; letter-spacing: .12em; color: var(--acento2); }
.parada h4 { font-size: ${base + 3.5}px; line-height:1.15; margin: 2px 0 4px; }
.parada .tags { display:flex; gap:6px; flex-wrap:wrap; margin-bottom: 6px; }
.parada .tag { font-size: 9.5px; letter-spacing:.12em; text-transform: uppercase; border: 1px solid var(--linea); border-radius: 99px; padding: 2px 8px; color: var(--tinta2); }
.parada .tag.res { background: var(--acento); color: var(--papel); border-color: var(--acento); }
.parada .d { font-size: ${base - 1}px; }
.parada .truco { margin-top: 8px; font-size: ${base - 1.5}px; padding: 8px 12px; border-radius: 8px; background: var(--suave); }
.parada .truco b, .parada .salseo b { font-size: 10px; letter-spacing: .18em; text-transform: uppercase; display:block; margin-bottom: 2px; color: var(--acento2); }
.parada .salseo { margin-top: 8px; font-size: ${base - 1}px; padding: 8px 12px; border-left: 3px solid var(--acento2); font-style: italic; }
.parada .sg { margin-top: 6px; font-size: 12px; color: var(--tinta2); }
.parada .sg::before { content: "Sin gluten: "; font-weight: 700; color: var(--acento); }
.hueco { padding: 8px 0 8px 216px; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--tinta2); border-top: 1px dashed var(--linea); }
.corta .parada { grid-template-columns: 110px 1fr; padding: 8px 0; }
.corta .parada .foto-caja { height: 80px; }
.corta .parada h4 { font-size: 16px; }
.corta .parada .d, .corta .parada .salseo { display:none; }
.corta .parada .truco { margin-top: 4px; font-size: 12.5px; padding: 5px 10px; }
.corta .hueco { padding-left: 126px; }
.corta .dia { margin-top: 22px; }
/* Salseos de ciudad */
.salseos { display:grid; grid-template-columns: 1fr 1fr; gap: 14px; counter-reset: s; }
.salseos .s { background: var(--papel); border: 1px solid var(--linea); border-radius: 12px; padding: 16px 18px 16px 52px; position: relative; font-size: ${base - 1}px; }
.salseos .s::before { counter-increment: s; content: counter(s); position:absolute; left: 14px; top: 10px; font-family:"${d.titulo}"; font-size: 34px; color: var(--acento2); line-height:1; }
.salseos .s.ancho { grid-column: 1 / -1; }
/* Platos */
.platos { display:grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.plato .foto-caja { height: 110px; border-radius: 8px; margin-bottom: 8px; }
.plato h4 { font-size: ${base + 0.5}px; line-height: 1.15; }
.plato p { font-size: ${base - 2.5}px; color: var(--tinta2); }
.lista { list-style: none; margin-top: 10px; }
.lista li { padding: 6px 0 6px 18px; position: relative; font-size: ${base - 1}px; border-top: 1px solid var(--linea); }
.lista li::before { content:""; position:absolute; left:0; top:15px; width: 9px; height: 2px; background: var(--acento2); }
.cierre { margin-top: 50px; text-align:center; font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--tinta2); padding-top: 20px; border-top: 1px solid var(--linea); }
.cierre .t { font-size: 22px; letter-spacing: 0; text-transform: none; color: var(--acento); margin-bottom: 6px; }
/* Barra de control (no se imprime) */
.barra { position: sticky; top:0; z-index: 9; background: var(--tinta); color: var(--fondo); padding: 10px 18px; display:flex; gap: 10px; align-items:center; flex-wrap:wrap; font-family: system-ui, sans-serif; font-size: 13px; }
.barra button, .barra select { font: 600 12px system-ui, sans-serif; padding: 8px 12px; border-radius: 99px; border: 1.5px solid var(--fondo); background: none; color: var(--fondo); cursor: pointer; }
.barra button.p { background: var(--fondo); color: var(--tinta); }
.barra .estado { margin-left:auto; opacity:.75; }
/* fiesta: titulos girados, pegatinas, confeti y fotos con marco grueso de color */
.m-fiesta .portada { justify-content: center; align-items: center; background: var(--acento2); }
.m-fiesta .portada::before { content:""; position:absolute; inset:0; background-image: var(--motivo); opacity: .5; }
.m-fiesta .portada .foto-caja { position: relative; width: 78%; max-width: 620px; height: 400px; border: 12px solid var(--papel); box-shadow: 14px 14px 0 var(--acento); transform: rotate(-2.5deg); }
.m-fiesta .portada .titulo { text-align: center; }
.m-fiesta .portada h1 { display: inline-block; background: var(--acento); color: var(--papel); padding: 6px 28px; transform: rotate(2deg); font-size: clamp(50px, 9vw, 96px); line-height: 1.1; box-shadow: 8px 8px 0 var(--tinta); }
.m-fiesta .portada .claim { font-family:"${d.manuscrita || d.cuerpo}", cursive; font-size: 22px; color: var(--tinta); margin-top: 22px; }
.m-fiesta .portada .eyebrow, .m-fiesta .portada .meta, .m-fiesta .portada .diseno { color: var(--tinta); }
.m-fiesta .portada .meta { justify-content: center; }
.m-fiesta .seccion > h2 { display: inline-block; background: var(--acento); color: var(--papel); padding: 8px 18px; transform: rotate(-1.5deg); box-shadow: 6px 6px 0 var(--acento2); }
.m-fiesta .seccion > h2 small { color: var(--papel); opacity: .85; }
.m-fiesta .dia-cab { border-bottom: 5px dotted var(--acento2); }
.m-fiesta .dia-cab .num { background: var(--acento2); color: var(--tinta); border-radius: 50%; width: 52px; height: 52px; display: inline-grid; place-items: center; font-size: 30px; transform: rotate(-8deg); }
.m-fiesta .parada .foto-caja { border: 6px solid var(--acento2); box-shadow: 6px 6px 0 var(--acento); border-radius: 4px; transform: rotate(-1.5deg); }
.m-fiesta .parada:nth-child(even) .foto-caja { transform: rotate(1.5deg); border-color: var(--acento); box-shadow: 6px 6px 0 var(--acento2); }
.m-fiesta .parada .tag { border: 2px solid var(--tinta); color: var(--tinta); font-weight: 800; transform: rotate(-2deg); }
.m-fiesta .parada .tag.res { background: var(--acento2); color: var(--tinta); border-color: var(--tinta); }
.m-fiesta .parada .truco { background: var(--papel); border: 2px dashed var(--acento); font-family:"${d.manuscrita || d.cuerpo}", cursive; font-size: 17px; line-height: 1.45; }
.m-fiesta .parada .salseo { background: var(--suave); border-left: 6px solid var(--acento2); border-radius: 0 12px 12px 0; }
.m-fiesta .salseos .s { border: 2px solid var(--tinta); box-shadow: 5px 5px 0 var(--acento2); }
.m-fiesta .salseos .s::before { color: var(--acento); }
.m-fiesta .caja { border: 2px solid var(--tinta); box-shadow: 4px 4px 0 var(--acento); }
.m-fiesta .frases span { border: 2px solid var(--acento); font-weight: 700; }
.m-fiesta .plato .foto-caja { border: 5px solid var(--acento); border-radius: 50% 12px 50% 12px; }
body.pdf.m-fiesta .portada .foto-caja { height: 430px; }

/* Modo PDF: la pagina se maqueta a 640 px (proporcion A4) y se fotografia por piezas */
body.pdf { background: var(--fondo); font-size: ${base + 2}px; }
body.pdf .pagina { width: 640px; max-width: 640px; margin: 0; padding: 0 28px 28px; background: var(--fondo); }
body.pdf .portada { min-height: 0; height: 905px; margin: 0 -28px 0; }
body.pdf .hoja { margin-top: 0; padding-top: 0; }
body.pdf .seccion { margin-top: 0; padding-top: 16px; }
body.pdf .seccion > h2 { font-size: 30px; margin-bottom: 10px; }
body.pdf .dia { margin-top: 0; }
body.pdf .dia-cab { margin-bottom: 4px; }
body.pdf .parada { grid-template-columns: 150px 1fr; padding: 12px 0; }
body.pdf .parada .foto-caja { height: 110px; }
body.pdf .parada h4 { font-size: ${base + 5}px; }
body.pdf .hueco { padding-left: 166px; }
body.pdf .platos { grid-template-columns: repeat(2, 1fr); }
body.pdf .plato .foto-caja { height: 130px; }
body.pdf .dos, body.pdf .salseos { grid-template-columns: 1fr 1fr; }
body.pdf .tres { grid-template-columns: repeat(3, 1fr); gap: 10px; }
body.pdf .caja { font-size: ${base}px; padding: 12px 12px; }
body.pdf .prosa { font-size: ${base + 2.5}px; }
body.pdf .portada h1 { font-size: 80px; }
body.pdf .m-cartel .portada h1 { font-size: 96px; }
body.pdf .m-postal .portada h1, body.pdf .m-ticket .portada h1 { font-size: 62px; }
body.pdf .m-cuaderno .portada h1 { font-size: 74px; }
body.pdf .m-fiesta .portada h1 { font-size: 72px; }
body.pdf .portada .claim { font-size: 20px; }
body.pdf .portada .titulo { padding: 32px 36px; }
body.pdf .m-cartel .portada .foto-caja { height: 340px; }
body.pdf .m-mosaico .portada .foto-caja { height: 420px; margin: 24px 24px 0; }
body.pdf .m-mosaico .portada .titulo { margin: 0 24px 24px; }
body.pdf .m-banda .portada .foto-caja { height: 400px; margin: 50px 44px 0; }
body.pdf .m-banda .portada .titulo { margin: -24px 44px 30px; padding: 24px 30px; }
body.pdf .m-revista .portada .titulo { padding-top: 360px; }
body.pdf .m-postal .portada .tarjeta { width: 92%; }
body.pdf .m-postal .portada .tarjeta .foto-caja { height: 340px; }
body.pdf .m-postal .portada .matasellos { display: grid; }
body.pdf .m-ticket .portada .billete { width: 94%; grid-template-columns: 1fr 170px; }
body.pdf .m-ticket .portada .billete .foto-caja { height: 300px; }
body.pdf .m-ticket .portada .talon { border-left: 2px dashed var(--linea); border-top: 0; flex-direction: column; }
body.pdf .m-cuaderno .portada .foto-caja, body.pdf .m-vitrina .portada .foto-caja { width: 84%; height: 360px; }
body.pdf .m-fiesta .portada .foto-caja { width: 82%; height: 340px; }
body.pdf .barra { display: none; }
@media print { .barra { display:none !important; } .pagina { max-width:none; padding: 0; } body { font-size: 12.5px; } .parada .foto-caja { height: 120px; } .parada { grid-template-columns: 160px 1fr; } .hueco { padding-left: 176px; } @page { margin: 14mm 12mm; } }
@media (max-width: 640px) {
  body:not(.pdf) { font-size: ${base - 1.5}px; }
  body:not(.pdf) .pagina { padding: 0 16px 40px; }
  body:not(.pdf) .portada { min-height: 78vh; margin: 0 -16px 20px; }
  body:not(.pdf) .portada h1 { font-size: 46px; }
  body:not(.pdf) .m-cartel .portada h1 { font-size: 56px; }
  body:not(.pdf) .portada .claim { font-size: 16px; }
  body:not(.pdf) .portada .titulo { padding: 24px 20px; }
  body:not(.pdf) .portada .meta { gap: 10px 14px; font-size: 10.5px; }
  body:not(.pdf) .seccion > h2 { font-size: 24px; }
  body:not(.pdf) .dia-cab .num { font-size: 32px; }
  body:not(.pdf) .dia-cab h3 { font-size: 18px; }
  body:not(.pdf) .dia-cab .zona { width: 100%; margin-left: 0; text-align: left; }
  body:not(.pdf) .parada, body:not(.pdf) .corta .parada { grid-template-columns: 1fr; }
  body:not(.pdf) .parada .foto-caja { height: 170px; }
  body:not(.pdf) .parada h4 { font-size: ${base + 1}px; }
  body:not(.pdf) .dos, body:not(.pdf) .tres, body:not(.pdf) .salseos { grid-template-columns: 1fr; }
  body:not(.pdf) .platos { grid-template-columns: 1fr 1fr; }
  body:not(.pdf) .hueco { padding-left: 0; }
  body:not(.pdf) .m-cuaderno .portada .foto-caja, body:not(.pdf) .m-vitrina .portada .foto-caja { width: 90%; height: 240px; }
  body:not(.pdf) .m-postal .portada .tarjeta .foto-caja { height: 220px; }
  body:not(.pdf) .m-postal .portada .matasellos { display: none; }
  body:not(.pdf) .m-ticket .portada .billete { grid-template-columns: 1fr; }
  body:not(.pdf) .m-ticket .portada .talon { border-left: 0; border-top: 2px dashed var(--linea); flex-direction: row; flex-wrap: wrap; }
  body:not(.pdf) .m-banda .portada .foto-caja { margin: 30px 16px 0; height: 36vh; }
  body:not(.pdf) .m-banda .portada .titulo { margin: -20px 16px 30px; padding: 20px; }
  .barra { padding: 8px 12px; gap: 6px; }
  .barra button, .barra select { padding: 7px 10px; font-size: 11px; }
  .barra .estado { width: 100%; margin-left: 0; font-size: 11px; }
}

/* ===== Portadas por maquetacion ===== */
.portada { position: relative; min-height: 96vh; display:flex; flex-direction:column; justify-content:flex-end; margin: 0 -28px 30px; overflow:hidden; }
.portada .foto-caja { position:absolute; inset:0; }
.portada > * { position: relative; }
.portada .titulo { position: relative; padding: 40px 48px; }
.portada h1 { font-size: clamp(54px, 10vw, 110px); line-height: .92; letter-spacing: -.01em; }
.portada .claim { font-size: 20px; margin-top: 12px; max-width: 560px; }
.portada .meta { margin-top: 18px; font-size: 12px; letter-spacing: .2em; text-transform: uppercase; display:flex; gap: 22px; flex-wrap: wrap; }
.portada .diseno { position:absolute; top: 22px; right: 28px; font-size: 10px; letter-spacing: .24em; text-transform: uppercase; opacity: .8; }
@media print { .portada { min-height: 0; height: 250mm; margin: 0 0 20px; } }

/* revista: foto a sangre, degradado y titular blanco encima */
.m-revista .portada .titulo { color: #fff; background: linear-gradient(to top, rgba(0,0,0,.72), rgba(0,0,0,.05)); padding-top: 160px; }
.m-revista .portada .eyebrow { color: #fff; opacity: .85; }
.m-revista .portada .diseno { color:#fff; }

/* cartel: sin foto arriba, titular gigante sobre motivo, foto abajo en franja */
.m-cartel .portada { justify-content: flex-start; background: var(--acento); }
.m-cartel .portada::before { content:""; position:absolute; inset:0; background-image: var(--motivo); opacity: .45; }
.m-cartel .portada .foto-caja { position: static; height: 38vh; order: 2; margin-top: auto; border-top: 6px solid var(--acento2); }
.m-cartel .portada .titulo { color: var(--papel); padding-top: 70px; background: linear-gradient(to bottom, var(--acento) 60%, transparent); }
.m-cartel .portada h1 { font-size: clamp(70px, 13vw, 150px); text-transform: uppercase; }
.m-cartel .portada .eyebrow, .m-cartel .portada .diseno { color: var(--papel); }
.m-cartel .seccion > h2 { text-transform: uppercase; letter-spacing: .02em; }

/* cuaderno: papel, foto pegada con cinta, titulo a mano */
.m-cuaderno .portada { background-image: var(--motivo); }
.m-cuaderno .portada { justify-content: center; align-items:center; min-height: 92vh; }
.m-cuaderno .portada .foto-caja { position: relative; width: 70%; max-width: 560px; height: 380px; margin: 0 auto; box-shadow: 0 18px 40px rgba(0,0,0,.18); transform: rotate(-2deg); border: 10px solid #fff; }
.m-cuaderno .portada .foto-caja::before { content:""; position:absolute; top:-14px; left:50%; width: 120px; height: 28px; background: rgba(255,240,180,.7); transform: translateX(-50%) rotate(2deg); z-index:2; }
.m-cuaderno .portada .titulo { text-align:center; padding-top: 26px; }
.m-cuaderno .portada h1 { font-family:"${d.manuscrita || d.titulo}", cursive; font-size: clamp(50px, 9vw, 96px); color: var(--acento); }
.m-cuaderno .portada .meta { justify-content:center; }
.m-cuaderno .parada .foto-caja { border: 6px solid #fff; box-shadow: 0 6px 16px rgba(0,0,0,.12); transform: rotate(-1.2deg); border-radius: 2px; }
.m-cuaderno .parada:nth-child(even) .foto-caja { transform: rotate(1.2deg); }
.m-cuaderno .parada .truco { font-family:"${d.manuscrita || d.cuerpo}", cursive; font-size: 18px; line-height: 1.45; background: none; border-bottom: 1px dashed var(--acento2); border-radius: 0; padding-left: 0; }

/* postal: tarjeta con sello dentado y matasellos */
.m-postal .portada { justify-content:center; align-items:center; }
.m-postal .portada .tarjeta { position: relative; width: 88%; max-width: 720px; background: var(--papel); padding: 18px; box-shadow: 0 20px 50px rgba(0,0,0,.18); }
.m-postal .portada .tarjeta .foto-caja { position: relative; height: 380px; }
.m-postal .portada .sello { position:absolute; top: 34px; right: 34px; width: 86px; height: 104px; padding: 8px; background: radial-gradient(circle, transparent 3px, var(--acento2) 3.5px) -5px -5px / 10px 10px; z-index: 3; }
.m-postal .portada .sello div { background: var(--papel); background-image: var(--motivo); height: 100%; }
.m-postal .portada .matasellos { position:absolute; top: 40px; right: 100px; width: 96px; height: 96px; border-radius: 50%; border: 2px solid var(--acento); display:grid; place-items:center; text-align:center; transform: rotate(-14deg); font-size: 10px; letter-spacing:.1em; text-transform:uppercase; color: var(--acento); z-index: 4; line-height: 1.3; background: rgba(255,255,255,.45); }
.m-postal .portada .matasellos b { font-size: 16px; display:block; }
.m-postal .portada .titulo { text-align:center; padding-top: 14px; padding-bottom: 6px; }
.m-postal .portada h1 { font-size: clamp(44px, 8vw, 80px); color: var(--acento); }
.m-postal .portada .meta { justify-content:center; }
.m-postal .parada .foto-caja { border: 5px solid var(--papel); box-shadow: 0 4px 14px rgba(0,0,0,.12); }

/* ticket: billete con perforado lateral y talon */
.m-ticket .portada { justify-content:center; align-items:center; background: var(--acento); }
.m-ticket .portada::before { content:""; position:absolute; inset:0; background-image: var(--motivo); opacity: .4; }
.m-ticket .portada .billete { display:grid; grid-template-columns: 1fr 200px; width: 90%; max-width: 780px; background: var(--papel); border-radius: 14px; overflow:hidden; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
.m-ticket .portada .billete .foto-caja { position: relative; height: 260px; grid-column: 1 / -1; }
.m-ticket .portada .titulo { padding: 26px 34px; }
.m-ticket .portada h1 { font-size: clamp(40px, 7vw, 70px); color: var(--acento); }
.m-ticket .portada .talon { border-left: 2px dashed var(--linea); padding: 26px 22px; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--tinta2); display:flex; flex-direction:column; gap: 12px; position:relative; }
.m-ticket .portada .talon b { display:block; font-family:"${d.titulo}"; font-size: 26px; letter-spacing: 0; text-transform:none; color: var(--acento); }
.m-ticket .portada .talon::before, .m-ticket .portada .talon::after { content:""; position:absolute; left: -12px; width: 22px; height: 22px; border-radius: 50%; background: var(--acento); }
.m-ticket .portada .talon::before { top: -11px; } .m-ticket .portada .talon::after { bottom: -11px; }
.m-ticket .dia-cab { background: var(--papel); border: 1px solid var(--linea); border-bottom: 2px solid var(--acento); border-radius: 10px 10px 0 0; padding: 12px 16px 10px; }

/* mosaico: rejilla de motivo y fotos como baldosas */
.m-mosaico .portada { background: var(--suave); justify-content: flex-start; }
.m-mosaico .portada::before { content:""; position:absolute; inset:0; background-image: var(--motivo); opacity: .55; }
.m-mosaico .portada .foto-caja { position: relative; height: 46vh; margin: 24px 28px 0; border: 8px solid var(--papel); box-shadow: 0 10px 30px rgba(0,0,0,.15); }
.m-mosaico .portada .titulo { background: var(--papel); margin: 0 28px 28px; border: 1px solid var(--linea); border-top: 0; }
.m-mosaico .portada h1 { color: var(--acento); }
.m-mosaico .seccion > h2 { display:inline-block; padding: 6px 14px; background: var(--acento); color: var(--papel); }
.m-mosaico .parada .foto-caja { border: 5px solid var(--papel); box-shadow: 0 0 0 1px var(--linea); border-radius: 0; }

/* vitrina: fondo oscuro, marcos dorados */
.m-vitrina .portada { justify-content:center; align-items:center; background: var(--fondo); }
.m-vitrina .portada::before { content:""; position:absolute; inset:0; background-image: var(--motivo); opacity: .35; }
.m-vitrina .portada .foto-caja { position: relative; width: 80%; max-width: 640px; height: 400px; border: 3px solid var(--acento); outline: 1px solid var(--acento); outline-offset: 8px; box-shadow: 0 30px 60px rgba(0,0,0,.5); }
.m-vitrina .portada .titulo { text-align:center; }
.m-vitrina .portada h1 { color: var(--acento); font-weight: 400; }
.m-vitrina .portada .meta { justify-content:center; color: var(--tinta2); }

function htmlGuia(plan, d, corta) {
  const { ciudad, dias, fecha } = plan;

  let portada;

    case "postal":
      portada = '<div class="portada"><div class="tarjeta"><div class="sello"><div></div></div><div class="matasellos"><div>' + MESES[fecha.getMonth()].slice(0, 3) + '<b>' + fecha.getDate() + '</b>' + fecha.getFullYear() + '</div></div>' + fotoPortada + titulo + '</div>' + etiqueta + '</div>'; break;
    case "ticket":
      portada = '<div class="portada"><div class="billete">' + fotoPortada + titulo + '<div class="talon"><span>Destino<b>' + esc(ciudad.nombre) + '</b></span><span>Llegada<b>' + fecha.getDate() + ' ' + MESES[fecha.getMonth()].slice(0, 3) + '</b></span><span>Días<b>' + dias.length + '</b></span><span>Asiento<b>11:00</b></span></div></div>' + etiqueta + '</div>'; break;
    default:
      portada = '<div class="portada">' + fotoPortada + titulo + etiqueta + '</div>';
  }

  let h = portada;

  // La ciudad en dos minutos (solo version larga)
  if (!corta && g.historia) {
    h += '<div class="seccion hoja"><h2><small>Antes de salir</small>⏱️ ' + esc(ciudad.nombre) + ' en dos minutos</h2><div class="prosa"><p>' + esc(g.historia) + '</p></div>';

  }

  h += '<div class="seccion' + (corta ? ' corta' : '') + '"><h2><small>Día a día</small>🗺️ El itinerario</h2>';
  dias.forEach((dia, i) => {
    h += '<div class="dia bloque"><div class="dia-cab"><span class="num">' + (i + 1) + '</span><h3>' + esc(dia.etiqueta) + '</h3><span class="zona">' + esc(dia.zona) + '<br>atardecer ' + hhmm(dia.ocaso) + '</span></div>';
    if (dia.libre) { h += '<p class="prosa">Día libre: repetir lo que más gustó, cambiar los filtros o hacer una excursión.</p></div>'; return; }
    dia.filas.forEach(f => {
      if (f.hueco) { h += '<div class="hueco">' + EMOJI_HUECO_GUIA(f.texto) + ' ' + f.h + ' · ' + esc(f.texto) + '</div>'; return; }
      const p = f.parada;
      h += '<div class="parada">' + fotoBox((g.wiki || {})[p.n], p.n);
      h += '<div><div class="hora">' + p._h + ' · ' + esc(p._t) + '</div><h4>' + (EMOJI_GUIA[p.tags[0]] || '📍') + ' ' + esc(p.n) + '</h4>';

    h += '</div>';
    h += '<h2 style="margin-top:34px"><small>De los sitios que vas a pisar</small>📍 Salseos del itinerario</h2><ul class="lista">';
    dias.forEach(dd => dd.paradas.forEach(p => { h += '<li><b>' + esc(p.n) + '.</b> ' + esc(p.salseo) + '</li>'; }));
    h += '</ul></div>';

    // Comer
    h += '<div class="seccion hoja"><h2><small>De comer</small>🍽️ Qué pedir y dónde</h2><div class="platos">';
    (g.platos || []).forEach(pl => { h += '<div class="plato">' + fotoBox(pl.wiki, pl.n) + '<h4>' + esc(pl.n) + '</h4><p>' + esc(pl.d) + '</p></div>'; });
    h += '</div><div class="dos" style="margin-top:24px"><div><h5 class="eyebrow">🍴 Dónde comer</h5><ul class="lista">' + ciudad.comer.map(c => '<li>' + esc(c) + '</li>').join('') + '</ul></div>';

  } else {
    h += '<div class="seccion"><div class="dos"><div><h5 class="eyebrow">🍴 Dónde comer</h5><ul class="lista">' + ciudad.comer.map(c => '<li>' + esc(c) + '</li>').join('') + '</ul></div><div><h5 class="eyebrow">🌾 Sin gluten y bueno saber</h5><ul class="lista">' + ciudad.singluten.map(c => '<li>' + esc(c) + '</li>').join('') + '<li>' + esc(ciudad.consejo) + '</li></ul></div></div></div>';
  }

  h += '<div class="cierre bloque"><div class="t">Hecho para pasearlo sin prisa</div>Horas, precios y aperturas son orientativos. Lo marcado como Reservar se agota. Fotos: Wikimedia Commons, licencia libre.</div>';
  return h;
}

/* Script que corre dentro de la guia: carga las fotos de Wikipedia y controla la barra */
const SCRIPT_GUIA = `
async function json(url) {
  const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), 8000);
  try { const r = await fetch(url, { signal: ctrl.signal }); if (!r.ok) throw new Error(r.status); return await r.json(); }
  finally { clearTimeout(t); }
}
// Imagen principal del articulo al tamano pedido (API de Wikipedia con CORS abierto via origin=*)
async function imagen(lang, titulo) {
  const d = await json("https://" + lang + ".wikipedia.org/w/api.php?action=query&prop=pageimages&piprop=thumbnail&pithumbsize=900&redirects=1&format=json&origin=*&titles=" + encodeURIComponent(titulo));
  const paginas = d.query && d.query.pages ? Object.values(d.query.pages) : [];
  const p = paginas.find(x => x.thumbnail);
  return p ? p.thumbnail.source : null;
}
// Reserva: el resumen REST, cuya miniatura se amplia sin pasarse del original
async function resumen(lang, titulo) {
  const d = await json("https://" + lang + ".wikipedia.org/api/rest_v1/page/summary/" + encodeURIComponent(titulo.replace(/ /g, "_")) + "?redirect=true");
  if (!d.thumbnail || !d.thumbnail.source) return null;
  const ancho = Math.min(900, ((d.originalimage && d.originalimage.width) || 320) - 1);
  return ancho > 320 ? d.thumbnail.source.replace(/\\/\\d+px-/, "/" + ancho + "px-") : d.thumbnail.source;
}
async function buscar(lang, texto) {
  const d = await json("https://" + lang + ".wikipedia.org/w/api.php?action=opensearch&limit=1&namespace=0&format=json&origin=*&search=" + encodeURIComponent(texto));
  return d[1] && d[1][0];
}
async function fotoDe(ref, alt) {
  const [lang, titulo] = ref.includes(":") ? [ref.slice(0, 2), ref.slice(3)] : ["es", ref];
  const otro = lang === "es" ? "en" : "es";
  const intentos = [
    () => imagen(lang, titulo),
    () => imagen(otro, titulo),
    () => resumen(lang, titulo),
    async () => { const t = await buscar("es", alt); return t && imagen("es", t); },
    async () => { const t = await buscar("en", alt); return t && imagen("en", t); }
  ];
  for (const f of intentos) { try { const u = await f(); if (u) return u; } catch (e) {} }
  return null;
}
let pendientes = 0, hechas = 0;
function estado() { const e = document.getElementById("estado"); if (e) e.textContent = pendientes ? "Cargando fotos " + hechas + "/" + pendientes : "Fotos listas · Imprimir guarda en PDF"; }

function hex(c) { const h = c.replace("#", ""); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; }

// Emoticonos: se dibujan con la fuente de emojis del sistema en un canvas y van al PDF como imagen
const cacheEmoji = {};
function emojiPng(ch) {
  if (cacheEmoji[ch] !== undefined) return cacheEmoji[ch];
  try {
    const c = document.createElement("canvas"); c.width = c.height = 72; const x = c.getContext("2d");
    if (!x) throw new Error("sin canvas");
    x.font = '56px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Twemoji Mozilla",sans-serif'; x.textAlign = "center"; x.textBaseline = "middle";
    x.fillText(ch, 36, 40);
    cacheEmoji[ch] = c.toDataURL("image/png");
  } catch (e) { cacheEmoji[ch] = null; }
  return cacheEmoji[ch];
}

// Fotos ya cargadas en la pagina: se leen del DOM y se recortan a la caja pedida (canvas pequeno)
function fotoCargada(ref) {
  const caja = [...document.querySelectorAll(".foto-caja")].find(c => c.dataset.wiki === ref);
  const img = caja && caja.querySelector("img");
  return img && img.complete && img.naturalWidth && img.style.display !== "none" ? img : null;
}
function recortar(img, w, h) {
  const k = 2, c = document.createElement("canvas"); c.width = Math.round(w * k); c.height = Math.round(h * k);
  const ctx = c.getContext("2d");
  const r = Math.max(c.width / img.naturalWidth, c.height / img.naturalHeight);
  const dw = img.naturalWidth * r, dh = img.naturalHeight * r;
  try { ctx.drawImage(img, (c.width - dw) / 2, (c.height - dh) / 2, dw, dh); return c.toDataURL("image/jpeg", 0.82); } catch (e) { return null; }
}

async function cargarFuente(pdf, familia) {
  const f = FUENTES[familia];
  for (const [estilo, url] of Object.entries(f)) {
    try {
      const r = await fetch(url); if (!r.ok) throw new Error(r.status);
      const b = await r.blob();
      const b64 = await new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result.split(",")[1]); fr.readAsDataURL(b); });
      const nombre = familia + "-" + estilo + ".ttf";
      pdf.addFileToVFS(nombre, b64); pdf.addFont(nombre, familia, estilo === "bold" ? "bold" : estilo === "italic" ? "italic" : "normal");
    } catch (e) { return false; }
  }
  return true;
}

    const serifCuerpo = /Garamond|Lora|Baskerville|Crimson|Cormorant/i.test(d.cuerpo);
    const okSans = await cargarFuente(pdf, "sans"), okSerif = await cargarFuente(pdf, "serif");
    const FT = serifTitulo ? (okSerif ? "serif" : "times") : (okSans ? "sans" : "helvetica");
    const FC = serifCuerpo ? (okSerif ? "serif" : "times") : (okSans ? "sans" : "helvetica");
    const oscuro = /^#[0-3]/.test(P.fondo);
    const mezclar = (a, b, t) => { const x = hex(a), y = hex(b); return x.map((v, i) => Math.round(v * t + y[i] * (1 - t))); };
    const col = { fondo: hex(P.fondo), papel: hex(P.papel), tinta: hex(P.tinta), tinta2: hex(P.tinta2), acento: hex(P.acento), acento2: hex(P.acento2), suave: mezclar(P.acento, P.papel, oscuro ? 0.22 : 0.08), linea: mezclar(P.tinta, P.papel, 0.16), motivo: mezclar(P.acento, P.fondo, oscuro ? 0.5 : 0.35) };
    const W = A4.w, H = A4.h, M = A4.m, CW = W - 2 * M;
    let y = M, pagina = 1;
    const cap = t => E.mayus ? limpiar(t).toUpperCase() : limpiar(t);
    const emoji = (ch, x, yy, s) => { const p = emojiPng(ch); if (p) { pdf.addImage(p, "PNG", x, yy, s, s); return s + 4; } return 0; };

    /* --- Motivo grafico del diseno, dibujado con formas simples en una franja --- */
    const franjaMotivo = (x0, y0, w, h) => {
      pdf.setDrawColor(...col.motivo); pdf.setFillColor(...col.motivo); pdf.setLineWidth(0.7);
      const m = d.motivo;
      if (/azulejo|rombos|arlequin|zsolnay|wycinanka/.test(m)) { for (let x = x0; x < x0 + w; x += h) { pdf.lines([[h / 2, -h / 2], [h / 2, h / 2], [-h / 2, h / 2]], x, y0 + h / 2, [1, 1], /azulejo/.test(m) ? "S" : "F", true); } }
      else if (/ondas/.test(m)) { for (let x = x0; x < x0 + w; x += h) { pdf.lines([[h / 4, -h / 3, h / 2, -h / 3, h * 0.75, 0], [h / 4, h / 3, h / 2, h / 3, h * 0.75, 0]], x, y0 + h / 2, [1, 1], "S"); } }
      else if (/rayas|tartan/.test(m)) { for (let x = x0; x < x0 + w; x += h) pdf.rect(x, y0, h / 2, h, "F"); }
      else if (/puntos|comic|lunares/.test(m)) { const r = /lunares/.test(m) ? h / 4 : h / 7; for (let x = x0 + h / 2; x < x0 + w; x += h) pdf.circle(x, y0 + h / 2, r, "F"); }
      else if (/meandro/.test(m)) { for (let x = x0; x < x0 + w - h; x += h) { pdf.lines([[0, -h * 0.8], [h * 0.8, 0], [0, h * 0.5], [-h * 0.5, 0], [0, -h * 0.25]], x, y0 + h * 0.9, [1, 1], "S"); } }
      else if (/estrellas|lirio/.test(m)) { for (let x = x0 + h / 2; x < x0 + w; x += h) { pdf.circle(x, y0 + h / 2, h / 5, "F"); pdf.circle(x, y0 + h / 2, h / 2.6, "S"); } }

/* ---------- PDF exacto: la pagina tal como la pinta el navegador, bloque a bloque ---------- */
async function generarPdfExacto() {
  const e = document.getElementById("estado");
  e.textContent = "Esperando las fotos…"; await esperarFotos();
  await document.fonts.ready;
  const { jsPDF } = window.jspdf;
  const ANCHO = 640, ALTO = 905, SEP = 10;   // proporcion A4, maquetado para leerse bien en movil
  const movil = /iPhone|iPad|Android/i.test(navigator.userAgent);
  const escala = movil ? 1.6 : 2.2;
  document.body.classList.add("pdf"); window.scrollTo(0, 0);
  // Safari no deja fotografiar SVG incrustados ni fotos de otro dominio: se convierten a PNG/JPEG locales
  const motivoPng = await rasterizarMotivo();
  document.documentElement.style.setProperty("--motivo", motivoPng ? "url(" + motivoPng + ")" : "none");
  document.querySelectorAll(".foto-caja").forEach(c => {
    const img = c.querySelector("img");
    if (img && img.src && img.style.display !== "none" && img.complete && img.naturalWidth) {
      const r = c.getBoundingClientRect();
      const local = recortar(img, Math.max(40, r.width), Math.max(40, r.height));
      if (local) { c.style.backgroundImage = "url(" + local + ")"; c.style.backgroundSize = "cover"; c.style.backgroundPosition = "center"; c.style.backgroundRepeat = "no-repeat"; }
      img.style.visibility = "hidden";
    }
  });
  await new Promise(r => setTimeout(r, 250));
  try {
    if (typeof html2canvas !== "function") throw new Error("html2canvas no se ha cargado");
    const fondo = getComputedStyle(document.body).getPropertyValue("--fondo").trim() || "#ffffff";
    const pdf = new jsPDF({ unit: "px", format: [ANCHO, ALTO], orientation: "portrait", hotfixes: ["px_scaling"] });
    const pagina = document.querySelector(".pagina");
    const limite = ALTO - 40;
    // Piezas: se baja al nivel de hijo mientras un elemento no quepa en una pagina
    const piezas = [];
    const meter = (el, nueva) => {
      const h = el.getBoundingClientRect().height;
      const indivisible = el.classList.contains("parada") || el.classList.contains("portada") || el.classList.contains("plato") || el.classList.contains("s") || el.classList.contains("caja") || el.tagName === "LI" || el.tagName === "H2" || el.tagName === "P";
      if (h <= limite || indivisible || !el.children.length) { piezas.push({ el, nueva }); return; }
      [...el.children].forEach((c, i) => { if (c.getBoundingClientRect().height > 0) meter(c, nueva && i === 0); });
    };
    [...pagina.children].forEach(el => {
      if (el.classList.contains("portada")) { piezas.push({ el, nueva: true }); return; }
      // Flujo continuo: nada pide pagina nueva salvo la portada; solo se salta cuando una pieza no cabe
      const hijos = [...el.children];
      const dias = hijos.filter(x => x.classList.contains("dia"));
      if (dias.length) {
        hijos.filter(x => !x.classList.contains("dia")).forEach(x => meter(x, false));
        dias.forEach(dd => [...dd.children].forEach(x => meter(x, false)));
      } else meter(el, false);
    });
    const pintarFondo = () => { pdf.setFillColor(fondo); pdf.rect(0, 0, ANCHO, ALTO, "F"); };
    let y = 0, primera = true, n = 0, fallos = 0;
    pintarFondo();
    for (const b of piezas) {
      n++; e.textContent = "Montando el PDF exacto: pieza " + n + " de " + piezas.length;
      let canvas;
      try { canvas = await html2canvas(b.el, { scale: escala, useCORS: true, backgroundColor: fondo, logging: false, windowWidth: ANCHO, scrollX: 0, scrollY: -window.scrollY }); }
      catch (err) { console.error("pieza " + n, err); fallos++; if (fallos > 3) throw err; continue; }
      let w = canvas.width / escala, h = canvas.height / escala;
      if (w > ANCHO) { h = h * ANCHO / w; w = ANCHO; }
      const esPortada = b.el.classList.contains("portada");
      const x = esPortada ? 0 : Math.max(0, (ANCHO - w) / 2);
      // Salto de pagina: si lo pide la pieza, o si no cabe en lo que queda
      const cabecera = b.el.classList.contains("dia-cab") || b.el.tagName === "H2" || b.el.tagName === "H5";
      const necesario = h + (cabecera ? 120 : 0);
      if (!primera && y > 0 && (b.nueva || y + necesario > ALTO - 24)) { pdf.addPage(); pintarFondo(); y = 0; }
      if (!esPortada && y === 0) y = 24;
      if (h <= ALTO) { pdf.addImage(canvas.toDataURL("image/jpeg", 0.88), "JPEG", x, y, w, h); y += h + (esPortada ? 0 : SEP); }
      else {
        let offset = 0;
        while (offset < h) {
          const franja = Math.min(ALTO - y, h - offset);
          const trozo = document.createElement("canvas"); trozo.width = canvas.width; trozo.height = Math.round(franja * escala);
          trozo.getContext("2d").drawImage(canvas, 0, Math.round(offset * escala), canvas.width, trozo.height, 0, 0, canvas.width, trozo.height);
          pdf.addImage(trozo.toDataURL("image/jpeg", 0.88), "JPEG", x, y, w, franja);
          offset += franja; y += franja;
          if (offset < h) { pdf.addPage(); pintarFondo(); y = 0; }
        }
      }
      if (y >= ALTO - 24) { pdf.addPage(); pintarFondo(); y = 0; }
      primera = false; canvas.width = canvas.height = 0;
    }
    const blob = pdf.output("blob");
    e.textContent = "PDF exacto listo (" + Math.round(blob.size / 1024) + " KB)";
    return new File([blob], nombrePdf(), { type: "application/pdf" });
  } finally {
    document.body.classList.remove("pdf");
    document.documentElement.style.removeProperty("--motivo");
    document.querySelectorAll(".foto-caja").forEach(c => { c.style.backgroundImage = ""; c.style.backgroundSize = ""; c.style.backgroundPosition = ""; const img = c.querySelector("img"); if (img) img.style.visibility = ""; });
  }
}
// Convierte el motivo SVG del diseno en un PNG local (Safari no deja fotografiar SVG incrustados)
async function rasterizarMotivo() {
  try {
    const css = getComputedStyle(document.documentElement).getPropertyValue("--motivo").trim();
    const m = css.match(/url\\(["']?(data:image\\/svg\\+xml[^"')]+)["']?\\)/);
    if (!m) return null;
    const src = m[1];
    const img = new Image();
    await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = src; });
    const w = img.naturalWidth || 60, h = img.naturalHeight || 60;
    const c = document.createElement("canvas"); c.width = w; c.height = h;
    c.getContext("2d").drawImage(img, 0, 0, w, h);
    return c.toDataURL("image/png");
  } catch (e) { console.warn("motivo", e); return null; }
}
// Primero el exacto; si el navegador no puede (memoria en moviles viejos), el ligero
async function generarPdf() {
