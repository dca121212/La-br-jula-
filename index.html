/* ======================================================================
   MIS VIAJES GUARDADOS
   Se guardan en localStorage los filtros del viaje (no el itinerario), y
   se regenera al abrirlo: el motor es determinista, sale lo mismo. Tambien
   se guardan las paradas marcadas como hechas y las cambiadas.
   ====================================================================== */
const CLAVE = "brujula:viajes";
function leerViajes() { try { return JSON.parse(localStorage.getItem(CLAVE) || "[]"); } catch (e) { return []; } }
function escribirViajes(v) { localStorage.setItem(CLAVE, JSON.stringify(v)); }
function viajeDe(id) { return leerViajes().find(v => v.id === id); }

function guardarViaje() {
  if (!ultimoPlan) return;
  const nombre = document.getElementById("nombre-viaje").value.trim() || ultimoPlan.ciudad.nombre;
  const viajes = leerViajes();
  const id = "v" + Date.now();
  viajes.unshift({ id, nombre, creado: new Date().toISOString(), entrada: ultimoPlan.entrada, hechas: [] });
  escribirViajes(viajes);
  viajeActual = id;
  document.getElementById("guardar-caja").classList.remove("visible");
  document.getElementById("btn-guardar").textContent = "Guardado";
  pintarViajes(); pintarHoy(); pintarProgreso();
}

function abrirViaje(id) {
  const v = viajeDe(id); if (!v) return;
  viajeActual = id;
  aplicarFormulario(v.entrada);
  generar(v.entrada);
}

function borrarViaje(id) {
  const v = viajeDe(id); if (!v) return;
  if (!confirm("¿Borrar el viaje \"" + v.nombre + "\"?")) return;
  escribirViajes(leerViajes().filter(x => x.id !== id));
  if (viajeActual === id) { viajeActual = null; const b = document.getElementById("btn-guardar"); if (b) b.textContent = "Guardar este viaje"; }
  pintarViajes(); pintarHoy(); pintarProgreso();
}

// Numero de paradas del viaje (regenerandolo sin pintar)
function paradasDe(v) {
  const plan = cuadrar(v.entrada);
  return plan ? plan.dias.reduce((s, d) => s + d.paradas.length, 0) : 0;
}

function pintarViajes() {
  const viajes = leerViajes();
  const caja = document.getElementById("viajes");
  caja.classList.toggle("visible", viajes.length > 0);
  const lista = document.getElementById("lista-viajes");
  lista.innerHTML = viajes.map(v => {
    const c = CIUDADES[v.entrada.ciudad];
    const f = new Date(v.entrada.fecha + "T12:00:00");
    const total = paradasDe(v), hechas = (v.hechas || []).length;
    const pct = total ? Math.round(100 * hechas / total) : 0;
    return '<div class="viaje"><div class="info"><div class="titulo-viaje">' + esc(v.nombre) + '</div>' +
      '<div class="sub-viaje">' + esc(c ? c.nombre : "?") + ' · ' + f.getDate() + ' de ' + MESES[f.getMonth()] + ' de ' + f.getFullYear() + ' · ' + v.entrada.dias + (v.entrada.dias == 1 ? ' día' : ' días') + ' · ' + hechas + '/' + total + ' paradas hechas</div>' +
      '<div class="barra-viaje"><div style="width:' + pct + '%"></div></div></div>' +
      '<button type="button" class="btn-mini" data-abrir="' + v.id + '">Abrir</button>' +
      '<button type="button" class="btn-mini peligro" data-borrar="' + v.id + '">Borrar</button></div>';
  }).join("");
  lista.querySelectorAll("[data-abrir]").forEach(b => b.addEventListener("click", () => abrirViaje(b.dataset.abrir)));
  lista.querySelectorAll("[data-borrar]").forEach(b => b.addEventListener("click", () => borrarViaje(b.dataset.borrar)));
}

/* Paradas hechas: checkbox por parada, persistente si el viaje esta guardado */
function marcarHecha(c) {
  c.closest(".parada").classList.toggle("hecha", c.checked);
  if (!viajeActual) return;
  const viajes = leerViajes(); const v = viajes.find(x => x.id === viajeActual); if (!v) return;
  v.hechas = v.hechas || [];
  if (c.checked && !v.hechas.includes(c.dataset.nombre)) v.hechas.push(c.dataset.nombre);
  if (!c.checked) v.hechas = v.hechas.filter(n => n !== c.dataset.nombre);
  escribirViajes(viajes);
  pintarViajes(); pintarProgreso();
}
function pintarHechas() {
  const v = viajeActual ? viajeDe(viajeActual) : null;
  const hechas = v ? (v.hechas || []) : [];
  document.querySelectorAll(".hecho").forEach(c => { c.checked = hechas.includes(c.dataset.nombre); c.closest(".parada").classList.toggle("hecha", c.checked); });
  pintarProgreso();
}
function pintarProgreso() {
  const caja = document.getElementById("progreso-viaje"); if (!caja) return;
  if (!viajeActual || !ultimoPlan) { caja.textContent = ultimoPlan ? "Guarda el viaje para que las paradas marcadas se recuerden." : ""; return; }
  const total = ultimoPlan.dias.reduce((s, d) => s + d.paradas.length, 0);
  const hechas = document.querySelectorAll(".hecho:checked").length;
  caja.textContent = hechas + " de " + total + " paradas hechas" + (hechas === total && total ? ". Viaje completado, a por el siguiente." : ".");
}

/* Cambiar una parada por otra: se excluye y se vuelve a cuadrar */
function cambiarParada(nombre) {
  if (!ultimoPlan) return;
  const entrada = { ...ultimoPlan.entrada, excluidas: [...(ultimoPlan.entrada.excluidas || []), nombre] };
  if (viajeActual) {
    const viajes = leerViajes(); const v = viajes.find(x => x.id === viajeActual);
    if (v) { v.entrada = entrada; escribirViajes(viajes); }
  }
  generar(entrada);
}

/* Banner de "hoy": si un viaje guardado incluye la fecha de hoy o esta cerca */
function pintarHoy() {
  const caja = document.getElementById("hoy");
  const hoy = new Date(); hoy.setHours(12, 0, 0, 0);
  let mejor = null;
  leerViajes().forEach(v => {
    const ini = new Date(v.entrada.fecha + "T12:00:00");
    const fin = new Date(ini); fin.setDate(fin.getDate() + parseInt(v.entrada.dias, 10) - 1);
    const faltan = Math.round((ini - hoy) / 86400000);
    if (hoy >= ini && hoy <= fin) mejor = { v, texto: "Hoy toca el día " + (Math.round((hoy - ini) / 86400000) + 1) + " de " + v.entrada.dias + " en " + CIUDADES[v.entrada.ciudad].nombre + ". Abre el viaje y a pasearlo." };
    else if (faltan > 0 && faltan <= 21 && !mejor) mejor = { v, texto: "Faltan " + faltan + (faltan === 1 ? " día" : " días") + " para " + CIUDADES[v.entrada.ciudad].nombre + ". Buen momento para repasar lo que hay que reservar." };
  });
  caja.classList.toggle("visible", !!mejor);
  if (mejor) { caja.innerHTML = '<b>' + esc(mejor.v.nombre) + '</b>' + esc(mejor.texto) + ' <button type="button" class="btn-mini" style="color:#fff;border-color:rgba(255,255,255,0.5);margin-left:10px" data-abrir="' + mejor.v.id + '">Abrir</button>'; caja.querySelector("[data-abrir]").addEventListener("click", () => abrirViaje(mejor.v.id)); }
}

/* Compartir: los filtros van en el enlace, quien lo abra ve el mismo plan */
function compartirEnlace() {
  if (!ultimoPlan) return;
  const datos = btoa(unescape(encodeURIComponent(JSON.stringify(ultimoPlan.entrada))));
  const url = location.origin + location.pathname + "#v=" + datos;
  navigator.clipboard.writeText(url).then(() => {
    const b = document.getElementById("btn-compartir"); b.textContent = "Enlace copiado"; setTimeout(() => b.textContent = "Copiar enlace para compartir", 1800);
  });
}
function abrirDesdeEnlace() {
  const m = location.hash.match(/#v=(.+)/); if (!m) return false;
  try {
    const entrada = JSON.parse(decodeURIComponent(escape(atob(m[1]))));
    aplicarFormulario(entrada); generar(entrada); return true;
  } catch (e) { return false; }
}

// Aviso de version nueva: se compara el archivo del servidor con el que corre
async function comprobarVersion() {
  try {
    const r = await fetch(location.pathname.replace(/[^/]*$/, "") + "index.html", { cache: "no-store" });
    const m = (await r.text()).match(/VERSION_APP = "(v\d+)"/);
    if (m && m[1] !== VERSION_APP) {
      const a = document.getElementById("aviso-version");
      a.innerHTML = "<b>Versión nueva</b>Hay una versión más reciente (" + m[1] + "). Toca aquí para actualizar.";
      a.classList.add("visible");
      a.addEventListener("click", async () => {
        if (navigator.serviceWorker) { const regs = await navigator.serviceWorker.getRegistrations(); for (const x of regs) await x.unregister(); }
        if (window.caches) { const ks = await caches.keys(); for (const k of ks) await caches.delete(k); }
        location.reload();
      });
    }
  } catch (e) {}
}
if (location.protocol.startsWith("http")) comprobarVersion();

// Arranque de la seccion de viajes
pintarViajes(); pintarHoy(); abrirDesdeEnlace();

/* ---------- PWA: registro del service worker (solo funciona bajo HTTPS) ---------- */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
