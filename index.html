  singluten: ["Las patatas fritas suelen ser aptas si la freidora no comparte con croquetas: pregunta", "Los gofres, no; los mejillones y el estofado, pidiendo sin pan. Bruselas tiene Le Pain Quotidien con opciones marcadas"],
  zonas: [
    { nombre: "Grand-Place y alrededores", paradas: [
      { n: "Grand-Place", lat: 50.8467, lng: 4.3525, tags: ["Imprescindible","Historia"], precio: 0, dur: 45, d: "La plaza dorada de casas gremiales, el Ayuntamiento gótico y la Casa del Rey.", truco: "Ve de noche iluminada y a las 8 de la mañana vacía; en agosto de años pares, la alfombra de flores. Cerveza en Le Roy d'Espagne para la vista, una vez.", salseo: "Luis XIV la bombardeó en 1695 y los gremios la reconstruyeron en cuatro años, cada uno compitiendo por la casa más dorada. Marx escribió el Manifiesto Comunista en La Maison du Cygne, hoy restaurante caro.", atardecer: true },
      { n: "Manneken Pis", lat: 50.8450, lng: 4.3500, tags: ["Imprescindible"], precio: 0, dur: 15, d: "El niño de bronce de 60 centímetros que mea desde 1619, con vestuario de mil trajes.", truco: "Mira el calendario de trajes en el museo GardeRobe; la estatua original está en la Casa del Rey. Jeanneke Pis (la niña) está en un callejón de Rue des Bouchers.", salseo: "Tiene 1.000 trajes, de Elvis a un traje de cosmonauta; el primero se lo regaló Luis XV para disculparse porque sus soldados lo habían robado. Lo han robado siete veces y en 1965 lo rompieron: esta es copia." },
      { n: "Galerías Saint-Hubert", lat: 50.8477, lng: 4.3551, tags: ["Paseo","Mercado","Historia"], precio: 0, dur: 40, d: "Las galerías cubiertas de 1847, las primeras de Europa, con chocolateros, cine y librerías.", truco: "Neuhaus inventó aquí el bombón relleno en 1912 y sigue en la galería; Mokafé para un gofre de Bruselas (el ligero) sentado.", salseo: "Los hermanos Lumière hicieron aquí la primera proyección de cine fuera de Francia en 1896; el cine Galeries sigue abierto. El lema de la entrada dice 'omnibus omnia', todo para todos, y era para ricos." },
      { n: "Mont des Arts", lat: 50.8440, lng: 4.3570, tags: ["Mirador","Paseo"], precio: 0, dur: 30, d: "El jardín en escalera con la vista de la Grand-Place, el Ayuntamiento y, los días claros, el Atomium.", truco: "Sube desde la plaza por Rue de la Madeleine; la foto se hace desde la escalera de arriba con el reloj carillón a la derecha.", salseo: "Leopoldo II derribó un barrio entero para hacer este mirador y murió antes; el solar fue jardín provisional 40 años. El carillón tiene figuras de la historia belga y toca cada hora.", atardecer: true }
    ]},
    { nombre: "Sablon y museos", paradas: [
      { n: "Museos Reales de Bellas Artes", lat: 50.8419, lng: 4.3580, tags: ["Imprescindible","Museo"], precio: 15, dur: 120, d: "Brueghel el Viejo (La caída de Ícaro), los flamencos y el Museo Magritte en el mismo edificio.", truco: "Entrada combinada Old Masters + Magritte; primer miércoles de mes gratis desde las 13:00. La Marat de David está en el sótano.", salseo: "La caída de Ícaro tiene a Ícaro como dos piernas en una esquina y a nadie mirando; Auden le escribió un poema. Magritte pintaba en el comedor de casa con traje y sombrero." },
      { n: "Place du Grand Sablon", lat: 50.8410, lng: 4.3555, tags: ["Mercado","Comida","Paseo"], precio: 0, dur: 45, d: "La plaza de los anticuarios y los chocolateros (Marcolini, Wittamer) con mercadillo los fines de semana.", truco: "Pierre Marcolini para el chocolate serio; Wittamer para un pastel sentado. El mercado de antigüedades, sábado y domingo por la mañana.", salseo: "La iglesia gótica de Notre-Dame du Sablon la pagaron los ballesteros, que aún organizan el Ommegang en julio; la Virgen la trajo una mujer en barca desde Amberes tras robarla por orden divina, dice ella.", comida: true, sg: "Chocolate de Marcolini apto en muchas referencias; pregunta." },
      { n: "Palacio de Justicia y su mirador", lat: 50.8370, lng: 4.3515, tags: ["Mirador","Historia","Fuera de ruta"], precio: 0, dur: 30, d: "El edificio más grande del XIX, con cúpula, y la explanada con la vista del centro y el ascensor a los Marolles.", truco: "El ascensor público (gratis) baja a los Marolles; la explanada al atardecer mira a la basílica de Koekelberg.", salseo: "Lleva en andamios desde 1984 y los andamios están tan oxidados que hay que restaurarlos a ellos; los vecinos expropiados para construirlo inventaron el insulto 'architek'. Hitler lo quería copiar." },
      { n: "Marolles y Place du Jeu de Balle", lat: 50.8380, lng: 4.3465, tags: ["Mercado","Fuera de ruta","Bar"], precio: 0, dur: 60, d: "El barrio popular con el mercadillo de pulgas diario y bares de barrio con dialecto propio.", truco: "El mercado abre todos los días de 6 a 14 (fines de semana hasta las 15); los mejores trastos se venden antes de las 9. Café en La Brocante.", salseo: "Aquí se habla 'brusseleir', mezcla de flamenco y francés; Tintín nació en las Marolles en cierto modo, porque Hergé usaba palabras de aquí para los nombres (Syldavia). El mercado existe desde 1873 sin cerrar ni un día.", comida: true, sg: "Los bares hacen 'américain' (tartar) y patatas: fácil." }
    ]},
    { nombre: "Sainte-Catherine y cómic", paradas: [
      { n: "Place Sainte-Catherine y Mer du Nord", lat: 50.8503, lng: 4.3480, tags: ["Comida","Mercado","Imprescindible"], precio: 10, dur: 50, d: "La plaza del antiguo puerto, con la iglesia, el mercado de pescado y la barra de pescado a la plancha en la calle.", truco: "Mer du Nord: pide calamares o gambas y vino blanco de pie en la esquina, sin mesa; se paga primero. Los sábados hay mercado.", salseo: "Aquí llegaban los barcos hasta 1870 por un canal que se enterró; la Torre Negra de al lado es un trozo de muralla del XIII que se salvó porque un cura se negó a que la tiraran. El barrio era de marineros y hoy de gente guapa.", comida: true, sg: "El pescado a la plancha y las gambas son aptos; el pan aparte." },
      { n: "Centro Belga del Cómic", lat: 50.8510, lng: 4.3603, tags: ["Museo","Imprescindible"], precio: 13, dur: 75, d: "Los almacenes art nouveau de Horta llenos de Tintín, Lucky Luke y los Pitufos, y el recorrido de murales por la ciudad.", truco: "El edificio de Horta merece la entrada solo; pide el mapa de murales y sigue el de Tintín (Rue de l'Etuve) y Broussaille.", salseo: "Bélgica tiene más dibujantes de cómic por metro cuadrado que nadie; el cohete de Tintín de la escalera es el de Objetivo: la Luna, con 15 años de adelanto sobre la NASA. Hergé no dibujó Bruselas nunca: la disfrazó.", ninos: true },
      { n: "Delirium Café", lat: 50.8482, lng: 4.3530, tags: ["Bar","Comida"], precio: 0, dur: 75, d: "El bar con 2.000 cervezas del Guinness de los récords, en un callejón con Jeanneke Pis al final.", truco: "Sube al primer piso o baja al sótano, la planta baja es de despedidas; pide un Kwak en su copa de madera o una Westmalle triple.", salseo: "Están registrados con 2.004 cervezas de 60 países; la Jeanneke Pis del callejón la puso un restaurador en 1987 'por igualdad de sexos'. Se pierde una copa Kwak cada 40 minutos por gente que intenta beberla sin soporte.", comida: true, sg: "Hay sidras y cervezas sin gluten (Brunehaut) en la carta." },
      { n: "Iglesia de Santa Catalina y Bourse", lat: 50.8480, lng: 4.3500, tags: ["Paseo","Historia"], precio: 0, dur: 30, d: "La Bolsa de 1873 reabierta como Belgian Beer World en su cúpula, y las escaleras donde se sienta la ciudad.", truco: "Belgian Beer World cuesta 17 € y acaba con una cerveza en la azotea con vista; solo la escalera de la Bolsa es gratis y buen punto de encuentro.", salseo: "Bajo la Bolsa está el Bruxella 1238, un convento franciscano excavado que se ve por unos cristales; Rodin, de joven, esculpió parte de la fachada y no firmó. Los atentados de 2016 se recordaron en esta escalera." }
    ]},
    { nombre: "Europa, Cinquantenaire y Atomium", paradas: [
      { n: "Parque del Cinquantenaire", lat: 50.8404, lng: 4.3928, tags: ["Parque","Museo","Mirador"], precio: 0, dur: 75, d: "El arco de triunfo de Leopoldo II con museos a los lados y la terraza de arriba gratis.", truco: "La terraza del arco se sube por el Museo Militar, gratis; Autoworld, con 300 coches, para los de motor. La Gran Mezquita está en una esquina del parque.", salseo: "El arco lo pagó Leopoldo II de su bolsillo (o sea, del Congo) porque el Parlamento se negó; el pabellón de Horta del parque se reconstruyó tras 90 años de piezas en cajas.", atardecer: true },
      { n: "Barrio Europeo y Parlamentarium", lat: 50.8385, lng: 4.3755, tags: ["Museo","Historia","Fuera de ruta"], precio: 0, dur: 60, d: "Las instituciones de la UE, con el centro de visitantes del Parlamento gratis y el hemiciclo visitable.", truco: "Parlamentarium y Casa de la Historia Europea son gratis; el hemiciclo se visita con pasaporte los días sin pleno. Place Luxembourg, jueves tarde, es el afterwork de los eurócratas.", salseo: "El edificio del Parlamento se llama Caprice des Dieux por parecerse al queso; el barrio Leopold se demolió casa a casa desde 1960 y la Place Jourdan tiene la friterie de al lado de la Comisión donde comen los comisarios." },
      { n: "Atomium", lat: 50.8949, lng: 4.3415, tags: ["Imprescindible","Mirador"], precio: 16, dur: 90, d: "La molécula de hierro de 102 metros de la Expo 58, con escaleras mecánicas entre las esferas y vista arriba.", truco: "Metro a Heysel; entrada online con hora. Mini-Europe está al lado (combinada). Al atardecer las esferas reflejan el cielo.", salseo: "Iba a durar seis meses y sigue; las esferas se recubrieron de aluminio nuevo en 2006 y las de acero originales se vendieron a trozos. Hay un huevo de hierro por dentro donde duermen niños en visitas escolares.", atardecer: true, ninos: true },
      { n: "Casa Horta y Art Nouveau de Saint-Gilles", lat: 50.8240, lng: 4.3550, tags: ["Museo","Paseo","Fuera de ruta"], precio: 12, dur: 60, d: "La casa-estudio de Victor Horta, patrimonio mundial, y el paseo por las fachadas art nouveau de Saint-Gilles e Ixelles.", truco: "Entrada sin reserva pero cupo pequeño; el Hôtel Tassel (Rue Paul-Émile Janson 6) solo se ve por fuera y es el primer edificio art nouveau del mundo.", salseo: "Horta diseñaba hasta los pomos y los picaportes; en la guerra huyó a EE. UU. y volvió a un Bruselas que demolía sus obras. La Maison du Peuple, su obra maestra, se tiró en 1965 y las piezas se perdieron." }
    ]}
  ]

  zonas: [

      { n: "Torre de San Pedro (Alter Peter)", lat: 48.1366, lng: 11.5750, tags: ["Mirador","Historia"], precio: 5, dur: 40, d: "La iglesia más antigua de la ciudad con 306 escalones hasta la mejor vista de Frauenkirche y los Alpes si hay föhn.", truco: "Con föhn (viento cálido) se ven los Alpes: si está despejado, sube a la primera hora. Dentro, el esqueleto de Santa Munditia con joyas en los ojos.", salseo: "Santa Munditia está en una urna de cristal cubierta de joyas con un vaso de sangre seca en la mano; es patrona de las mujeres solteras. Los muniqueses miden el tiempo por 'el viejo Pedro'." },
      { n: "Viktualienmarkt", lat: 48.1352, lng: 11.5763, tags: ["Mercado","Comida","Imprescindible"], precio: 0, dur: 60, d: "El mercado de 140 puestos con biergarten en medio, bajo el árbol de mayo, desde 1807.", truco: "Weisswurst antes del mediodía (por tradición) con pretzel y cerveza de trigo; la cerveza del biergarten rota cada seis semanas entre las seis fábricas de la ciudad.", salseo: "La weisswurst 'no debe oír las campanas del mediodía' porque antes de la nevera se hacía al alba y se pudría; se come sin piel y con mostaza dulce. Hay una fuente para cada cómico famoso de Múnich.", comida: true, sg: "Weisswurst apta (confirma la marca), queso Obatzda sí, el pretzel no." },
      { n: "Residenz y Cuvilliés-Theater", lat: 48.1411, lng: 11.5785, tags: ["Imprescindible","Museo","Historia"], precio: 10, dur: 120, d: "El palacio de los Wittelsbach en el centro: 130 salas, el Antiquarium renacentista y un teatro rococó dorado.", truco: "Solo Residenz + tesoro; el Antiquarium (sala de 66 metros) es el momento, y el teatro Cuvilliés se compra aparte pero es diez minutos de asombro.", salseo: "Los cuatro leones de bronce de la entrada tienen el hocico dorado de tanto frotarlos: da suerte tocar los cuatro seguidos. Mozart estrenó Idomeneo en el Cuvilliés en 1781; el teatro se desmontó en la guerra y se salvó." }
    ]},
    { nombre: "Englischer Garten y Schwabing", paradas: [
      { n: "Eisbachwelle", lat: 48.1432, lng: 11.5877, tags: ["Imprescindible","Paseo"], precio: 0, dur: 25, d: "La ola permanente del río artificial donde surfean todo el año, con neopreno en enero.", truco: "Desde el puente de Prinzregentenstraße; hay cola de surfistas que se turnan uno a uno. A primera hora, los mejores.", salseo: "La ola la crearon sin querer unas piedras de hormigón; los surfistas la mejoraron con tablones a escondidas y en 2010 la ciudad lo legalizó. Hay muniqueses que nunca han visto el mar y surfean a diario.", ninos: true },
      { n: "Englischer Garten y Chinesischer Turm", lat: 48.1517, lng: 11.5919, tags: ["Parque","Comida","Imprescindible"], precio: 0, dur: 90, d: "El parque más grande que Central Park, con la torre china y su biergarten de 7.000 plazas y una banda de música.", truco: "Alquila bici para hacerlo entero; el biergarten de la torre es turístico pero grande, y el Seehaus, junto al lago, más bonito. Nudismo en el prado del Schönfeldwiese, aviso.", salseo: "Lo diseñó un americano, Benjamin Thompson, ministro de Baviera y espía de los ingleses; el prado nudista es legal desde los 70 y los turistas asiáticos hacen fotos desde la lejanía. El Monopteros es el mirador.", comida: true, sg: "Cerveza no; queso, rábano y pollo asado sí.", atardecer: true },
      { n: "Schwabing y Leopoldstraße", lat: 48.1590, lng: 11.5860, tags: ["Paseo","Bar","Fuera de ruta"], precio: 0, dur: 60, d: "El barrio bohemio de 1900 convertido en avenida de terrazas y calles de cafés detrás.", truco: "Las calles laterales (Türkenstraße, Ainmillerstraße) tienen los cafés y las fachadas art nouveau; Kandinsky vivió en Ainmillerstraße 36.", salseo: "Lenin, Kandinsky, Thomas Mann y Hitler vivieron en Schwabing a la vez sin conocerse; la revista Simplicissimus se burlaba del káiser desde aquí. Fue el barrio más loco de Alemania hasta la Primera Guerra." },
      { n: "Pinakotheken", lat: 48.1483, lng: 11.5700, tags: ["Museo","Imprescindible"], precio: 9, dur: 120, d: "Tres museos en un prado: la Alte (Durero, Rubens), la Neue (Van Gogh, Klimt) y la Moderne (diseño y arte del XX).", truco: "Domingo cuesta 1 € cada una; la Neue está cerrada por obras hasta 2029 y sus mejores cuadros están en la Alte. Empieza por la Pinakothek der Moderne si te gusta el diseño.", salseo: "Luis I abrió la Alte en 1836 como el primer museo pensado para el público; los Girasoles de Van Gogh de la Neue son uno de los cinco que existen. La Alte se reconstruyó con ladrillo visto donde cayeron las bombas." }
    ]},
    { nombre: "Isar, Museo Alemán y Glockenbach", paradas: [
      { n: "Deutsches Museum", lat: 48.1298, lng: 11.5833, tags: ["Museo","Imprescindible"], precio: 15, dur: 150, d: "El museo de ciencia y técnica más grande del mundo, en una isla del Isar, con mina de carbón y U-boot.", truco: "Ideal con lluvia y niños: la mina de carbón en el sótano (45 min) y la demo de alta tensión con rayos de verdad, a horas fijas. Mitad en obras hasta 2028.", salseo: "El submarino U1 de 1906 se metió por la pared; el primer motor diésel de Diesel está aquí, y él desapareció de un barco a Londres en 1913 y nunca apareció. Los alemanes lo consideran el Louvre de la ciencia.", ninos: true },
      { n: "Paseo por el Isar y Flaucher", lat: 48.1160, lng: 11.5540, tags: ["Parque","Paseo","Fuera de ruta"], precio: 0, dur: 75, d: "El río renaturalizado con playas de grava, biergarten entre árboles y gente bañándose en verano.", truco: "Desde el Deutsches Museum hacia el sur por la orilla este; Zum Flaucher es el biergarten del bosque. En verano, barbacoas en la orilla.", salseo: "El Isar era un canal de hormigón hasta 2011; lo devolvieron a cauce natural y ahora es la playa de Múnich, con salvavidas. Los troncos de madera bajaban por él desde los Alpes hasta 1900.", comida: true, sg: "Zum Flaucher: pollo asado y queso, pretzel no." },
      { n: "Glockenbachviertel", lat: 48.1300, lng: 11.5720, tags: ["Bar","Paseo","Comida"], precio: 0, dur: 90, d: "El barrio de bares, gay y creativo, entre Gärtnerplatz y el Isar, con cafés de mañana y cócteles de noche.", truco: "Gärtnerplatz al atardecer con la gente sentada en el césped; Holy Home y Trisoux para copas; Café Frischhut para Schmalznudel (bollo frito) por la mañana.", salseo: "Freddie Mercury vivió en el barrio en los 80 y grababa en Musicland, en el sótano del Arabellahaus; sus noches en el Ochsengarten y Deutsche Eiche son leyenda. La Deutsche Eiche sigue y es hotel con sauna.", comida: true, sg: "Bares de cócteles y vino; pide sin cerveza." },

const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const DIAS_SEMANA = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];

// Escapa texto antes de meterlo en el HTML
function esc(t) {
  return String(t ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
// Minutos desde medianoche a "HH:MM"
function hhmm(min) {
  min = Math.round(min);
  return String(Math.floor(min / 60)).padStart(2, "0") + ":" + String(min % 60).padStart(2, "0");
}
// Distancia en km entre dos puntos (haversine)
function distKm(a, b) {
  const R = 6371, r = Math.PI / 180;
  const dLat = (b.lat - a.lat) * r, dLng = (b.lng - a.lng) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
// Precio formateado con la moneda de la ciudad
function precioTexto(p, moneda) {
  if (!p) return "Gratis";
  return "≈ " + (moneda === "€" || moneda === "£" ? p + " " + moneda : p.toLocaleString("es-ES") + " " + moneda);
}

/* Horario de verano europeo: del ultimo domingo de marzo al ultimo de octubre */
function esVerano(fecha) {
  const y = fecha.getFullYear();
  const ultimoDomingo = m => { const d = new Date(Date.UTC(y, m + 1, 0)); d.setUTCDate(d.getUTCDate() - d.getUTCDay()); return d; };
  const ini = ultimoDomingo(2), fin = ultimoDomingo(9);
  const f = new Date(Date.UTC(y, fecha.getMonth(), fecha.getDate(), 12));
  return f >= ini && f < fin;
}

/* Atardecer local (minutos desde medianoche) para una fecha y una ciudad.
   Formula solar simplificada (NOAA): declinacion, ecuacion del tiempo y
   angulo horario para el sol a -0.833 grados bajo el horizonte. */
function atardecerMin(fecha, ciudad) {
  const lat = ciudad.centro[0], lng = ciudad.centro[1];
  const ini = new Date(fecha.getFullYear(), 0, 0);
  const n = Math.floor((fecha - ini) / 86400000);
  const g = 2 * Math.PI / 365 * (n - 1 + (12 - 12) / 24);
  const eqt = 229.18 * (0.000075 + 0.001868 * Math.cos(g) - 0.032077 * Math.sin(g) - 0.014615 * Math.cos(2 * g) - 0.040849 * Math.sin(2 * g));
  const decl = 0.006918 - 0.399912 * Math.cos(g) + 0.070257 * Math.sin(g) - 0.006758 * Math.cos(2 * g) + 0.000907 * Math.sin(2 * g) - 0.002697 * Math.cos(3 * g) + 0.00148 * Math.sin(3 * g);
  const r = Math.PI / 180;
  const cosHa = (Math.cos(90.833 * r) / (Math.cos(lat * r) * Math.cos(decl))) - Math.tan(lat * r) * Math.tan(decl);
  const ha = Math.acos(Math.max(-1, Math.min(1, cosHa))) / r;
  const utcMin = 720 - 4 * (lng - ha) - eqt;
  const tz = ciudad.tz + (esVerano(fecha) ? 1 : 0);
  return utcMin + tz * 60;
}

/* ======================================================================
   MOTOR: puntuar, elegir zonas, ordenar y poner horas
   ====================================================================== */
function puntuar(parada, ciudad, opciones) {
  const { intereses, grupo, presupuesto, evitar, maxPrecio } = opciones;
  let s = 1;
  parada.tags.forEach(t => { if (intereses.includes(t)) s += 3; });
  if (parada.tags.includes("Imprescindible")) s += 1;
  if (grupo === "familia") { if (parada.ninos) s += 2.5; if (parada.tags.includes("Bar")) s -= 3; }
  if (grupo === "amigos" && parada.tags.includes("Bar")) s += 1.5;
  if (grupo === "solo" && (parada.tags.includes("Fuera de ruta") || parada.tags.includes("Paseo"))) s += 1;
  if (grupo === "pareja" && parada.atardecer) s += 0.5;
  if (presupuesto === "ajustado" && maxPrecio && parada.precio) s -= 2.5 * (parada.precio / maxPrecio);
  if (presupuesto === "alto" && (parada.reservar || parada.comida)) s += 1;
  const texto = (parada.n + " " + parada.tags.join(" ") + " " + parada.d).toLowerCase();
  parada._evitado = evitar.some(e => e && texto.includes(e));
  if (parada._evitado) s -= 6;
  return s;
}

// Expande sinonimos de lo que se quiere evitar
function normalizarEvitar(texto) {
  const lista = texto.toLowerCase().split(/[,;]+/).map(t => t.trim()).filter(Boolean);
  const salida = [];
  lista.forEach(t => {
    salida.push(t);
    if (/museo/.test(t)) salida.push("museo");
    if (/iglesia|catedral|templo/.test(t)) salida.push("iglesia", "catedral", "basílica", "capilla");
    if (/cola|reserva/.test(t)) salida.push("reserva");
    if (/cuesta|escaler|subid/.test(t)) salida.push("escalones", "colina", "torre");
    if (/bar|noche|copa/.test(t)) salida.push("bar", "noche");
    if (/mercad/.test(t)) salida.push("mercado");
  });
  return [...new Set(salida)];
}

// Ordena las paradas de un dia por cercania; el atardecer siempre al final
function ordenarDia(paradas) {
  const esNoche = p => p.tags[0] === "Bar" || /de noche/i.test(p.n);
  const noche = paradas.filter(p => esNoche(p) && !p.atardecer);
  const ocaso = paradas.filter(p => p.atardecer);
  let resto = paradas.filter(p => !p.atardecer && !esNoche(p));
  const orden = [];
  if (resto.length) {
    // Empieza por la de mayor puntuacion y sigue por la mas cercana
    let actual = resto.reduce((a, b) => (b._s > a._s ? b : a));
    resto = resto.filter(p => p !== actual); orden.push(actual);
    while (resto.length) {
      actual = resto.reduce((a, b) => (distKm(actual, b) < distKm(actual, a) ? b : a));
      resto = resto.filter(p => p !== actual); orden.push(actual);
    }
  }
  // Si hay varias de atardecer, se queda la mejor y el resto va antes
  if (ocaso.length > 1) {
    ocaso.sort((a, b) => b._s - a._s);
    orden.push(...ocaso.slice(1).map(p => ({ ...p, atardecer: false })));
  }
  if (ocaso.length) orden.push(ocaso[0]);
  noche.forEach(p => orden.push({ ...p, _noche: true }));
  return orden;
}

// Traslado entre dos paradas segun como se mueve el grupo
function traslado(a, b, transporte) {
  const km = distKm(a, b);
  if (km < 0.12) return "Al lado · 2 min";
  const aPie = Math.round(km * 13 + 2);
  if (transporte === "pie" || km < 1.6) return "A pie · " + aPie + " min";
  if (transporte === "motor") return "En coche o moto · " + Math.round(km * 3 + 8) + " min";
  return "Metro, tranvía o bus · " + Math.round(km * 4 + 10) + " min";
}

// Pone horas a las paradas de un dia: 11:00, comida a las 14:00, atardecer real
function programar(paradas, transporte, ocasoMin) {
  const filas = [];
  let t = 11 * 60, comidaHecha = false;
  paradas.forEach((p, i) => {
    if (i > 0) {
      const tr = traslado(paradas[i - 1], p, transporte);
      t += parseInt(tr.match(/(\d+) min/)[1], 10);
      p._t = tr;
    } else p._t = "Desde el alojamiento";
    // Hueco de comida hacia las 14:00, salvo que la propia parada sea de comer
    if (!comidaHecha && t >= 13 * 60 + 15) {
      if (p.comida) { p._esComida = true; comidaHecha = true; }
      else { filas.push({ hueco: true, h: hhmm(t), texto: "Comida" }); t += 90; comidaHecha = true; }
    }
    // El mirador se programa 45 minutos antes del ocaso real
    if (p.atardecer && ocasoMin) {
      const objetivo = ocasoMin - 45;
      if (t < objetivo - 20) {
        if (!comidaHecha) {
          if (t < 12 * 60 + 30) { filas.push({ hueco: true, h: hhmm(t), texto: "Tiempo libre: café largo o paseo sin rumbo" }); t = 13 * 60; }
          filas.push({ hueco: true, h: hhmm(t), texto: "Comida" }); t += 90; comidaHecha = true;
        }
        // Espera de hasta 2 h; si falta mas, se va sin esperar (sera atardecer otro dia)
        if (t < objetivo - 20 && objetivo - t <= 120) { filas.push({ hueco: true, h: hhmm(t), texto: "Tiempo libre hasta el atardecer: café, tiendas o siesta" }); t = objetivo; }
      }
    }
    // Los planes de noche no empiezan antes de las 19:30
    if (p._noche && t < 19 * 60 + 30) {
      if (!comidaHecha) { filas.push({ hueco: true, h: hhmm(t), texto: "Comida" }); t += 90; comidaHecha = true; }
      if (t < 19 * 60 + 30) { filas.push({ hueco: true, h: hhmm(t), texto: "Descanso y ducha en el alojamiento" }); t = 19 * 60 + 30; }
    }
    p._h = hhmm(t);
    filas.push({ parada: p });
    t += p._esComida ? Math.max(p.dur, 80) : p.dur;
  });
  if (!comidaHecha) filas.push({ hueco: true, h: hhmm(Math.max(t, 14 * 60)), texto: "Comida" });
  return filas;
}

// Lee el formulario como un objeto (es lo que se guarda y se comparte)
function leerFormulario() {
  const v = id => document.getElementById(id).value;
  return {
    ciudad: v("destino"), fecha: v("fecha"), dias: v("dias"), ritmo: v("ritmo"),
    presupuesto: v("presupuesto"), grupo: v("grupo"), transporte: v("transporte"), evitar: v("evitar"),
    intereses: [...document.querySelectorAll('input[name="interes"]:checked')].map(c => c.value),
    excluidas: []
  };
}
// Vuelca un objeto de filtros en el formulario
function aplicarFormulario(e) {
  const set = (id, val) => { if (val !== undefined) document.getElementById(id).value = val; };
  set("destino", e.ciudad); set("fecha", e.fecha); set("dias", e.dias); set("ritmo", e.ritmo);
  set("presupuesto", e.presupuesto); set("grupo", e.grupo); set("transporte", e.transporte); set("evitar", e.evitar || "");
  document.querySelectorAll('input[name="interes"]').forEach(c => { c.checked = (e.intereses || []).includes(c.value); });
}

function cuadrar(entrada) {
  const e = entrada || leerFormulario();
  const ciudad = CIUDADES[e.ciudad];
  if (!ciudad) { mostrarError("No encuentro esa ciudad en el repositorio."); return null; }
  if (!e.fecha) { mostrarError("Falta la fecha de llegada."); return null; }
  const numDias = Math.min(8, Math.max(1, parseInt(e.dias, 10) || 3));
  const porDia = parseInt(e.ritmo, 10) || 4;
  const opciones = {
    intereses: e.intereses || [], grupo: e.grupo, presupuesto: e.presupuesto, transporte: e.transporte,
    evitar: normalizarEvitar(e.evitar || ""), maxPrecio: 0, excluidas: e.excluidas || []
  };
  const fecha = new Date(e.fecha + "T12:00:00");

  // Puntuacion de cada parada
  const todas = [];
  ciudad.zonas.forEach(z => z.paradas.forEach(p => { todas.push(p); opciones.maxPrecio = Math.max(opciones.maxPrecio, p.precio); }));
  todas.forEach(p => { p._s = puntuar(p, ciudad, opciones); p._zona = ciudad.zonas.find(z => z.paradas.includes(p)).nombre; });

  const elegible = p => !p._evitado && p._s > -1.5 && !opciones.excluidas.includes(p.n);
  // Una zona por dia: se eligen las que suman mas con sus mejores paradas
  const zonasPuntuadas = ciudad.zonas.map(z => {
    const mejores = [...z.paradas].filter(elegible).sort((a, b) => b._s - a._s).slice(0, porDia);
    return { zona: z, paradas: mejores, total: mejores.reduce((s, p) => s + p._s, 0) };
  }).sort((a, b) => b.total - a.total);

  const dias = [];
  const usadas = new Set();
  zonasPuntuadas.filter(zp => zp.paradas.length >= 2).slice(0, numDias).forEach(zp => {
    zp.paradas.forEach(p => usadas.add(p));
    dias.push({ zona: zp.zona.nombre, paradas: zp.paradas.map(p => ({ ...p })) });
  });

  // Si hay mas dias que zonas: dias extra con lo mejor que quedo, agrupado por cercania
  while (dias.length < numDias) {
    let restantes = todas.filter(p => !usadas.has(p) && elegible(p)).sort((a, b) => b._s - a._s);
    if (!restantes.length) { dias.push({ zona: "Día libre", paradas: [], libre: true }); continue; }
    const grupo = [restantes[0]]; usadas.add(restantes[0]);
    restantes = restantes.slice(1);
    while (grupo.length < porDia && restantes.length) {
      const ultimo = grupo[grupo.length - 1];
      restantes.sort((a, b) => distKm(ultimo, a) - distKm(ultimo, b));
      const cerca = restantes.find(p => distKm(ultimo, p) < 3) || restantes[0];
      grupo.push(cerca); usadas.add(cerca); restantes = restantes.filter(p => p !== cerca);
    }
    dias.push({ zona: "Lo que faltaba: " + [...new Set(grupo.map(p => p._zona))].join(" y "), paradas: grupo.map(p => ({ ...p })) });
  }

  // Si un dia se queda corto, se completa con lo mas cercano que quede sin usar
  dias.forEach(d => {
    if (d.libre) return;
    while (d.paradas.length < porDia) {
      const centro = { lat: d.paradas.reduce((s, p) => s + p.lat, 0) / d.paradas.length, lng: d.paradas.reduce((s, p) => s + p.lng, 0) / d.paradas.length };
      const cand = todas.filter(p => !usadas.has(p) && elegible(p) && distKm(centro, p) < 1.8).sort((a, b) => (b._s - distKm(centro, b)) - (a._s - distKm(centro, a)))[0];
      if (!cand) break;
      usadas.add(cand); d.paradas.push({ ...cand });
    }
  });

  // Orden, horas y etiquetas de fecha
  dias.forEach((d, i) => {
    const f = new Date(fecha); f.setDate(f.getDate() + i);
    d.fecha = f;
    d.etiqueta = DIAS_SEMANA[f.getDay()] + " " + f.getDate() + " de " + MESES[f.getMonth()];
    d.ocaso = atardecerMin(f, ciudad);
    d.paradas = ordenarDia(d.paradas);
    d.filas = programar(d.paradas, opciones.transporte, d.ocaso);
    d.coste = d.paradas.reduce((s, p) => s + (p.precio || 0), 0);
  });

  return { ciudad, dias, fecha, opciones, porDia, entrada: e };
}

// Hora a la que acaba la ultima parada del dia
function finDia(dia) {
  const ultima = dia.filas.filter(f => f.parada).pop();
  if (!ultima) return "—";
  const [h, m] = ultima.parada._h.split(":").map(Number);
  return hhmm(h * 60 + m + (ultima.parada._esComida ? Math.max(ultima.parada.dur, 80) : ultima.parada.dur));
}

/* ---------- Mapas Leaflet ---------- */
function pintarMapas(plan) {
  const { ciudad, dias } = plan;
  const acento = ciudad.acento;
  const tiles = () => L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", { attribution: "&copy; OpenStreetMap &copy; CARTO", maxZoom: 19 });
  const icono = n => L.divIcon({ className: "", html: '<div class="pin"><span>' + n + '</span></div>', iconSize: [26, 26], iconAnchor: [13, 26], popupAnchor: [0, -24] });
  const popup = (p, i) => '<b>' + esc(p.n) + '</b>Día ' + (i + 1) + ' · ' + p._h + ' · ' + esc(precioTexto(p.precio, ciudad.moneda));

  const mapaTodo = L.map("mapa-todo", { scrollWheelZoom: false }).setView(ciudad.centro, ciudad.zoom);
  tiles().addTo(mapaTodo);
  const capas = [], todos = [];
  dias.forEach((dia, i) => {
    const capa = L.layerGroup();
    const puntos = dia.paradas.map(p => [p.lat, p.lng]);
    puntos.forEach(pt => todos.push(pt));
    if (puntos.length > 1) L.polyline(puntos, { color: acento, weight: 2.5, opacity: 0.55, dashArray: "6 6" }).addTo(capa);
    dia.paradas.forEach(p => L.marker([p.lat, p.lng], { icon: icono(i + 1) }).bindPopup(popup(p, i)).addTo(capa));
    capa.addTo(mapaTodo); capas.push(capa);
  });
  if (todos.length) mapaTodo.fitBounds(todos, { padding: [30, 30] });
  mapas.push(mapaTodo);

  document.querySelectorAll(".leyenda button").forEach(b => {
    b.addEventListener("click", () => {
      const i = parseInt(b.dataset.dia, 10);
      if (mapaTodo.hasLayer(capas[i])) { mapaTodo.removeLayer(capas[i]); b.classList.add("apagado"); }
      else { capas[i].addTo(mapaTodo); b.classList.remove("apagado"); }
    });
  });

  dias.forEach((dia, i) => {
    const cont = document.getElementById("mapa-dia-" + i);
    if (!cont || !dia.paradas.length) return;
    const m = L.map(cont, { scrollWheelZoom: false, zoomControl: false });
    tiles().addTo(m);
    const coords = dia.paradas.map(p => [p.lat, p.lng]);
    if (coords.length > 1) L.polyline(coords, { color: acento, weight: 3, opacity: 0.7 }).addTo(m);
    dia.paradas.forEach((p, j) => L.marker([p.lat, p.lng], { icon: icono(j + 1) }).bindPopup(popup(p, i)).addTo(m));
    m.fitBounds(coords, { padding: [26, 26], maxZoom: 16 });
    mapas.push(m);
  });
}

/* ---------- Exportar a calendario .ics ---------- */
function exportarIcs() {
  if (!ultimoPlan) return;
  const escIcs = t => String(t).replace(/\\/g, "\\\\").replace(/,/g, "\\,").replace(/;/g, "\\;");
  const fIcs = f => f.toISOString().slice(0, 10).replace(/-/g, "");
  const lineas = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//La Brujula//ES"];
  ultimoPlan.dias.forEach((dia, i) => {
    const fin = new Date(dia.fecha); fin.setDate(fin.getDate() + 1);
    lineas.push("BEGIN:VEVENT",
      "UID:brujula-" + i + "-" + Date.now() + "@la-brujula",
      "DTSTART;VALUE=DATE:" + fIcs(dia.fecha),
      "DTEND;VALUE=DATE:" + fIcs(fin),
      "SUMMARY:" + escIcs(ultimoPlan.ciudad.nombre + " día " + (i + 1) + " — " + dia.zona),
      "DESCRIPTION:" + escIcs(dia.paradas.map(p => p._h + " " + p.n).join(" · ")),
      "LOCATION:" + escIcs(ultimoPlan.ciudad.nombre),
      "END:VEVENT");
  });
  lineas.push("END:VCALENDAR");
  const blob = new Blob([lineas.join("\r\n")], { type: "text/calendar;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "viaje-la-brujula.ics"; a.click();
  URL.revokeObjectURL(a.href);
}

/* ---------- Copiar como texto plano ---------- */
function copiarTexto() {
  if (!ultimoPlan) return;
  const { ciudad, dias } = ultimoPlan;
  let t = ciudad.nombre.toUpperCase() + "\n" + ciudad.claim + "\n\n";
  dias.forEach((dia, i) => {
    t += "DÍA " + (i + 1) + " · " + dia.etiqueta + " · " + dia.zona + "\n";
    dia.filas.forEach(f => {
      if (f.hueco) { t += "  " + f.h + "  " + f.texto + "\n"; return; }
      t += "  " + f.parada._h + "  " + f.parada.n + " (" + precioTexto(f.parada.precio, ciudad.moneda) + ")\n    Truco: " + f.parada.truco + "\n";
    });
    t += "\n";
  });
  t += "DÓNDE COMER\n" + ciudad.comer.map(c => "  - " + c).join("\n") + "\n\nSIN GLUTEN\n" + ciudad.singluten.map(c => "  - " + c).join("\n") + "\n";
  navigator.clipboard.writeText(t).then(() => {
    const b = document.getElementById("btn-md"); b.textContent = "Copiado"; setTimeout(() => b.textContent = "Copiar como texto", 1800);
  });
}

/* ======================================================================
   MIS VIAJES GUARDADOS
   Se guardan en localStorage los filtros del viaje (no el itinerario), y
   se regenera al abrirlo: el motor es determinista, sale lo mismo. Tambien
   se guardan las paradas marcadas como hechas y las cambiadas.
   ====================================================================== */
const CLAVE = "brujula:viajes";
function leerViajes() { try { return JSON.parse(localStorage.getItem(CLAVE) || "[]"); } catch (e) { return []; } }
function escribirViajes(v) { localStorage.setItem(CLAVE, JSON.stringify(v)); }
function viajeDe(id) { return leerViajes().find(v => v.id === id); }

function guardarViaje() {
  if (!ultimoPlan) return;
  const nombre = document.getElementById("nombre-viaje").value.trim() || ultimoPlan.ciudad.nombre;
  const viajes = leerViajes();
  const id = "v" + Date.now();
  viajes.unshift({ id, nombre, creado: new Date().toISOString(), entrada: ultimoPlan.entrada, hechas: [] });
  escribirViajes(viajes);
  viajeActual = id;
  document.getElementById("guardar-caja").classList.remove("visible");
  document.getElementById("btn-guardar").textContent = "Guardado";
  pintarViajes(); pintarHoy(); pintarProgreso();
}

function abrirViaje(id) {
  const v = viajeDe(id); if (!v) return;
  viajeActual = id;
  aplicarFormulario(v.entrada);
  generar(v.entrada);
}

function borrarViaje(id) {
  const v = viajeDe(id); if (!v) return;
  if (!confirm("¿Borrar el viaje \"" + v.nombre + "\"?")) return;
  escribirViajes(leerViajes().filter(x => x.id !== id));
  if (viajeActual === id) { viajeActual = null; const b = document.getElementById("btn-guardar"); if (b) b.textContent = "Guardar este viaje"; }
  pintarViajes(); pintarHoy(); pintarProgreso();
}

// Numero de paradas del viaje (regenerandolo sin pintar)
function paradasDe(v) {
  const plan = cuadrar(v.entrada);
  return plan ? plan.dias.reduce((s, d) => s + d.paradas.length, 0) : 0;
}

function pintarViajes() {
  const viajes = leerViajes();
  const caja = document.getElementById("viajes");
  caja.classList.toggle("visible", viajes.length > 0);
  const lista = document.getElementById("lista-viajes");
  lista.innerHTML = viajes.map(v => {
    const c = CIUDADES[v.entrada.ciudad];
    const f = new Date(v.entrada.fecha + "T12:00:00");
    const total = paradasDe(v), hechas = (v.hechas || []).length;
    const pct = total ? Math.round(100 * hechas / total) : 0;
    return '<div class="viaje"><div class="info"><div class="titulo-viaje">' + esc(v.nombre) + '</div>' +
      '<div class="sub-viaje">' + esc(c ? c.nombre : "?") + ' · ' + f.getDate() + ' de ' + MESES[f.getMonth()] + ' de ' + f.getFullYear() + ' · ' + v.entrada.dias + (v.entrada.dias == 1 ? ' día' : ' días') + ' · ' + hechas + '/' + total + ' paradas hechas</div>' +
      '<div class="barra-viaje"><div style="width:' + pct + '%"></div></div></div>' +
      '<button type="button" class="btn-mini" data-abrir="' + v.id + '">Abrir</button>' +
      '<button type="button" class="btn-mini peligro" data-borrar="' + v.id + '">Borrar</button></div>';
  }).join("");
  lista.querySelectorAll("[data-abrir]").forEach(b => b.addEventListener("click", () => abrirViaje(b.dataset.abrir)));
  lista.querySelectorAll("[data-borrar]").forEach(b => b.addEventListener("click", () => borrarViaje(b.dataset.borrar)));
}

/* Paradas hechas: checkbox por parada, persistente si el viaje esta guardado */
function marcarHecha(c) {
  c.closest(".parada").classList.toggle("hecha", c.checked);
  if (!viajeActual) return;
  const viajes = leerViajes(); const v = viajes.find(x => x.id === viajeActual); if (!v) return;
  v.hechas = v.hechas || [];
  if (c.checked && !v.hechas.includes(c.dataset.nombre)) v.hechas.push(c.dataset.nombre);
  if (!c.checked) v.hechas = v.hechas.filter(n => n !== c.dataset.nombre);
  escribirViajes(viajes);
  pintarViajes(); pintarProgreso();
}
function pintarHechas() {
  const v = viajeActual ? viajeDe(viajeActual) : null;
  const hechas = v ? (v.hechas || []) : [];
  document.querySelectorAll(".hecho").forEach(c => { c.checked = hechas.includes(c.dataset.nombre); c.closest(".parada").classList.toggle("hecha", c.checked); });
  pintarProgreso();
}
function pintarProgreso() {
  const caja = document.getElementById("progreso-viaje"); if (!caja) return;
  if (!viajeActual || !ultimoPlan) { caja.textContent = ultimoPlan ? "Guarda el viaje para que las paradas marcadas se recuerden." : ""; return; }
  const total = ultimoPlan.dias.reduce((s, d) => s + d.paradas.length, 0);
  const hechas = document.querySelectorAll(".hecho:checked").length;
  caja.textContent = hechas + " de " + total + " paradas hechas" + (hechas === total && total ? ". Viaje completado, a por el siguiente." : ".");
}

/* Cambiar una parada por otra: se excluye y se vuelve a cuadrar */
function cambiarParada(nombre) {
  if (!ultimoPlan) return;
  const entrada = { ...ultimoPlan.entrada, excluidas: [...(ultimoPlan.entrada.excluidas || []), nombre] };
  if (viajeActual) {
    const viajes = leerViajes(); const v = viajes.find(x => x.id === viajeActual);
    if (v) { v.entrada = entrada; escribirViajes(viajes); }
  }
  generar(entrada);
}

/* Banner de "hoy": si un viaje guardado incluye la fecha de hoy o esta cerca */
function pintarHoy() {
  const caja = document.getElementById("hoy");
  const hoy = new Date(); hoy.setHours(12, 0, 0, 0);
  let mejor = null;
  leerViajes().forEach(v => {
    const ini = new Date(v.entrada.fecha + "T12:00:00");
    const fin = new Date(ini); fin.setDate(fin.getDate() + parseInt(v.entrada.dias, 10) - 1);
    const faltan = Math.round((ini - hoy) / 86400000);
    if (hoy >= ini && hoy <= fin) mejor = { v, texto: "Hoy toca el día " + (Math.round((hoy - ini) / 86400000) + 1) + " de " + v.entrada.dias + " en " + CIUDADES[v.entrada.ciudad].nombre + ". Abre el viaje y a pasearlo." };
    else if (faltan > 0 && faltan <= 21 && !mejor) mejor = { v, texto: "Faltan " + faltan + (faltan === 1 ? " día" : " días") + " para " + CIUDADES[v.entrada.ciudad].nombre + ". Buen momento para repasar lo que hay que reservar." };
  });
  caja.classList.toggle("visible", !!mejor);
  if (mejor) { caja.innerHTML = '<b>' + esc(mejor.v.nombre) + '</b>' + esc(mejor.texto) + ' <button type="button" class="btn-mini" style="color:#fff;border-color:rgba(255,255,255,0.5);margin-left:10px" data-abrir="' + mejor.v.id + '">Abrir</button>'; caja.querySelector("[data-abrir]").addEventListener("click", () => abrirViaje(mejor.v.id)); }
}

/* Compartir: los filtros van en el enlace, quien lo abra ve el mismo plan */
function compartirEnlace() {
  if (!ultimoPlan) return;
  const datos = btoa(unescape(encodeURIComponent(JSON.stringify(ultimoPlan.entrada))));
  const url = location.origin + location.pathname + "#v=" + datos;
  navigator.clipboard.writeText(url).then(() => {
    const b = document.getElementById("btn-compartir"); b.textContent = "Enlace copiado"; setTimeout(() => b.textContent = "Copiar enlace para compartir", 1800);
  });
}
function abrirDesdeEnlace() {
  const m = location.hash.match(/#v=(.+)/); if (!m) return false;
  try {
    const entrada = JSON.parse(decodeURIComponent(escape(atob(m[1]))));
    aplicarFormulario(entrada); generar(entrada); return true;
  } catch (e) { return false; }
}

// Arranque de la seccion de viajes
pintarViajes(); pintarHoy(); abrirDesdeEnlace();

/* ---------- PWA: registro del service worker (solo funciona bajo HTTPS) ---------- */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
