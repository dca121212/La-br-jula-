<!DOCTYPE html>
<html lang="es">
<head>
<!--
  LA BRUJULA - Planificador de viajes con repositorio propio
  Que hace: a partir de unos filtros (ciudad, fecha, dias, ritmo, presupuesto,
  con quien vas, transporte, intereses y cosas a evitar) arma un itinerario
  completo con un repositorio de 24 ciudades europeas escrito a mano: cada
  parada lleva coordenadas, precio, duracion, un truco practico y un salseo
  (anecdota, leyenda o cotilleo historico). Lo pinta con mapas Leaflet, uno
  global y otro por dia, y lo exporta a calendario, texto o PDF.
  Como esta hecho: sin ninguna IA ni servidor. El repositorio va incrustado en
  este mismo archivo (bloque CIUDADES) y el motor puntua cada parada segun los
  filtros, elige una zona por dia para no cruzar la ciudad, ordena las paradas
  por cercania, pone horas desde las 11:00 con la duracion de cada sitio y el
  traslado, deja hueco de comida a las 14:00 y programa los miradores a la hora
  real del atardecer, que se calcula con la fecha y la latitud.
  Funciona abriendo el archivo en cualquier navegador, sin conexion salvo para
  los mapas y las fuentes.
-->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Brújula</title>
<meta name="theme-color" content="#1F4E5A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="La Brújula">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icono-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  /* --------------------------------------------------------------------
     Tokens. El acento lo decide el destino: el motor devuelve un hex y la
     app lo aplica en --acento; todo lo demas se deriva con color-mix.
     -------------------------------------------------------------------- */
  :root {
    --fondo: #F7F6F2; --papel: #FFFFFF; --tinta: #17181A; --tinta-2: #5E6166;
    --linea: #E4E2DB; --acento: #1F4E5A;
    --acento-suave: color-mix(in srgb, var(--acento) 9%, var(--papel));
    --acento-linea: color-mix(in srgb, var(--acento) 35%, transparent);
    --sombra: 0 14px 40px rgba(23,24,26,0.07);
    --sombra-2: 0 4px 14px rgba(23,24,26,0.05);
    --radio: 18px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fondo: #111214; --papel: #1A1B1E; --tinta: #EDEBE6; --tinta-2: #A2A39F;
      --linea: #2C2D31; --sombra: 0 14px 40px rgba(0,0,0,0.5); --sombra-2: 0 4px 14px rgba(0,0,0,0.4);
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { background: var(--fondo); color: var(--tinta); font-family: "Manrope", -apple-system, sans-serif; font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
  .contenedor { max-width: 900px; margin: 0 auto; padding: 0 22px 100px; }
  .serif { font-family: "Instrument Serif", Georgia, serif; }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
  .eyebrow { font-size: 11px; letter-spacing: 0.24em; text-transform: uppercase; font-weight: 700; color: var(--acento); }

  /* Cabecera: una aguja de brujula que gira lentamente y el titular */
  header { padding: 64px 0 40px; display: grid; grid-template-columns: auto 1fr; gap: 26px; align-items: center; }
  .aguja { width: 64px; height: 64px; border-radius: 50%; border: 1.5px solid var(--acento-linea); position: relative; display: grid; place-items: center; }
  .aguja::before { content: ""; width: 4px; height: 4px; border-radius: 50%; background: var(--acento); position: absolute; z-index: 2; }
  .aguja span { position: absolute; width: 2px; height: 48px; background: linear-gradient(to bottom, var(--acento) 50%, var(--tinta-2) 50%); border-radius: 2px; animation: orientar 14s ease-in-out infinite; }
  @keyframes orientar { 0%,100% { transform: rotate(-18deg); } 50% { transform: rotate(22deg); } }
  @media (prefers-reduced-motion: reduce) { .aguja span { animation: none; } }
  header h1 { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; font-size: clamp(42px, 7vw, 68px); line-height: 0.95; letter-spacing: -0.01em; }
  header h1 em { color: var(--acento); font-style: italic; }
  header p { margin-top: 12px; color: var(--tinta-2); font-size: 15px; max-width: 560px; }
  @media (max-width: 560px) { header { grid-template-columns: 1fr; padding-top: 44px; } }

  /* Formulario de filtros */
  .filtros { background: var(--papel); border: 1px solid var(--linea); border-radius: var(--radio); padding: 28px 30px; box-shadow: var(--sombra-2); display: grid; grid-template-columns: 1fr 1fr; gap: 20px 24px; }
  .campo { display: flex; flex-direction: column; gap: 7px; }
  .campo.ancho { grid-column: 1 / -1; }
  .campo label, .campo .titulo { font-size: 11px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--tinta-2); }
  .campo input, .campo select, .campo textarea { font: 500 15px/1.4 Manrope, sans-serif; color: var(--tinta); background: var(--fondo); border: 1px solid var(--linea); border-radius: 12px; padding: 12px 14px; }
  .campo textarea { resize: vertical; min-height: 60px; }
  .campo :focus-visible { outline: 2px solid var(--acento); outline-offset: 1px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips label { font: 600 13px/1 Manrope, sans-serif; text-transform: none; letter-spacing: 0.01em; border: 1.5px solid var(--linea); border-radius: 99px; padding: 9px 15px; cursor: pointer; color: var(--tinta-2); user-select: none; transition: border-color .15s, color .15s, background .15s; }
  .chips input { position: absolute; opacity: 0; width: 0; height: 0; }
  .chips label:has(input:checked) { border-color: var(--acento); background: var(--acento-suave); color: var(--acento); }
  .chips label:has(input:focus-visible) { outline: 2px solid var(--acento); }
  .btn-principal { grid-column: 1 / -1; justify-self: center; cursor: pointer; font: 700 13px/1 Manrope, sans-serif; letter-spacing: 0.14em; text-transform: uppercase; color: #fff; background: var(--acento); border: none; border-radius: 99px; padding: 16px 34px; transition: transform .15s, opacity .15s; }
  .btn-principal:hover { transform: translateY(-1px); }
  .btn-principal[disabled] { opacity: 0.5; cursor: wait; transform: none; }
  .btn-secundario { cursor: pointer; font: 700 11px/1 Manrope, sans-serif; letter-spacing: 0.14em; text-transform: uppercase; color: var(--acento); background: none; border: 1.5px solid var(--acento); border-radius: 99px; padding: 11px 18px; }
  .btn-secundario:hover { background: var(--acento-suave); }
  @media (max-width: 560px) { .filtros { grid-template-columns: 1fr; padding: 22px; } }

  /* Estado de carga con barra de progreso real por fases */
  .cargando { margin-top: 40px; text-align: center; display: none; }
  .cargando.visible { display: block; }
  .barra { height: 3px; background: var(--linea); border-radius: 3px; max-width: 320px; margin: 0 auto 16px; overflow: hidden; }
  .barra div { height: 100%; width: 5%; background: var(--acento); transition: width .5s ease; }
  .cargando .mensaje { font-family: "Instrument Serif", Georgia, serif; font-style: italic; font-size: 19px; color: var(--tinta-2); }
  .cargando .fase { margin-top: 6px; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--tinta-2); font-weight: 700; }
  .error { margin-top: 24px; padding: 16px 20px; border: 1.5px solid var(--acento); border-radius: 12px; font-size: 14px; display: none; background: var(--papel); }
  .error.visible { display: block; }

  /* --------------------------------------------------------------------
     Resultado. La firma de la app: la portada es un sello postal. El marco
     perforado se dibuja con un patron radial y el contenido va dentro.
     -------------------------------------------------------------------- */
  #resultado { margin-top: 48px; }
  .sello { padding: 12px; background: radial-gradient(circle, transparent 5px, var(--acento) 5.5px) -7px -7px / 14px 14px; border-radius: 4px; box-shadow: var(--sombra); }
  .sello-interior { background: var(--papel); padding: 36px 40px 30px; position: relative; overflow: hidden; }
  .sello-interior::after { content: ""; position: absolute; inset: 0; background: linear-gradient(140deg, var(--acento-suave) 0%, transparent 55%); pointer-events: none; }
  .sello-interior > * { position: relative; z-index: 1; }
  .sello h2 { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; font-size: clamp(38px, 7vw, 66px); line-height: 0.98; letter-spacing: -0.01em; color: var(--acento); margin-top: 8px; }
  .sello .claim { margin-top: 10px; font-family: "Instrument Serif", Georgia, serif; font-style: italic; font-size: 20px; color: var(--tinta-2); }
  .sello .meta { margin-top: 22px; display: flex; flex-wrap: wrap; gap: 8px 26px; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--tinta-2); }
  .sello .meta b { color: var(--tinta); }
  /* Matasellos: circulo girado con la fecha, en la esquina del sello */
  .matasellos { position: absolute; right: 26px; top: 22px; width: 104px; height: 104px; border-radius: 50%; border: 2px solid var(--acento-linea); display: grid; place-items: center; text-align: center; transform: rotate(-12deg); font-family: "JetBrains Mono", monospace; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--acento); line-height: 1.35; opacity: 0.85; }
  .matasellos::before { content: ""; position: absolute; inset: 6px; border-radius: 50%; border: 1px solid var(--acento-linea); }
  .matasellos b { font-size: 17px; display: block; }
  @media (max-width: 640px) { .matasellos { display: none; } .sello-interior { padding: 28px 24px 24px; } }

  .ficha { margin-top: 18px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .ficha > div { background: var(--papel); border: 1px solid var(--linea); border-radius: 14px; padding: 15px 18px; font-size: 13.5px; box-shadow: var(--sombra-2); }
  .ficha h5 { font-size: 10.5px; letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 5px; color: var(--acento); }
  @media (max-width: 640px) { .ficha { grid-template-columns: 1fr; } }

  /* Mapas: el global y los pequenos por dia */
  .mapa-global { margin-top: 26px; background: var(--papel); border: 1px solid var(--linea); border-radius: var(--radio); overflow: hidden; box-shadow: var(--sombra-2); }
  .mapa-global .cabecera { padding: 16px 20px 12px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
  .leyenda { display: flex; flex-wrap: wrap; gap: 6px; }
  .leyenda button { cursor: pointer; font: 700 11px/1 Manrope, sans-serif; letter-spacing: 0.1em; text-transform: uppercase; border: 1.5px solid var(--acento); background: var(--acento); color: #fff; border-radius: 99px; padding: 7px 12px; }
  .leyenda button.apagado { background: none; color: var(--acento); opacity: 0.6; }
  #mapa-todo { height: 420px; }
  .mapa-dia { height: 220px; border-radius: 12px; overflow: hidden; margin-top: 16px; border: 1px solid var(--linea); }
  .leaflet-container { font-family: "Manrope", sans-serif; background: var(--fondo); }
  .pin { width: 26px; height: 26px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: var(--acento); border: 2px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.3); display: grid; place-items: center; }
  .pin span { transform: rotate(45deg); color: #fff; font: 700 11px/1 "JetBrains Mono", monospace; }
  .leaflet-popup-content-wrapper { border-radius: 12px; font-size: 13px; }
  .leaflet-popup-content b { display: block; font-size: 14px; }
  @media (prefers-color-scheme: dark) { .leaflet-tile { filter: brightness(0.75) contrast(1.05) saturate(0.85); } .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--papel); color: var(--tinta); } }

  /* Dias y paradas */
  .dia { background: var(--papel); border: 1px solid var(--linea); border-radius: var(--radio); padding: 26px 28px; margin-top: 20px; box-shadow: var(--sombra-2); }
  .dia .cabecera-dia { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .dia .num { font-family: "Instrument Serif", Georgia, serif; font-size: 40px; line-height: 1; color: var(--acento); }
  .dia h3 { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; font-size: 26px; line-height: 1.1; }
  .dia .franja { width: 100%; font-size: 11.5px; color: var(--tinta-2); font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; margin-top: 2px; }
  .parada { display: grid; grid-template-columns: 62px 1fr; gap: 6px 14px; padding: 16px 0; border-top: 1px solid var(--linea); }
  .parada:first-of-type { border-top: none; margin-top: 8px; }
  .hora { font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 14px; color: var(--acento); padding-top: 3px; }
  .cabecera-parada { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .nombre { font-weight: 700; font-size: 16px; }
  .tag { font-size: 9.5px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--acento); border: 1px solid var(--acento-linea); border-radius: 99px; padding: 2px 8px; white-space: nowrap; }
  .tag.reserva { background: var(--acento); color: #fff; border-color: var(--acento); }
  .tag.precio { color: var(--tinta-2); border-color: var(--linea); }
  .traslado { grid-column: 2; font-size: 10.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--tinta-2); }
  .desc { grid-column: 2; font-size: 14.5px; color: var(--tinta); }
  .extras { grid-column: 2; display: grid; gap: 8px; margin-top: 4px; }
  .truco, .salseo { font-size: 13.5px; padding: 10px 14px; border-radius: 10px; line-height: 1.55; }
  .truco { background: var(--fondo); color: var(--tinta); }
  .truco b, .salseo b { font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; display: block; margin-bottom: 2px; }
  .truco b { color: var(--tinta-2); }
  .salseo { background: var(--acento-suave); color: var(--tinta); font-family: "Instrument Serif", Georgia, serif; font-style: italic; font-size: 15.5px; border-left: 3px solid var(--acento); }
  .salseo b { font-family: "Manrope", sans-serif; font-style: normal; color: var(--acento); }
  .sg { grid-column: 2; font-size: 12.5px; color: var(--tinta-2); }
  .sg::before { content: "Sin gluten: "; font-weight: 700; color: var(--acento); }
  @media (max-width: 560px) { .parada { grid-template-columns: 1fr; } .traslado, .desc, .extras, .sg { grid-column: 1; } }
  .enlace-mapa { display: inline-block; margin-top: 14px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--acento); text-decoration: none; border-bottom: 1px solid var(--acento-linea); padding-bottom: 3px; }

  /* Bloques finales: comer, sin gluten, acciones */
  .apartado { margin-top: 26px; padding: 18px 8px 6px; border-top: 1px solid var(--acento-linea); }
  .apartado h4 { font-size: 11px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: var(--acento); margin-bottom: 10px; }
  .apartado ul { list-style: none; }
  .apartado li { font-size: 14.5px; padding: 5px 0 5px 18px; position: relative; }
  .apartado li::before { content: ""; position: absolute; left: 0; top: 14px; width: 8px; height: 1.5px; background: var(--acento); }
  .acciones { margin-top: 28px; display: flex; flex-wrap: wrap; gap: 12px; }
  .aviso { margin-top: 18px; font-size: 12.5px; color: var(--tinta-2); }
  .colofon { margin-top: 70px; text-align: center; font-family: "Instrument Serif", Georgia, serif; font-style: italic; font-size: 15px; color: var(--tinta-2); }
  @media print { header, .filtros, .acciones, .cargando, .error, .mapa-global, .mapa-dia, .colofon { display: none !important; } .dia, .sello { break-inside: avoid; box-shadow: none; } body { background: #fff; } }
</style>
<style>
  /* Ajustes propios de esta version */
  .contador { font-size: 12px; color: var(--tinta-2); margin-top: 4px; }
  .campo select.ciudad { font-weight: 600; }
  .hueco { display: grid; grid-template-columns: 62px 1fr; gap: 6px 14px; padding: 10px 0; border-top: 1px dashed var(--linea); font-size: 13px; color: var(--tinta-2); }
  .hueco .hora { color: var(--tinta-2); }
  .hueco b { font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; font-size: 10.5px; }
  @media (max-width: 560px) { .hueco { grid-template-columns: 1fr; } }
  .dur { font-size: 10.5px; color: var(--tinta-2); font-family: "JetBrains Mono", monospace; }
  .viajes { margin-top: 26px; background: var(--papel); border: 1px solid var(--linea); border-radius: var(--radio); padding: 22px 26px; box-shadow: var(--sombra-2); display: none; }
  .viajes.visible { display: block; }
  .viajes h4 { font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--acento); margin-bottom: 10px; }
  .viaje { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 0; border-top: 1px solid var(--linea); }
  .viaje:first-of-type { border-top: none; }
  .viaje .info { flex: 1; min-width: 200px; }
  .viaje .titulo-viaje { font-weight: 700; font-size: 15px; }
  .viaje .sub-viaje { font-size: 12.5px; color: var(--tinta-2); }
  .viaje .barra-viaje { height: 4px; background: var(--linea); border-radius: 4px; margin-top: 8px; max-width: 260px; overflow: hidden; }
  .viaje .barra-viaje div { height: 100%; background: var(--acento); }
  .btn-mini { cursor: pointer; font: 700 10.5px/1 Manrope, sans-serif; letter-spacing: 0.12em; text-transform: uppercase; color: var(--acento); background: none; border: 1.5px solid var(--acento-linea); border-radius: 99px; padding: 8px 13px; }
  .btn-mini:hover { border-color: var(--acento); background: var(--acento-suave); }
  .btn-mini.peligro { color: var(--tinta-2); }
  .hoy { margin-top: 26px; padding: 14px 20px; border-radius: 12px; background: var(--acento); color: #fff; font-size: 14px; display: none; }
  .hoy.visible { display: block; }
  .hoy b { letter-spacing: 0.12em; text-transform: uppercase; font-size: 10.5px; display: block; opacity: 0.85; margin-bottom: 3px; }
  .hecho-caja { grid-column: 2; display: flex; gap: 10px; align-items: center; margin-top: 2px; }
  .hecho-caja label { font-size: 12px; color: var(--tinta-2); display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .hecho-caja input { accent-color: var(--acento); width: 16px; height: 16px; }
  .parada.hecha .nombre { text-decoration: line-through; opacity: 0.6; }
  .guardar-caja { display: none; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 14px; }
  .guardar-caja.visible { display: flex; }
  .guardar-caja input { font: 500 14px Manrope, sans-serif; color: var(--tinta); background: var(--fondo); border: 1px solid var(--linea); border-radius: 10px; padding: 10px 14px; min-width: 240px; }
  .progreso-viaje { margin-top: 14px; font-size: 12.5px; color: var(--tinta-2); }
  @media (max-width: 560px) { .hecho-caja { grid-column: 1; } }
  .resumen-dia { margin-top: 12px; font-size: 12px; color: var(--tinta-2); display: flex; flex-wrap: wrap; gap: 6px 18px; }
</style>
</head>
<body>
<div class="contenedor">

  <header>
    <div class="aguja" aria-hidden="true"><span></span></div>
    <div>
      <h1>La Brújula<br><em>cuadra el viaje</em></h1>
      <p>Elige la ciudad, las fechas y cómo te apetece viajar. El motor arma el itinerario por zonas con nuestro propio repositorio: sitios reales, mapas, dónde comer, trucos y el salseo de cada rincón.</p>
    </div>
  </header>

  <div class="filtros">
    <div class="campo ancho">
      <label for="destino">Ciudad</label>
      <select id="destino" class="ciudad"></select>
      <span class="contador" id="contador"></span>
    </div>
    <div class="campo">
      <label for="fecha">Fecha de llegada</label>
      <input type="date" id="fecha">
    </div>
    <div class="campo">
      <label for="dias">Días completos (1–8)</label>
      <input type="number" id="dias" min="1" max="8" value="3">
    </div>
    <div class="campo">
      <label for="presupuesto">Presupuesto</label>
      <select id="presupuesto">
        <option value="ajustado">Ajustado: gratis y tapeo</option>
        <option value="medio" selected>Medio: sin mirar mucho</option>
        <option value="alto">A lo grande: reservas y caprichos</option>
      </select>
    </div>
    <div class="campo">
      <label for="grupo">Con quién</label>
      <select id="grupo">
        <option value="pareja" selected>En pareja</option>
        <option value="amigos">Con amigos</option>
        <option value="familia">En familia con niños</option>
        <option value="solo">En solitario</option>
      </select>
    </div>
    <div class="campo">
      <label for="ritmo">Ritmo</label>
      <select id="ritmo">
        <option value="3">Con calma (3 paradas al día)</option>
        <option value="4" selected>Normal (4 paradas al día)</option>
        <option value="5">Completo (5 paradas al día)</option>
      </select>
    </div>
    <div class="campo">
      <label for="transporte">Cómo os movéis</label>
      <select id="transporte">
        <option value="publico" selected>A pie y transporte público</option>
        <option value="motor">En coche o moto</option>
        <option value="pie">Solo a pie</option>
      </select>

      { n: "Hofburg y Sisi", lat: 48.2065, lng: 16.3654, tags: ["Imprescindible","Museo","Historia"], precio: 18, dur: 120, d: "El palacio de invierno imperial: apartamentos, museo de Sisi y la colección de plata.", truco: "Los patios se cruzan gratis; el museo de Sisi es lo que engancha. La Escuela Española de Equitación ensaya por la mañana (entrada aparte).", salseo: "Sisi medía 1,72 y pesaba 47 kilos, hacía gimnasia en sus aposentos y tardaba tres horas en peinarse; la fascinación con ella es un invento austriaco de posguerra. Los lipizzanos nacen negros y se vuelven blancos.", reservar: true },
      { n: "Café Central", lat: 48.2103, lng: 16.3656, tags: ["Comida","Historia","Imprescindible"], precio: 8, dur: 50, d: "El café de bóvedas de 1876 donde Trotsky jugaba al ajedrez y Freud debatía.", truco: "Hay cola a cualquier hora; Café Sperl o Café Prückel tienen la misma esencia y mesa libre.", salseo: "Cuando avisaron al ministro austriaco de la revolución rusa, dijo: '¿Y quién va a hacerla, el señor Bronstein del Café Central?'. Bronstein era Trotsky. Peter Altenberg, el poeta, tenía aquí su dirección postal.", comida: true, sg: "Café, sí; Sacher y strudel, no." },

      { n: "MuseumsQuartier", lat: 48.2033, lng: 16.3586, tags: ["Museo","Bar","Paseo"], precio: 16, dur: 90, d: "Los establos imperiales convertidos en barrio de museos, con el Leopold (Schiele y Klimt) y patios con sofás.", truco: "Los patios con sofás de colores son gratis y abren hasta tarde; el Leopold es el museo, el MUMOK si te va lo contemporáneo.", salseo: "Los sofás de plástico de colores ('Enzis') cambian de color cada año por votación popular; los vieneses discuten el color con pasión. Klimt vivía a 200 metros y no tenía lavabo." },

      { n: "Hundertwasserhaus", lat: 48.2073, lng: 16.3937, tags: ["Paseo","Fuera de ruta"], precio: 0, dur: 30, d: "El bloque de viviendas sociales con fachada de colores, suelos torcidos y árboles en las ventanas.", truco: "Solo se ve por fuera (viven vecinos); el Kunst Haus Wien, a 300 metros, es el museo del artista y tiene café en jardín.", salseo: "Hundertwasser no cobró por el diseño 'para evitar que se construyera algo feo en su lugar'; hay 'inquilinos árbol' con derecho a vivir en los balcones. El suelo ondulado es 'una melodía para los pies'." }

      { n: "Plaza de los Héroes y Vajdahunyad", lat: 47.5149, lng: 19.0776, tags: ["Imprescindible","Parque","Historia"], precio: 0, dur: 50, d: "La columna del milenio con los siete jefes magiares y, detrás, un castillo de mentira con lago y patinaje en invierno.", truco: "El castillo Vajdahunyad copia 21 edificios históricos de Hungría; la estatua encapuchada de Anonymus da suerte si tocas la pluma.", salseo: "El castillo se hizo de cartón para la Expo de 1896 y gustó tanto que lo rehicieron en piedra. En la plaza, en 1989, 250.000 personas asistieron al reentierro de Imre Nagy, el fin del comunismo húngaro.", ninos: true },

      { n: "Isla Margarita", lat: 47.5280, lng: 19.0480, tags: ["Parque","Paseo"], precio: 0, dur: 90, d: "La isla parque en medio del Danubio: ruinas, fuente musical, jardín japonés y alquiler de bicis-coche.", truco: "Entra por el puente Margarita; la fuente musical toca cada hora y de noche con luces. Bicis de cuatro plazas para reír.", salseo: "Margarita, hija del rey Béla IV, fue ofrecida al convento de la isla a los 4 años como promesa si los mongoles se iban; se fueron. Los baños de la isla tienen las aguas de un pozo que descubrió Zsigmondy en 1866.", ninos: true }

      { n: "Abadía de Westminster", lat: 51.4993, lng: -0.1273, tags: ["Imprescindible","Historia"], precio: 30, dur: 90, d: "Coronaciones, bodas reales y 3.300 personas enterradas, de Newton a Darwin y Dickens.", truco: "Las vísperas cantadas (evensong) de las 17:00 son gratis, con el coro y la abadía a oscuras; de otro modo, entrada online.", salseo: "Newton está enterrado junto a Darwin, que no creía en nada, y Dickens pidió una tumba modesta y le hicieron un funeral de Estado. Hay un poeta enterrado de pie por ahorrar espacio: Ben Jonson.", reservar: true },
      { n: "South Bank y Tate Modern", lat: 51.5076, lng: -0.0994, tags: ["Museo","Paseo","Mirador"], precio: 0, dur: 120, d: "El paseo del río desde el London Eye a la Tate, la central eléctrica convertida en museo de arte moderno.", truco: "Tate gratis; sube a la planta 10 del edificio nuevo (Blavatnik) para la vista de San Pablo sin pagar. Los libreros bajo Waterloo Bridge, de paso.", salseo: "La Sala de Turbinas era la sala de turbinas de verdad, cerrada en 1981; el mirador tuvo pleito con los vecinos de los pisos de cristal de al lado, que se cansaron de que les miraran el salón.", atardecer: true },

    ]},
    { nombre: "City y Torre de Londres", paradas: [
      { n: "Torre de Londres", lat: 51.5081, lng: -0.0759, tags: ["Imprescindible","Historia"], precio: 35, dur: 150, d: "Fortaleza, prisión y casa de las joyas de la corona, con los beefeaters como guías.", truco: "Ve a la apertura directo a las Joyas de la Corona, luego el tour gratuito con el beefeater; entrada online más barata.", salseo: "Si los seis cuervos se van, cae el reino: tienen las alas recortadas y un cuidador oficial. Ana Bolena pidió un espadachín francés en vez del hacha; en 1671 el coronel Blood casi roba la corona y el rey le perdonó.", reservar: true, ninos: true },
      { n: "Tower Bridge", lat: 51.5055, lng: -0.0754, tags: ["Imprescindible","Mirador"], precio: 13, dur: 45, d: "El puente levadizo victoriano con pasarelas de cristal en lo alto.", truco: "En la web hay horas de apertura del puente para los barcos: ver cómo se levanta es gratis desde la orilla.", salseo: "Mucha gente cree que es el London Bridge; el London Bridge de verdad lo compró un americano en 1968 y está en Arizona. Este ha estado azul, marrón y ahora azul otra vez.", ninos: true },
      { n: "Catedral de San Pablo", lat: 51.5138, lng: -0.0984, tags: ["Imprescindible","Historia","Mirador"], precio: 26, dur: 90, d: "La cúpula de Wren, la Galería de los Susurros y la vista desde la Golden Gallery, a 85 metros.", truco: "Evensong a las 17:00 gratis; para subir a la cúpula hay que pagar y hacer 528 escalones, empieza por ahí.", salseo: "Wren está enterrado dentro con una lápida que dice 'si buscas su monumento, mira a tu alrededor'. En 1940 la cúpula sobrevivió al Blitz rodeada de fuego y la foto fue propaganda de guerra." },

      { n: "Covent Garden", lat: 51.5117, lng: -0.1234, tags: ["Paseo","Mercado","Imprescindible"], precio: 0, dur: 50, d: "El mercado cubierto convertido en tiendas, con músicos callejeros en la plaza y ópera al lado.", truco: "Los artistas de la plaza pasan una audición del ayuntamiento; los de Apple Market, dentro, son artesanos de verdad. Neal's Yard, escondido, para la foto de colores.", salseo: "Aquí vendían verdura hasta 1974 y Eliza Doolittle, de My Fair Lady, vendía flores en el pórtico de la iglesia de San Pablo, que se llama 'la iglesia de los actores'. Pepys vio aquí el primer Punch and Judy en 1662." },
      { n: "Soho y Chinatown", lat: 51.5130, lng: -0.1325, tags: ["Comida","Bar","Paseo"], precio: 0, dur: 60, d: "Las calles de restaurantes, pubs con historia y las puertas rojas de Chinatown.", truco: "Bar Italia (Frith St) para café desde 1949; The French House para un pub sin música ni móviles; Chinatown para el dim sum de mediodía.", salseo: "En Broadwick Street hay una bomba de agua sin manivela: John Snow la quitó en 1854 y paró el cólera, y así nació la epidemiología. El pub de al lado se llama John Snow. Lo mató la cerveza no, la ciencia sí.", comida: true, sg: "Chinatown es complicado (soja); Beyond Bread en Soho es 100 % sin gluten." },
      { n: "Trafalgar Square y National Gallery", lat: 51.5089, lng: -0.1283, tags: ["Imprescindible","Museo"], precio: 0, dur: 90, d: "La plaza de Nelson y los leones, y detrás la pinacoteca gratis con Van Gogh, Turner y Velázquez.", truco: "El 'cuarto pedestal' tiene una obra distinta cada dos años; en la National Gallery ve directo a la sala 43 (impresionistas) y a los Turner.", salseo: "Los leones de Landseer tienen las patas mal: el escultor usó un león muerto que se pudrió antes de acabar. La plaza se diseñó para que no se pudieran hacer manifestaciones y es donde se hacen todas." }

    { nombre: "Notting Hill, Camden y parques", paradas: [

      { n: "Hyde Park y Kensington Gardens", lat: 51.5073, lng: -0.1657, tags: ["Parque","Paseo"], precio: 0, dur: 75, d: "El parque enorme de los londinenses: la Serpentine, la Speakers' Corner y el palacio de Kensington.", truco: "Speakers' Corner los domingos por la mañana, gratis y sin filtro; la Serpentine Gallery es gratis y el pabellón de verano, arquitectura en vivo.", salseo: "Peter Pan tiene estatua en Kensington Gardens: Barrie la puso de noche en 1912 sin permiso para que los niños creyeran que había aparecido por magia. Cualquiera puede hablar en Speakers' Corner salvo insultar a la reina, y aun así.", ninos: true },
      { n: "Camden Market", lat: 51.5414, lng: -0.1460, tags: ["Mercado","Comida","Bar"], precio: 0, dur: 90, d: "El mercado del canal, punk, comida callejera de todo el mundo y tiendas de disfraces.", truco: "Stables Market es la parte con más encanto; come en el patio de comida del canal. Los sábados, insoportable: ve entre semana.", salseo: "Amy Winehouse tiene estatua en Stables Market y vivía a cinco calles; el pub Hawley Arms era su casa. Los primeros vendedores de 1974 eran 16 puestos de artesanos.", comida: true, sg: "Muchos puestos marcan sin gluten; los currys y las brasas suelen serlo." },
      { n: "Primrose Hill", lat: 51.5390, lng: -0.1606, tags: ["Mirador","Parque","Fuera de ruta"], precio: 0, dur: 45, d: "La colina de los londinenses sobre Regent's Park con toda la ciudad abajo y sin cobrar.", truco: "Sube desde Camden por el canal en 15 minutos; al atardecer, con una botella, como todos. Después, pub The Engineer.", salseo: "Blake escribió que vio aquí 'el sol espiritual'; hay una placa con la frase. Las casas pastel son de las más caras de Londres y Paul McCartney vivía a una calle; Jude Law, Kate Moss y compañía después.", atardecer: true }

      { n: "Monumento al Holocausto", lat: 52.5139, lng: 13.3789, tags: ["Historia","Imprescindible"], precio: 0, dur: 40, d: "2.711 bloques de hormigón sobre un suelo ondulado, y un centro de información bajo tierra.", truco: "Entra por el centro de las filas y déjate perder; el centro de documentación del sótano es gratis y merece 30 minutos.", salseo: "La empresa que fabricó el antigrafiti de los bloques era filial de la que hizo el Zyklon B; se supo después. Eisenman, el arquitecto, quería que la gente jugara y saltara sobre los bloques, y el debate sigue." },

      { n: "Catedral de Berlín", lat: 52.5191, lng: 13.4010, tags: ["Historia","Mirador"], precio: 10, dur: 50, d: "La catedral protestante de cúpula verde, con cripta de los Hohenzollern y 270 escalones a la cúpula.", truco: "Los escalones de la cúpula dan vistas de la isla y el Lustgarten; a cambio, la cripta tiene 90 sarcófagos de la familia real.", salseo: "Guillermo II la quiso como San Pedro protestante y quedó exagerada; los bombardeos la dejaron sin cúpula 30 años. Enfrente, el Palacio Real reconstruido tapa el Palacio de la República de la RDA, que demolieron con polémica." },
      { n: "Alexanderplatz y torre de TV", lat: 52.5208, lng: 13.4094, tags: ["Imprescindible","Mirador"], precio: 25, dur: 60, d: "La plaza de la RDA con el reloj mundial y la torre de 368 metros con bar giratorio.", truco: "Entrada con hora online; el bar de arriba da la vuelta en 30 minutos y el café cuesta menos que la entrada a otros miradores.", salseo: "Cuando el sol da en la esfera se forma una cruz de luz que Berlín llamó 'la venganza del Papa', porque la RDA había quitado las cruces de las iglesias. Ulbricht la quería como demostración de fuerza. El Muro cayó igual.", atardecer: true, ninos: true },
      { n: "Hackesche Höfe y Haus Schwarzenberg", lat: 52.5250, lng: 13.4020, tags: ["Paseo","Fuera de ruta","Mercado"], precio: 0, dur: 50, d: "Ocho patios modernistas encadenados y, al lado, un patio con grafitis y un museo de Ana Frank.", truco: "Los patios de azulejos son los Hackesche; el de al lado (Rosenthaler 39) es el alternativo, con el Museo Otto Weidt gratis.", salseo: "Otto Weidt, ciego, empleó a judíos ciegos y sordos en su taller de cepillos y los escondió de la Gestapo; el taller se conserva tal cual. Los patios eran de vivienda, fábrica y cabaret al mismo tiempo." }

      { n: "Checkpoint Charlie y Topografía del Terror", lat: 52.5076, lng: 13.3904, tags: ["Historia","Museo"], precio: 0, dur: 75, d: "El puesto fronterizo americano (reconstruido) y, a 300 metros, la exposición sobre las SS en el solar de la Gestapo.", truco: "Checkpoint es una foto de un minuto con actores disfrazados; la Topografía es gratis, seria y con un tramo de Muro auténtico.", salseo: "En 1961 tanques soviéticos y americanos estuvieron 16 horas cañón contra cañón aquí; Kennedy y Jruschov los retiraron metro a metro por teléfono. El cartel 'You are leaving the American sector' es original." },
      { n: "Bergmannkiez y Viktoriapark", lat: 52.4885, lng: 13.3830, tags: ["Paseo","Mirador","Fuera de ruta","Parque"], precio: 0, dur: 60, d: "La calle de cafés y tiendas antiguas de Kreuzberg y el parque con cascada y el monumento que da nombre al barrio.", truco: "Sube al monumento de hierro de Schinkel: es la 'cruz de la colina' (Kreuz-berg) y la mejor vista del sur de la ciudad, gratis.", salseo: "La cascada es artificial y la encienden solo de mayo a octubre; el barrio se llama Kreuzberg por esta cruz de 1821, que celebra la derrota de Napoleón. Los viñedos del parque dan 200 botellas de 'Kreuz-Neroberger' al año.", atardecer: true },

    { nombre: "Prenzlauer Berg y Tiergarten", paradas: [
      { n: "Memorial del Muro en Bernauer Straße", lat: 52.5354, lng: 13.3903, tags: ["Historia","Imprescindible"], precio: 0, dur: 60, d: "El tramo de Muro completo, con franja de la muerte, torre de vigilancia y la capilla de la Reconciliación.", truco: "Sube al mirador del centro de documentación (gratis) para ver la franja desde arriba; es el único sitio donde se entiende el Muro.", salseo: "El día que se cerró la frontera, la gente saltaba desde las ventanas de esta calle a la acera occidental; los bomberos del oeste ponían lonas. Una mujer de 77 años saltó desde un tercero. La iglesia la volaron en 1985 y la reconstruyeron de tierra apisonada." },
      { n: "Mauerpark", lat: 52.5430, lng: 13.4030, tags: ["Mercado","Parque","Bar","Fuera de ruta"], precio: 0, dur: 90, d: "El domingo: mercadillo, barbacoas, músicos y el karaoke en el anfiteatro con 2.000 personas cantando.", truco: "Karaoke de 15:00 a 18:00 (marzo-octubre), llega a las 14:30 para sentarte; el mercadillo desde las 10. Entre semana es un parque normal.", salseo: "Era la franja de la muerte entre Wedding y Prenzlauer Berg; el karaoke lo monta desde 2009 un irlandés con un carrito de bici y un altavoz. Los cantantes malos son los que más aplausos reciben.", comida: true, sg: "Los puestos de comida del mercadillo, preguntando; hay currywurst y falafel." },
      { n: "Kollwitzplatz y Kastanienallee", lat: 52.5375, lng: 13.4190, tags: ["Paseo","Comida","Mercado"], precio: 0, dur: 60, d: "El Berlín de fachadas restauradas, cafés con carritos y el mercado ecológico de sábado.", truco: "Mercado en Kollwitzplatz sábados; Konnopke's Imbiss, bajo el U-Bahn de Eberswalder, es el currywurst clásico desde 1930. Prater Garten para cerveza bajo los castaños.", salseo: "Käthe Kollwitz vivió 50 años en la plaza dibujando la pobreza obrera; hoy es el barrio más cursi de Berlín y los berlineses del este lo llaman 'Suabia'. Konnopke's sobrevivió a la RDA como negocio privado, casi único.", comida: true, sg: "Konnopke's: la salchicha sí, sin pan; pregunta por la salsa." },
      { n: "Tiergarten y Siegessäule", lat: 52.5145, lng: 13.3501, tags: ["Parque","Mirador"], precio: 4, dur: 75, d: "El parque central, bosque de verdad, con la Columna de la Victoria dorada y 285 escalones.", truco: "Café am Neuen See, en el lago, para cerveza en barca; la columna a última hora con el sol detrás del Reichstag.", salseo: "El ángel de Wenders vigilaba Berlín desde esta columna; Hitler la movió de sitio para su avenida y así se salvó de los bombardeos. Después de la guerra los berlineses talaron el parque entero para calentarse y lo replantaron.", atardecer: true, ninos: true }
    ]}
  ]

CIUDADES.atenas = {

  claim: "Mármol de hace 2.500 años y una ciudad que cena a las once",
  consejo: "Metro limpio y barato; los sitios arqueológicos cierran a las 15:00 en invierno y la Acrópolis tiene entrada horaria obligatoria. Agua siempre.",
  presupuesto: "Entradas ≈ 20-30 € por persona (Acrópolis 30 €); comer para dos ≈ 30-55 €.",
  lluvia: "Museo de la Acrópolis, Museo Arqueológico Nacional y una taberna con estufa.",
  comer: ["Diporto (Sokratous): bodega sin cartel bajo tierra, garbanzos y vino de barril desde 1887", "Kostas (Pentelis): el souvlaki de Syntagma, de pie, se acaba a las 15:00", "Ta Karamanlidika tou Fani (Sokratous): charcutería y mezze en una tienda de embutidos, reserva"],
  singluten: ["La comida griega es muy apta: souvlaki sin pita, ensaladas, dolmades, pescado. El pan y la spanakopita no", "Rakoumel, junto al Museo Arqueológico, tiene carta sin gluten señalada"],
  zonas: [
    { nombre: "Acrópolis y Plaka", paradas: [
      { n: "Acrópolis", lat: 37.9715, lng: 23.7257, tags: ["Imprescindible","Historia","Mirador"], precio: 30, dur: 120, d: "El Partenón, el Erecteion con las cariátides y la vista de la ciudad blanca hasta el mar.", truco: "Entrada horaria obligatoria en la web oficial; la primera franja (8:00) o la última en verano. Sube por la ladera sur (teatro de Dioniso) y baja por Propileos.", salseo: "El Partenón estuvo casi intacto 2.000 años hasta que un mortero veneciano hizo estallar la pólvora que los turcos guardaban dentro en 1687. Las cariátides originales están en el museo; una en Londres, y sus hermanas 'la lloran por la noche'.", reservar: true, atardecer: true },
      { n: "Museo de la Acrópolis", lat: 37.9685, lng: 23.7285, tags: ["Imprescindible","Museo"], precio: 15, dur: 90, d: "El museo de cristal de Tschumi sobre las excavaciones, con la galería del Partenón alineada con el templo.", truco: "Ve por la tarde, después de la Acrópolis; los frisos se ven a la altura de los ojos y las cariátides originales están solas.", salseo: "La galería superior tiene los huecos vacíos de los mármoles de Londres a propósito, con copias en yeso blanco: es un argumento de 2.500 toneladas. El suelo de cristal deja ver un barrio bizantino entero." },
      { n: "Plaka y Anafiotika", lat: 37.9720, lng: 23.7290, tags: ["Paseo","Imprescindible","Fuera de ruta"], precio: 0, dur: 60, d: "El barrio bajo la Acrópolis, con tabernas, y arriba las casitas blancas de las Cícladas construidas por albañiles isleños.", truco: "Sube por las escaleras detrás de la iglesia de San Jorge de la Roca: Anafiotika parece Santorini y nadie llega. Silencio, viven vecinos.", salseo: "Los albañiles de Anafi vinieron a construir el palacio real de Otón en 1841 y levantaron sus casas de noche, aprovechando una ley otomana: si al amanecer había tejado, la casa era tuya." },
      { n: "Ágora antigua y Hefestión", lat: 37.9753, lng: 23.7222, tags: ["Historia","Parque"], precio: 10, dur: 75, d: "La plaza pública donde Sócrates daba la lata, con el templo dórico mejor conservado de Grecia y la Estoa reconstruida.", truco: "Incluida en el pase combinado de 30 € de la Acrópolis; la Estoa de Átalo tiene sombra y museo. Ve por la mañana.", salseo: "El Hefestión está intacto porque fue iglesia 1.000 años y luego cementerio de protestantes ingleses; Sócrates fue juzgado a 200 metros, en un edificio del que solo quedan piedras, y bebió la cicuta en la cárcel del suroeste." }
    ]},
    { nombre: "Syntagma, Monastiraki y Psiri", paradas: [
      { n: "Plaza Syntagma y cambio de guardia", lat: 37.9755, lng: 23.7348, tags: ["Imprescindible","Historia"], precio: 0, dur: 30, d: "El Parlamento y los evzones con faldas y zapatos de pompón marcando el paso cada hora.", truco: "Cambio cada hora en punto; el grande, con banda y 150 soldados, los domingos a las 11:00.", salseo: "Los zapatos (tsarouchia) pesan 3 kilos cada uno y llevan 60 clavos; los pompones escondían navajas. El paso lento se explica por una leyenda: no querían despertar a los muertos de la Guerra de Independencia." },
      { n: "Monastiraki y su mercadillo", lat: 37.9760, lng: 23.7256, tags: ["Mercado","Paseo","Imprescindible"], precio: 0, dur: 50, d: "La plaza con la mezquita, la Acrópolis arriba y las calles de anticuarios y trastos hasta el domingo grande.", truco: "El mercadillo del domingo por la mañana en Avissynias es el auténtico; el resto de la semana, tiendas de recuerdos. Sube a la terraza del A for Athens para la foto.", salseo: "Bajo la plaza, en la estación de metro, hay un río antiguo (Eridanos) y una excavación entera; la mezquita fue cárcel y almacén y ahora museo de cerámica. Aquí compraban los griegos sus muebles de segunda mano en la crisis." },
      { n: "Mercado central de Varvakios", lat: 37.9800, lng: 23.7275, tags: ["Mercado","Comida","Fuera de ruta"], precio: 0, dur: 45, d: "El mercado de carne y pescado a gritos, y alrededor las tiendas de especias y aceitunas de la calle Evripidou.", truco: "Diporto, sin cartel, está en un sótano de la calle Sokratous: pide lo que haya. Karamanlidika para embutidos y pastirma.", salseo: "Las tabernas del mercado abrían de madrugada para los carniceros y los que salían de fiesta; la sopa de callos (patsás) a las 5 de la mañana es la resaca oficial de Atenas. Diporto no tiene carta desde 1887.", comida: true, sg: "Todo el mezze de Diporto es apto salvo el pan; las aceitunas de Evripidou, sin problema." },
      { n: "Psiri de noche", lat: 37.9790, lng: 23.7245, tags: ["Bar","Comida","Paseo"], precio: 0, dur: 90, d: "El barrio de talleres convertido en tabernas con música en vivo, rakí y bares de patio.", truco: "Plaza Iroon para empezar; Little Kook, el café de decorados gigantes, es surrealista. Bar de rembétiko a partir de las 23:00.", salseo: "Byron vivió en Psiri en 1810 con una familia local y se enamoró de la hija; los 'koutsavakides', los matones de bigote del XIX, mandaban aquí y la policía les cortaba medio bigote como castigo.", comida: true, sg: "Mezze de queso, pulpo y verduras; pide sin pan." }
    ]},
    { nombre: "Licabeto, Kolonaki y museos", paradas: [
      { n: "Colina del Licabeto", lat: 37.9819, lng: 23.7436, tags: ["Imprescindible","Mirador"], precio: 0, dur: 75, d: "La colina de 277 metros con la capilla blanca en la cima y la vista completa de Atenas y el mar.", truco: "Funicular desde Kolonaki (10 €) o subida a pie en 20 minutos por Aristippou; al atardecer, con la Acrópolis iluminándose abajo.", salseo: "Atenea llevaba esta roca para poner en la Acrópolis y la dejó caer cuando le dieron una mala noticia; en el teatro de la ladera tocaron Ray Charles y Dylan. El nombre viene de los lobos que había.", atardecer: true },
      { n: "Museo Benaki", lat: 37.9760, lng: 23.7395, tags: ["Museo","Fuera de ruta"], precio: 12, dur: 75, d: "La colección privada de la familia Benaki: de la Grecia antigua a la independencia, con trajes y joyas.", truco: "Los jueves abre hasta medianoche con entrada gratis desde las 18:00; la terraza restaurante mira al Jardín Nacional.", salseo: "Antonis Benakis hizo su fortuna con el algodón en Egipto y donó todo, casa incluida, en 1931; su hermana Penélope Delta, escritora, se suicidó el día que los nazis entraron en Atenas." },
      { n: "Museo Arqueológico Nacional", lat: 37.9890, lng: 23.7325, tags: ["Museo","Imprescindible"], precio: 12, dur: 120, d: "La máscara de Agamenón, el Poseidón de bronce y el mecanismo de Anticitera, el primer ordenador.", truco: "Ve directo a la sala micénica (máscara) y luego al Anticitera, en la planta baja al fondo; el resto según energía.", salseo: "Schliemann telegrafió 'he mirado el rostro de Agamenón' en 1876; la máscara es 300 años anterior a la guerra de Troya y hay quien cree que él le añadió el bigote. El mecanismo de Anticitera lo sacó un buscador de esponjas." },
      { n: "Kolonaki y Café Da Capo", lat: 37.9780, lng: 23.7410, tags: ["Comida","Paseo","Bar"], precio: 5, dur: 45, d: "El barrio de galerías, sastres y terrazas donde Atenas presume, con el café de la plaza de referencia.", truco: "El freddo espresso (café con espuma de hielo) es el invento ateniense: pídelo 'metrio'. Las galerías de Skoufa y las tiendas de Voukourestiou.", salseo: "Kolonaki viene de una columnita de la plaza que nadie sabe de dónde salió; Da Capo lleva 30 años siendo donde políticos y armadores se dejan ver un sábado a mediodía.", comida: true, sg: "Café y helado; en Kolonaki muchos restaurantes marcan sin gluten." }
    ]},
    { nombre: "Gazi, Kerameikos y el mar", paradas: [
      { n: "Cementerio de Kerameikos", lat: 37.9780, lng: 23.7180, tags: ["Historia","Parque","Fuera de ruta"], precio: 8, dur: 60, d: "El cementerio de la Atenas clásica, con estelas funerarias entre hierba y tortugas, y el museo.", truco: "Incluido en el pase combinado; casi vacío siempre. Pericles pronunció aquí su oración fúnebre. Las tortugas son de verdad.", salseo: "Aquí se enterraba a los caídos en las guerras y aquí Pericles dijo 'Atenas es la escuela de Grecia'; el barrio era de ceramistas (de ahí 'cerámica') y la 'calle de las tumbas' era la de los ricos, con estelas como esculturas." },
      { n: "Technopolis y Gazi", lat: 37.9775, lng: 23.7145, tags: ["Bar","Paseo","Museo"], precio: 0, dur: 75, d: "La antigua fábrica de gas convertida en centro cultural y el barrio de bares y terrazas alrededor.", truco: "Conciertos gratis en verano en el patio de la fábrica; los bares de Gazi arrancan a las 23:00. La estación de metro Kerameikos, en medio.", salseo: "La fábrica iluminó Atenas con gas de 1857 a 1984; el barrio olía tanto que era el más barato de la ciudad. Ahora es el más caro para tomar una copa. Los depósitos de gas son salas de exposición.", comida: true, sg: "Muchos bares sirven mezze griego apto." },
      { n: "Stavros Niarchos Foundation", lat: 37.9400, lng: 23.6920, tags: ["Parque","Mirador","Fuera de ruta"], precio: 0, dur: 90, d: "La ópera y biblioteca de Renzo Piano bajo una colina artificial con parque y vistas al mar, gratis.", truco: "Autobús gratuito desde Syntagma; sube a la azotea (Lighthouse) al atardecer y luego el canal del parque con niños. Bicis gratis.", salseo: "La familia Niarchos, armadores, pagó 600 millones y regaló el complejo al Estado en 2017; el parque está sobre el edificio, con 1.400 olivos, y el canal es de agua de mar. Es donde Atenas va el domingo.", atardecer: true, ninos: true },
      { n: "Cabo Sunión", lat: 37.6500, lng: 24.0240, tags: ["Imprescindible","Mirador","Historia"], precio: 20, dur: 180, d: "El templo de Poseidón sobre el acantilado, a 70 km de la ciudad, para el atardecer más famoso de Grecia.", truco: "Autobús KTEL desde Pedion tou Areos (2 h) o coche; llega dos horas antes del ocaso y busca la firma de Byron en una columna.", salseo: "Byron grabó su nombre en una columna en 1810 y ahora está protegido con cristal; Egeo se tiró al mar desde aquí al ver las velas negras de Teseo y así el mar se llama Egeo. Los marineros lo veían desde 20 millas.", atardecer: true }
    ]}
  ]

  zonas: [
    { nombre: "Royal Mile y Castillo", paradas: [
      { n: "Castillo de Edimburgo", lat: 55.9486, lng: -3.1999, tags: ["Imprescindible","Historia","Mirador"], precio: 20, dur: 120, d: "La fortaleza sobre la roca volcánica: joyas de la corona, la Piedra del Destino y el cañón de la una.", truco: "Entrada online con hora; a las 13:00 disparan el cañón, colócate en la batería Mills Mount con antelación. Baja por la Royal Mile.", salseo: "El cañón dispara desde 1861 para que los barcos del Forth ajustaran los relojes; los domingos no, por respeto. La Piedra del Destino volvió de Londres en 1996 después de 700 años y unos estudiantes ya la habían robado antes en 1950.", reservar: true, ninos: true },
      { n: "Royal Mile y sus 'closes'", lat: 55.9500, lng: -3.1880, tags: ["Imprescindible","Paseo","Historia"], precio: 0, dur: 60, d: "La calle del castillo al palacio, con callejones estrechos a los lados que bajan a patios escondidos.", truco: "Métete en Advocate's Close (vista de la New Town) y en Dunbar's Close (jardín secreto del XVII, gratis). Real Mary King's Close es el tour bajo tierra.", salseo: "Los edificios de la Royal Mile llegaron a 14 plantas en el XVII, los primeros rascacielos del mundo; a las 22:00 vaciaban los orinales por la ventana gritando 'gardyloo'. Mary King's Close quedó sellada bajo el ayuntamiento con vecinos de peste dentro, según la leyenda." },
      { n: "Catedral de St Giles", lat: 55.9495, lng: -3.1910, tags: ["Historia"], precio: 0, dur: 30, d: "La iglesia madre del presbiterianismo con la torre en forma de corona y la capilla del Cardo, tallada como un bosque.", truco: "La Thistle Chapel al fondo, con un ángel tocando la gaita en el techo: búscalo. Donativo de entrada. El Corazón de Midlothian en el suelo de fuera se escupe por tradición.", salseo: "En 1637 Jenny Geddes tiró un taburete al cura por leer el libro anglicano y empezó una guerra; su taburete tiene placa. El Corazón marca la cárcel donde ahorcaban: se escupe por desprecio, no por suerte." },
      { n: "Palacio de Holyrood", lat: 55.9527, lng: -3.1722, tags: ["Historia","Museo"], precio: 20, dur: 75, d: "La residencia del rey en Escocia, con la abadía en ruinas y los aposentos de María Estuardo.", truco: "Cierra cuando el rey está (una semana en julio); la abadía en ruinas del jardín es lo más romántico y suele haber ciervos en Arthur's Seat detrás.", salseo: "Aquí apuñalaron 56 veces al secretario de María Estuardo, Rizzio, delante de ella embarazada; una mancha del suelo se enseña como su sangre. Es una restauración, pero cada guía la cuenta." }
    ]},
    { nombre: "Grassmarket y Old Town", paradas: [
      { n: "Victoria Street y Grassmarket", lat: 55.9483, lng: -3.1935, tags: ["Imprescindible","Paseo","Mercado"], precio: 0, dur: 45, d: "La calle curva de fachadas de colores y la plaza de los antiguos mercados y ejecuciones, hoy de pubs.", truco: "Victoria Street de arriba a abajo por la terraza superior; en Grassmarket, el pub The Last Drop se llama por la última gota del ahorcado.", salseo: "Maggie Dickson fue ahorcada aquí en 1724 y despertó en el ataúd de camino al cementerio; la ley decía que ya había cumplido y vivió 40 años más. Tiene pub. Victoria Street inspiró el callejón Diagon, según los fans." },
      { n: "Greyfriars Kirkyard", lat: 55.9469, lng: -3.1920, tags: ["Historia","Fuera de ruta","Parque"], precio: 0, dur: 40, d: "El cementerio de Bobby, el perro fiel, con tumbas que dieron nombre a personajes de Harry Potter.", truco: "Busca la tumba de Thomas Riddell (Voldemort) al fondo, y la de McGonagall; no frotes la nariz de la estatua de Bobby, se la están desgastando.", salseo: "Bobby vigiló la tumba de su amo 14 años y el alcalde le pagó la licencia; la historia es probablemente publicidad de un restaurante que le daba de comer. Rowling escribía en el café Elephant House de enfrente mirando las tumbas." },
      { n: "National Museum of Scotland", lat: 55.9470, lng: -3.1906, tags: ["Museo","Imprescindible","Mirador"], precio: 0, dur: 90, d: "El museo gratis de todo: la oveja Dolly, dinosaurios, una gran sala victoriana de hierro y una terraza en el tejado.", truco: "La terraza de la planta 7 tiene la vista del castillo y la ciudad sin pagar; la Gran Galería victoriana para empezar. Ideal con lluvia.", salseo: "Dolly, la primera oveja clonada, está disecada dando vueltas en una vitrina; nació en Roslin, a 10 km, y se llamó así por Dolly Parton por razones que el científico explicó y no repetiremos.", ninos: true },
      { n: "Sandy Bell's y los pubs de Forrest Road", lat: 55.9455, lng: -3.1920, tags: ["Bar","Fuera de ruta"], precio: 0, dur: 90, d: "El pub de la música folk escocesa en vivo cada noche, sin escenario: los músicos tocan en la mesa.", truco: "Sesión desde las 21:30 (antes los fines de semana); pide una pinta y no hables durante las canciones. Al lado, The Bow Bar para whisky.", salseo: "Los músicos vienen con el instrumento y se sientan; Hamish Henderson, el poeta que rescató la canción folk escocesa, tenía aquí su oficina. Dylan pasó por aquí en los 60 y se llevó canciones.", comida: true, sg: "Cerveza no; whisky y sidra, sin problema." }
    ]},

      { n: "Calton Hill", lat: 55.9553, lng: -3.1827, tags: ["Imprescindible","Mirador"], precio: 0, dur: 45, d: "La colina de los monumentos griegos inacabados, la 'Atenas del norte', con la mejor postal de la ciudad.", truco: "Sube desde Waterloo Place en 5 minutos; la foto es desde el Dugald Stewart Monument hacia el castillo, al atardecer.", salseo: "El Monumento Nacional se quedó a medias en 1829 por falta de dinero y lo llaman 'la desgracia de Edimburgo'; 200 años después nadie lo quiere terminar porque ya es más famoso así.", atardecer: true },
      { n: "Princes Street Gardens y Scott Monument", lat: 55.9515, lng: -3.1960, tags: ["Parque","Paseo","Mirador"], precio: 8, dur: 50, d: "Los jardines bajo el castillo, en lo que fue un lago fétido, y el cohete gótico de 61 metros a Walter Scott.", truco: "El Scott Monument tiene 287 escalones estrechos y una vista distinta; el reloj floral de los jardines funciona de verdad desde 1903.", salseo: "El Nor Loch era una laguna donde tiraban basura y ahogaban brujas; lo drenaron en 1820 para hacer el jardín. Scott inventó la Escocia de tartán para la visita de Jorge IV en 1822, kilt incluido: era marketing." },
      { n: "Dean Village y Water of Leith", lat: 55.9520, lng: -3.2200, tags: ["Fuera de ruta","Paseo","Parque"], precio: 0, dur: 60, d: "Un pueblo de molinos del XIX escondido en un barranco a diez minutos de Princes Street, con paseo por el río.", truco: "Baja desde Dean Bridge y sigue el Water of Leith hasta la Galería de Arte Moderno (gratis, jardín de Jencks) o hasta Stockbridge para el mercado del domingo.", salseo: "Había once molinos de grano y los panaderos de la ciudad eran de aquí; en 1880 estaba en ruinas y lo compraron para hacerlo bonito. Las casas de Well Court se hicieron para obreros con la condición de que fueran a la iglesia." },
      { n: "Stockbridge", lat: 55.9585, lng: -3.2110, tags: ["Comida","Mercado","Paseo"], precio: 0, dur: 60, d: "El barrio de tiendas de segunda mano, delis y el mercado de granjeros del domingo junto al río.", truco: "Mercado domingos de 10 a 16; Circus Lane es la callejuela de las fotos (adoquines y flores); The Scran and Scallie para comer de pub bueno.", salseo: "Las 'colonias' de casas dobles de Stockbridge las construyó una cooperativa de obreros en 1861 con escaleras exteriores; Raeburn, el pintor, urbanizó el barrio y lo perdió todo con un banco.", comida: true, sg: "El mercado tiene puesto de pastelería sin gluten." }

    { nombre: "Arthur's Seat y Leith", paradas: [

      { n: "Duddingston y The Sheep Heid Inn", lat: 55.9410, lng: -3.1490, tags: ["Comida","Fuera de ruta","Historia"], precio: 0, dur: 90, d: "El pueblo de detrás del volcán, con un lago con cisnes y el pub más antiguo de Escocia, con bolera del XVI.", truco: "Baja desde Arthur's Seat directo; reserva la pista de bolos (skittles) para después de comer. El Dr. Neil's Garden, junto al lago, es un jardín secreto gratis.", salseo: "María Estuardo jugó a los bolos aquí, y Jacobo VI regaló a la posada una cabeza de carnero de plata que da nombre al pub; se la robaron. La reina Isabel II vino a comer en 2016 sin avisar.", comida: true, sg: "El pub marca opciones sin gluten en carta." },
      { n: "Leith y The Shore", lat: 55.9755, lng: -3.1700, tags: ["Comida","Paseo","Bar"], precio: 0, dur: 90, d: "El puerto de Trainspotting convertido en barrio de restaurantes con estrella y bares junto al agua.", truco: "Tranvía o bus 22 hasta The Shore; The Kitchin y Restaurant Martin Wishart son las estrellas, Fishers para pescado sin ceremonia. Teuchters Landing para cerveza en el muelle.", salseo: "Leith fue ciudad independiente hasta 1920 y votó en contra de unirse a Edimburgo; siguen teniendo bandera. Trainspotting arranca en Leith y los turistas buscan un puerto que ya no existe.", comida: true, sg: "Fishers y The Kitchin gestionan alérgenos bien." },

  comer: ["The Winding Stair (Ormond Quay): cocina irlandesa sobre una librería, con vistas al río, reserva", "Leo Burdock (Werburgh St): el fish and chips desde 1913, para llevar al parque", "The Fumbally (Fumbally Lane): brunch del barrio de los Liberties, con pan propio"],
  singluten: ["El Guinness no es apto (cebada); las sidras (Bulmers) y el whiskey sí", "Bretzel Bakery hace pan sin gluten; el Irish stew de ternera suele serlo, pregunta por la harina"],
  zonas: [
    { nombre: "Trinity y Georgian Dublin", paradas: [
      { n: "Trinity College y Libro de Kells", lat: 53.3438, lng: -6.2546, tags: ["Imprescindible","Historia","Museo"], precio: 25, dur: 75, d: "La universidad de 1592, la Long Room con 200.000 libros y el evangeliario iluminado del siglo IX.", truco: "Entrada online con hora; la Long Room, la biblioteca de las escaleras, está en obras de restauración por fases: comprueba si se ve.", salseo: "El Libro de Kells sobrevivió a los vikingos enterrado y a un robo en 1007 en que le arrancaron la cubierta de oro; el arpa de la Long Room es la del escudo de Irlanda y la de la cerveza. Hay una copia de la Proclamación de 1916.", reservar: true },
      { n: "Grafton Street y St Stephen's Green", lat: 53.3400, lng: -6.2600, tags: ["Paseo","Parque","Imprescindible"], precio: 0, dur: 60, d: "La calle de músicos y tiendas y el parque victoriano donde Dublín come el sándwich al sol cuando lo hay.", truco: "Bewley's, el café de vidrieras de Harry Clarke, para el segundo desayuno; en el parque, el rincón de los ciegos con plantas aromáticas.", salseo: "Los rebeldes de 1916 se atrincheraron en el parque y pactaron un alto el fuego diario para que el guarda diera de comer a los patos. Bono, Glen Hansard y Damien Rice tocaron en Grafton Street de jóvenes." },
      { n: "Merrion Square y las puertas georgianas", lat: 53.3395, lng: -6.2495, tags: ["Paseo","Historia"], precio: 0, dur: 45, d: "Las casas georgianas con puertas de colores y la estatua de Oscar Wilde tumbado en la roca.", truco: "La estatua de Wilde tiene dos caras: sonríe mirando al parque y hace mueca del otro lado. El domingo la verja se llena de pintores.", salseo: "Las puertas de colores tienen dos leyendas: para que los maridos borrachos reconocieran la casa, o para no pintarlas de negro por luto a la reina Victoria. Wilde vivió en el número 1 y Yeats en el 82." },
      { n: "Museo Nacional de Arqueología", lat: 53.3402, lng: -6.2550, tags: ["Museo","Fuera de ruta"], precio: 0, dur: 75, d: "El oro celta, el broche de Tara y los cuerpos de las turberas conservados 2.000 años, gratis.", truco: "Los 'bog bodies' están en la sala de la izquierda en cámaras circulares: de piel y pelo intactos. Al lado, la Biblioteca Nacional con la exposición de Yeats.", salseo: "Los cuerpos de las turberas eran reyes sacrificados con las uñas cuidadas y el pelo con gel de resina importada; el oro prehistórico lo encontraban campesinos cortando turba y lo vendían al peso." }
    ]},
    { nombre: "Temple Bar y el castillo", paradas: [
      { n: "Castillo de Dublín y Chester Beatty", lat: 53.3430, lng: -6.2675, tags: ["Historia","Museo"], precio: 8, dur: 75, d: "El castillo del poder británico en Irlanda y, en sus jardines, la biblioteca Chester Beatty con manuscritos de todo el mundo, gratis.", truco: "El Chester Beatty es la joya: Coranes, papiros bíblicos y estampas japonesas, gratis y con café en el jardín. El castillo, solo si sobra tiempo.", salseo: "En 1922 Michael Collins llegó siete minutos tarde a recibir el castillo de los británicos y dijo: 'lleváis 700 años, os podéis esperar siete minutos'. Chester Beatty era un minero americano que dejó su colección a Irlanda porque le gustaba." },
      { n: "Catedral de Christ Church", lat: 53.3434, lng: -6.2712, tags: ["Historia"], precio: 11, dur: 45, d: "La catedral medieval con la cripta más grande de Irlanda, con un gato y una rata momificados.", truco: "La cripta tiene el gato y la rata que se quedaron atascados en el órgano en 1850; Joyce los cita. Hay 'Dublinia' vikingo al lado para niños.", salseo: "Strongbow, el normando, está enterrado con una tumba que no es la suya (la real se rompió); las madres traían hijos a firmar contratos sobre ella. El corazón de San Lorenzo O'Toole lo robaron en 2012 y volvió en 2018.", ninos: true },
      { n: "Temple Bar", lat: 53.3454, lng: -6.2634, tags: ["Bar","Paseo","Imprescindible"], precio: 0, dur: 60, d: "El barrio de adoquines de pubs con música, caro y turístico, pero con el mercado de comida del sábado.", truco: "The Temple Bar pub es para la foto; The Palace Bar (Fleet St) o Mulligan's, a dos calles, son los de verdad. Mercado de comida en Meeting House Square sábados.", salseo: "Iban a demolerlo entero en los 80 para hacer una estación de autobuses, y como esperaban, alquilaron barato a artistas; cuando quisieron derribarlo, ya era el barrio de moda. Los buses nunca llegaron.", comida: true, sg: "Sidra en los pubs; el mercado del sábado tiene puestos con etiquetado." },
      { n: "Ha'penny Bridge y el Liffey", lat: 53.3464, lng: -6.2634, tags: ["Paseo","Mirador"], precio: 0, dur: 25, d: "El puente de hierro de 1816 por el que se pagaba medio penique, y el paseo por los muelles.", truco: "Crúzalo de sur a norte hacia el pasaje Merchant's Arch y baja por los quays hasta el Winding Stair al atardecer.", salseo: "El peaje de medio penique era el precio del ferry que sustituyó y duró hasta 1919; el dueño del ferry, Walsh, lo construyó por castigo de las autoridades por lo malo que era su barco.", atardecer: true }
    ]},
    { nombre: "Guinness, Liberties y Kilmainham", paradas: [

      { n: "Catedral de San Patricio", lat: 53.3395, lng: -6.2714, tags: ["Historia","Parque"], precio: 10, dur: 45, d: "La catedral más grande de Irlanda, con la tumba de Jonathan Swift, el deán, y su epitafio feroz.", truco: "Swift está a la derecha de la entrada, con su Stella al lado; el parque de fuera marca el pozo donde San Patricio bautizaba. Coro a las 17:30 gratis.", salseo: "Swift escribió su propio epitafio en latín: 'donde la indignación salvaje ya no puede lacerar su corazón'. Dejó dinero para un manicomio porque, dijo, 'ningún país lo necesita tanto'." },
      { n: "Kilmainham Gaol", lat: 53.3418, lng: -6.3098, tags: ["Historia","Imprescindible"], precio: 8, dur: 90, d: "La cárcel donde fusilaron a los líderes de 1916, con el patio del pelotón y la galería victoriana de hierro.", truco: "Solo con visita guiada y reserva online; se agota semanas antes. Bus desde el centro o andando desde la Guinness por el Museo de Arte Moderno (gratis, jardines).", salseo: "Joseph Plunkett se casó en la capilla de la cárcel diez minutos antes de que lo fusilaran y a James Connolly, herido, lo ataron a una silla para dispararle. Fue lo que cambió a Irlanda de opinión sobre la rebelión.", reservar: true },
      { n: "The Liberties y Teeling Distillery", lat: 53.3395, lng: -6.2770, tags: ["Fuera de ruta","Bar","Mercado"], precio: 20, dur: 90, d: "El barrio antiguo de destilerías y mercados callejeros, con la primera destilería nueva del centro en 125 años.", truco: "Teeling tiene cata al final; Meath Street sigue con puestos de fruta y voz; The Fumbally para comer. Pub Fallon's para la pinta.", salseo: "Los Liberties se llamaban así porque estaban fuera de la ley del ayuntamiento y tenían las suyas; era el barrio de los tejedores hugonotes, luego el más pobre de Europa según Engels. El whiskey irlandés se hundió y vuelve desde aquí.", comida: true, sg: "Whiskey apto; The Fumbally marca alérgenos." }
    ]},
    { nombre: "Norte del Liffey y Howth", paradas: [
      { n: "GPO y O'Connell Street", lat: 53.3495, lng: -6.2603, tags: ["Historia","Imprescindible"], precio: 16, dur: 60, d: "La oficina de correos donde se proclamó la República en 1916, aún con agujeros de bala en las columnas, y museo dentro.", truco: "Toca los agujeros de bala de las columnas de la fachada; el museo GPO Witness History es de los mejores de la ciudad. El Spire mide 120 metros y no tiene sentido.", salseo: "Pearse leyó la Proclamación aquí a un público que no entendía nada; una semana después, la ciudad ardía. El Spire sustituye a la columna de Nelson, que el IRA voló en 1966 'con gran precisión'." },
      { n: "Museo de los Escritores y Parnell Square", lat: 53.3550, lng: -6.2640, tags: ["Museo","Fuera de ruta"], precio: 10, dur: 60, d: "La casa georgiana de los escritores irlandeses (Joyce, Beckett, Yeats, Wilde) y el jardín del recuerdo.", truco: "Al lado está el Hugh Lane, gratis, con el estudio de Francis Bacon trasladado de Londres entero, hasta el polvo. Entra por el Bacon.", salseo: "El estudio de Bacon se trasladó con 7.000 objetos catalogados, incluida la basura, y se montó en Dublín igual de caótico; el pintor había nacido aquí. Beckett tiene el carné de socio del club de críquet." },
      { n: "Howth", lat: 53.3880, lng: -6.0650, tags: ["Imprescindible","Parque","Mirador","Comida"], precio: 0, dur: 180, d: "El pueblo pesquero al final del tren (DART), con focas en el puerto y un paseo por los acantilados.", truco: "DART desde Connolly (30 min); haz el Cliff Walk (bucle de 2 h) hasta el faro de Baily y come pescado en el puerto. Marisco en Beshoff's o Octopussy's.", salseo: "Yeats vivía aquí de adolescente y se paseaba por los acantilados; Joyce sitúa en Howth la escena del 'sí' de Molly Bloom. Las focas del puerto se comen la mitad de lo que descargan los barcos y nadie se atreve a echarlas.", atardecer: true, comida: true, sg: "Marisco y pescado a la plancha, aptos; el rebozado no." },
      { n: "Phoenix Park", lat: 53.3558, lng: -6.3298, tags: ["Parque","Paseo"], precio: 0, dur: 90, d: "El mayor parque urbano cerrado de Europa: 600 ciervos en libertad, el zoo y la casa del presidente.", truco: "Alquila bici en la entrada (Parkgate St); los ciervos están hacia el obelisco de Wellington y por el centro. Los sábados, visita gratis a la casa del presidente.", salseo: "Los ciervos son de 1662 y Dublín los cuida como gatos; el obelisco de Wellington es el más alto de Europa y Wellington, que nació en Dublín, decía que nacer en un establo no te hace caballo. El Papa reunió aquí a un millón de personas en 1979.", ninos: true }
    ]}
  ]
};

      { n: "Torre Redonda (Rundetårn)", lat: 55.6813, lng: 12.5757, tags: ["Mirador","Historia"], precio: 40, dur: 40, d: "El observatorio del siglo XVII al que se sube por una rampa en espiral de 209 metros, sin escalones.", truco: "La rampa está pensada para carruajes; en el centro hay un pozo de cristal con 25 metros de caída. Mira los tejados de cobre verde.", salseo: "El zar Pedro el Grande subió a caballo en 1716 y su mujer detrás en carroza; desde entonces hay carreras de monociclos por la rampa. Tycho Brahe no, pero su alumno sí la usó para mirar el cielo." },

      { n: "Christiania", lat: 55.6736, lng: 12.5983, tags: ["Fuera de ruta","Paseo"], precio: 0, dur: 75, d: "La 'ciudad libre' en un cuartel ocupado en 1971, con casas autoconstruidas, murales y su propia bandera.", truco: "Fotos no en Pusher Street; lo bonito es el lago y las casas del lado del agua. Café Nemoland tiene conciertos gratis los domingos de verano.", salseo: "Al salir hay un cartel: 'Ahora estás entrando en la UE'. En 2024 los vecinos levantaron los adoquines de Pusher Street con el alcalde para acabar con el tráfico; la calle está en obras de reforma." },
      { n: "Canales de Christianshavn", lat: 55.6715, lng: 12.5900, tags: ["Paseo","Fuera de ruta"], precio: 0, dur: 40, d: "El barrio de canales al estilo de Ámsterdam, con barcazas vivienda y casas del XVII.", truco: "Overgaden Neden Vandet es la orilla de las casas; Lagkagehuset, la panadería de la plaza, para el kanelsnegle. Kayak de alquiler en el canal.", salseo: "Cristián IV lo construyó en 1618 como ciudad mercantil aparte, copiando Ámsterdam; el Noma original abrió en un almacén de estos canales en 2003 y cambió la cocina mundial desde aquí." },
      { n: "Reffen y el puerto", lat: 55.6935, lng: 12.6075, tags: ["Mercado","Comida","Bar"], precio: 0, dur: 90, d: "El mercado de comida callejera en contenedores del muelle de Refshaleøen, con hogueras y el atardecer sobre el puerto.", truco: "Ferry-bus del puerto (billete normal) hasta Refshaleøen; abre de abril a octubre. La Reffen sirve cerveza propia y La Banchina, al lado, tiene sauna con baño en el puerto.", salseo: "Refshaleøen era el astillero B&W, el mayor de Dinamarca, quebrado en 1996; en su nave abrió el Copenhell y el nuevo Noma está al lado. Los daneses se bañan en el puerto porque el agua es potable, casi.", atardecer: true, comida: true, sg: "Varios puestos marcados sin gluten." }

      { n: "Ny Carlsberg Glyptotek", lat: 55.6727, lng: 12.5723, tags: ["Museo","Imprescindible"], precio: 125, dur: 90, d: "El museo del cervecero Carlsberg: escultura antigua, Rodin, Gauguin y un jardín de invierno con palmeras bajo cúpula.", truco: "Martes gratis; el café del jardín de invierno es el mejor rincón para el café y la tarta de la ciudad.", salseo: "Carl Jacobsen compró Gauguins cuando nadie los quería y tiene 30; también pagó la Sirenita. Se peleó con su padre (el de Carlsberg) y fundó Ny Carlsberg: dos fábricas rivales, una familia." },
      { n: "Kødbyen", lat: 55.6685, lng: 12.5590, tags: ["Comida","Bar","Fuera de ruta"], precio: 0, dur: 90, d: "El antiguo matadero blanco convertido en galerías, bares y restaurantes, sin quitar los azulejos.", truco: "Warpigs para cerveza y barbacoa; Kødbyens Fiskebar para pescado; Mother para pizza. De día parecen naves cerradas: van desde las 17:00.", salseo: "Hasta 2006 aquí se mataban vacas; los carniceros aún operan en la parte gris y se cruzan con los hipsters en el aparcamiento. El barrio rojo de Istedgade está a una calle.", comida: true, sg: "Warpigs y Fiskebar marcan alérgenos." },

    ]},
    { nombre: "Norte: Sirenita, Kastellet y Nørrebro", paradas: [
      { n: "La Sirenita", lat: 55.6929, lng: 12.5993, tags: ["Imprescindible","Paseo"], precio: 0, dur: 20, d: "La estatua de bronce de 1,25 metros sobre una roca del puerto, pequeña como se avisa.", truco: "Llega por Langelinie a primera hora, antes de los autobuses; la 'Sirenita genéticamente modificada' de Nørgaard está a 500 metros y es más rara.", salseo: "Le han cortado la cabeza dos veces, un brazo una y la han tirado al mar con explosivos; la cabeza de 1964 nunca apareció. La modelo fue la mujer del escultor porque la bailarina se negó a posar desnuda." },
      { n: "Kastellet", lat: 55.6910, lng: 12.5940, tags: ["Parque","Historia","Paseo"], precio: 0, dur: 40, d: "La fortaleza en forma de estrella del XVII, con casas rojas, molino y foso, aún militar y abierta al paseo.", truco: "Sube a la muralla y da la vuelta entera; la iglesia de San Albano, anglicana, y la fuente de Gefion están a la salida.", salseo: "Gefion, la diosa, aró Selandia con cuatro bueyes que eran sus hijos y la separó de Suecia en una noche, según la fuente. Struensee, el médico amante de la reina, estuvo preso aquí antes de que lo descuartizaran." },
      { n: "Nyboder y el Palacio de Amalienborg", lat: 55.6840, lng: 12.5930, tags: ["Historia","Paseo"], precio: 0, dur: 45, d: "Las casas amarillas de los marineros del XVII y la plaza octogonal de la familia real con el cambio de guardia.", truco: "Cambio de guardia a las 12:00 desde Rosenborg; si la reina está, con banda. La Iglesia de Mármol al fondo tiene cúpula visitable en verano.", salseo: "Los cuatro palacios de Amalienborg eran de cuatro nobles; cuando ardió Christiansborg en 1794 la familia real se los compró en dos días y ahí siguen. La Iglesia de Mármol tardó 150 años porque se acabó el mármol." },
      { n: "Nørrebro y Assistens Kirkegård", lat: 55.6910, lng: 12.5520, tags: ["Fuera de ruta","Parque","Comida"], precio: 0, dur: 90, d: "El barrio multicultural con el cementerio parque donde están Andersen y Kierkegaard y la gente toma el sol.", truco: "Jægersborggade para cafés y tiendas; Superkilen, el parque de las tres franjas de colores, es la obra urbana más famosa del siglo. Mirabelle o Grød para comer.", salseo: "Los daneses van al cementerio a tomar el sol y a hacer picnic sobre las tumbas, es normal; Andersen y Kierkegaard están a 100 metros y nunca se hablaron. Superkilen tiene un toro español y una fuente marroquí.", comida: true, sg: "Grød hace gachas de arroz y avena sin gluten con aviso." }
    ]}
  ]
};

  claim: "Cerveza de abadía, cómic en las paredes y una plaza que corta la respiración",

  lluvia: "Museo de Bellas Artes con Brueghel y Magritte, las galerías Saint-Hubert o una cervecería histórica.",
